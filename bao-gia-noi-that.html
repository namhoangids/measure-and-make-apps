  /* ===================== DIỄN GIẢI KHỐI LƯỢNG ===================== */
  // Bảng diễn giải thuộc RIÊNG từng báo giá (q.takeoff), gom theo NHÓM MÃ — điền Mã một lần ở đầu nhóm:
  //   [ { id, code, note, rows: [ {id, label, d, r, c, n, over, note}, ... ] }, ... ]
  // Mỗi dòng con là 1 vị trí đo được: Vị trí | Dài | Rộng | Cao | SL | (khối lượng tự tính) | ghi đè.
  // Khối lượng = tích các ô kích thước CÓ nhập × SL — nhờ vậy 1 công thức dùng được cho mọi kiểu:
  //   trần 4.5×3.2 (m2) · tường 6×3.2 bỏ trống Rộng (m2) · phào chỉ nhập Dài (md) · đồ rời chỉ nhập SL (cái).
  // Tổng các dòng trong nhóm = khối lượng của mã đó; mọi dòng báo giá mang mã đó lấy đúng con số này.
  function blankTakeoffRow() {
    return { id: uid("tk"), label: "", d: "", r: "", c: "", n: "", over: "", note: "" };
  }
  function blankTakeoffGroup(code) {
    return { id: uid("tkg"), code: code || "", note: "", rows: [blankTakeoffRow()] };
  }
  // CỔNG DUY NHẤT đọc q.takeoff — mọi nơi khác (render, tổng, nhập Excel, sao lưu) đều đi qua đây,
  // nên cũng là chỗ tự chuyển dữ liệu cũ (mảng phẳng, Mã lặp ở từng dòng) sang cấu trúc nhóm.
  // Nhận diện theo cấu trúc chứ không theo cờ phiên bản → chạy lại nhiều lần vẫn an toàn, và file
  // sao lưu .json cũ khôi phục về sau cũng tự được chuyển. KHÔNG gọi saveState() ở đây: cứ để lần
  // lưu kế tiếp ghi xuống, tránh kích một vòng ghi → snapshot ngay giữa lúc đang gõ.
  function takeoffGroups(q) {
    var t = q.takeoff;
    if (!Array.isArray(t)) return (q.takeoff = []);
    if (!t.length || Array.isArray(t[0].rows)) return t;
    var byCode = {}, out = [];
    t.forEach(function (row) {
      var code = String(row.code || "").trim().toUpperCase();
      if (!byCode[code]) { byCode[code] = { id: uid("tkg"), code: code, note: "", rows: [] }; out.push(byCode[code]); }
      byCode[code].rows.push({
        id: row.id || uid("tk"), label: row.label || "",
        d: row.d || "", r: row.r || "", c: row.c || "", n: row.n || "",
        over: row.over || "", note: row.note || ""
      });
    });
    // Nhóm không có mã (dòng cũ bỏ trống Mã) đẩy xuống cuối cho đỡ vướng, nhưng không xoá — không mất dữ liệu.
    out.sort(function (a, b) { return (a.code ? 0 : 1) - (b.code ? 0 : 1); });
    return (q.takeoff = out);
  }
  /* ---------- Công thức trong ô "Ghi đè" ----------
     Ô Ghi đè nhận 2 kiểu: gõ thẳng một con số, HOẶC gõ công thức bắt đầu bằng "=" tham chiếu tới
     MÃ khác — mã đóng vai trò "địa chỉ ô" giống Excel:
        =TTC*2            gấp đôi tổng khối lượng của mã TTC
        =TTC+TX           cộng 2 mã
        =(TTC+TX)*0.3-5   ngoặc, số thập phân, trừ
        =[MDF-AC]*1.05    dùng ngoặc vuông khi mã có dấu "-" dễ lẫn với phép trừ
     KHÔNG dùng eval() — tự tách token và phân tích biểu thức, chỉ chấp nhận số, mã, + - * / ( ).
     Mã có dấu gạch ngang (MDF-AC, INOX-304) gây nhập nhằng với phép trừ, nên khi tách token ưu tiên
     khớp MÃ CÓ THẬT và khớp mã DÀI NHẤT trước; muốn chắc chắn thì bọc [ ]. */
  function isTakeoffFormula(v) { return String(v == null ? "" : v).trim().charAt(0) === "="; }
  function tkErr(msg) { var e = new Error(msg); e.tkErr = msg; return e; }

  // Mã chỉ gồm chữ số (vd đặt mã là "2") bị LOẠI khỏi danh sách nhận diện: nếu không, "=TTC*2" sẽ
  // hiểu số 2 thành mã 2 và cho kết quả sai mà không báo lỗi. Muốn trỏ tới mã dạng số phải viết [2].
  function tkKnownCodes(ctx) {
    if (ctx._codes) return ctx._codes; // dựng 1 lần cho cả lượt tính, tránh sắp xếp lại ở mỗi công thức
    ctx._codes = takeoffGroups(ctx.q)
      .map(function (g) { return String(g.code || "").trim().toUpperCase(); })
      .filter(function (c) { return c && !/^[0-9.]+$/.test(c); })
      .sort(function (a, b) { return b.length - a.length; }); // dài trước, để khớp tham lam
    return ctx._codes;
  }
  function tkTokenize(src, codes) {
    var s = String(src), i = 0, out = [];
    var isWordCh = function (ch) { return ch !== "" && /[A-Za-z0-9_\-.]/.test(ch); };
    while (i < s.length) {
      var ch = s.charAt(i);
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === "[") {
        var end = s.indexOf("]", i);
        if (end < 0) throw tkErr("THIẾU DẤU ]");
        out.push({ k: "code", v: s.slice(i + 1, end).trim().toUpperCase() });
        i = end + 1; continue;
      }
      // SỐ đọc trước MÃ — đảo lại thứ tự cũ, vì mã dạng số từng nuốt mất số hằng trong công thức.
      var num = /^[0-9]+(\.[0-9]+)?/.exec(s.slice(i));
      if (num) { out.push({ k: "num", v: parseFloat(num[0]) }); i += num[0].length; continue; }
      if ("+-*/()".indexOf(ch) >= 0 && !/[A-Za-z_]/.test(ch)) {
        // Thử khớp mã trước khi coi là toán tử, để mã bắt đầu bằng "-" vẫn dùng được qua [ ].
        var opHit = tkMatchCode(s, i, codes, isWordCh);
        if (!opHit) { out.push({ k: ch }); i++; continue; }
      }
      var hit = tkMatchCode(s, i, codes, isWordCh);
      if (hit) {
        // Nhập nhằng: chuỗi vừa khớp một mã có dấu "-" (vd MDF-AC), vừa có thể đọc là phép trừ giữa
        // hai mã có thật (MDF trừ AC). Tự đoán là cho ra số sai âm thầm → bắt người dùng nói rõ bằng [ ].
        if (hit.indexOf("-") >= 0) {
          var head = hit.split("-")[0];
          if (codes.indexOf(head) >= 0) throw tkErr("MÃ NHẬP NHẰNG " + hit + " — DÙNG [" + hit + "]");
        }
        out.push({ k: "code", v: hit }); i += hit.length; continue;
      }
      var ident = /^[A-Za-z_][A-Za-z0-9_.\-]*/.exec(s.slice(i));
      if (ident) { out.push({ k: "code", v: ident[0].toUpperCase() }); i += ident[0].length; continue; }
      throw tkErr("LỖI CÚ PHÁP");
    }
    return out;
  }
  // Khớp mã tại vị trí i, và chỉ chấp nhận khi đúng RANH GIỚI TỪ — không cho "TT" khớp giữa "TTC".
  function tkMatchCode(s, i, codes, isWordCh) {
    var rest = s.slice(i).toUpperCase();
    for (var c = 0; c < codes.length; c++) {
      var code = codes[c];
      if (!code || rest.indexOf(code) !== 0) continue;
      var after = s.charAt(i + code.length);
      if (isWordCh(after)) continue; // còn dính chữ phía sau → chưa phải mã trọn vẹn
      return code;
    }
    return null;
  }
  function tkEval(src, ctx) {
    var toks = tkTokenize(src, tkKnownCodes(ctx)), pos = 0;
    var peek = function () { return toks[pos]; };
    function parseExpr() {
      var v = parseTerm();
      while (peek() && (peek().k === "+" || peek().k === "-")) {
        var op = toks[pos++].k, rhs = parseTerm();
        v = op === "+" ? v + rhs : v - rhs;
      }
      return v;
    }
    function parseTerm() {
      var v = parseUnary();
      while (peek() && (peek().k === "*" || peek().k === "/")) {
        var op = toks[pos++].k, rhs = parseUnary();
        if (op === "/" && rhs === 0) throw tkErr("CHIA CHO 0");
        v = op === "*" ? v * rhs : v / rhs;
      }
      return v;
    }
    function parseUnary() {
      if (peek() && peek().k === "-") { pos++; return -parseUnary(); }
      if (peek() && peek().k === "+") { pos++; return parseUnary(); }
      return parsePrimary();
    }
    function parsePrimary() {
      var t = toks[pos];
      if (!t) throw tkErr("LỖI CÚ PHÁP");
      if (t.k === "num") { pos++; return t.v; }
      if (t.k === "code") { pos++; return tkCodeTotal(ctx, t.v); }
      if (t.k === "(") {
        pos++;
        var v = parseExpr();
        if (!peek() || peek().k !== ")") throw tkErr("THIẾU DẤU )");
        pos++;
        return v;
      }
      throw tkErr("LỖI CÚ PHÁP");
    }
    var val = parseExpr();
    if (pos !== toks.length) throw tkErr("LỖI CÚ PHÁP");
    if (!isFinite(val)) throw tkErr("LỖI CÚ PHÁP");
    return val;
  }

  // Ngữ cảnh tính 1 lượt: nhớ kết quả từng mã (cache) + đánh dấu mã đang tính dở (visiting) để bắt
  // tham chiếu vòng, vd ST=TTC*2 mà TTC=ST/2 — nếu không sẽ đệ quy vô tận, treo trình duyệt.
  function takeoffCtx(q) { return { q: q, cache: {}, visiting: {} }; }
  function tkCodeTotal(ctx, code) {
    code = String(code || "").trim().toUpperCase();
    if (!code) return 0;
    if (Object.prototype.hasOwnProperty.call(ctx.cache, code)) return ctx.cache[code];
    if (ctx.visiting[code]) throw tkErr("THAM CHIẾU VÒNG");
    var grps = takeoffGroups(ctx.q).filter(function (g) {
      return String(g.code || "").trim().toUpperCase() === code;
    });
    if (!grps.length) throw tkErr("KHÔNG CÓ MÃ " + code);
    ctx.visiting[code] = true;
    var sum = 0;
    try {
      grps.forEach(function (g) {
        (g.rows || []).forEach(function (r) { sum += tkRowQtyStrict(r, ctx); });
      });
    } finally { delete ctx.visiting[code]; }
    // Cộng các dòng ĐÃ làm tròn 2 số lẻ rồi chốt lại 2 số lẻ — công thức tham chiếu tới mã này sẽ
    // dùng đúng con số đang hiện ở dòng tổng của nhóm, không dùng một con số ẩn nhiều số lẻ hơn.
    ctx.cache[code] = tkRound2(sum);
    return ctx.cache[code];
  }

  // Bản "nghiêm": ném lỗi khi công thức sai — dùng bên trong quá trình tính.
  // Số thuần: chỉ nhận đúng dạng số thập phân (cho phép dấu phẩy kiểu Việt Nam). Trước đây dùng
  // Number() nên "Infinity", "1e999", "0x10" đều lọt và làm thành tiền hỏng hẳn.
  function tkParsePlainNumber(s) {
    var t = String(s).trim().replace(",", ".");
    if (!/^-?[0-9]+(\.[0-9]+)?$/.test(t)) return null;
    var v = parseFloat(t);
    return isFinite(v) ? v : null;
  }
  // Khối lượng chốt ở 2 CHỮ SỐ THẬP PHÂN, và làm tròn THẬT chứ không phải chỉ làm tròn lúc hiển thị:
  // con số dùng để tính tiền đúng bằng con số đang hiện trên màn hình. Nhờ vậy cộng tay lại các dòng
  // là ra đúng tổng, và lục lại kiểm tra được — quan trọng hơn việc giữ đủ số lẻ máy tính.
  // Đánh đổi đã biết: chuỗi công thức =A/3 rồi =B*3 sẽ ra 0,99 chứ không phải 1 — nhưng đó đúng là
  // kết quả người ta nhận được khi kiểm lại bằng tay theo các con số in ra.
  function tkRound2(v) { return Math.round((Number(v) + Number.EPSILON) * 100) / 100; }
  function tkRowQtyStrict(row, ctx) {
    var ov = String(row.over == null ? "" : row.over).trim();
    if (ov !== "") {
      if (isTakeoffFormula(ov)) {
        if (!ctx) throw tkErr("LỖI CÚ PHÁP");
        var fv = tkEval(ov.slice(1), ctx);
        if (!isFinite(fv)) throw tkErr("KẾT QUẢ KHÔNG HỢP LỆ");
        return tkRound2(fv);
      }
      var pv = tkParsePlainNumber(ov);
      if (pv === null) throw tkErr("KHÔNG PHẢI SỐ");
      return tkRound2(pv);
    }
    var dims = [row.d, row.r, row.c].map(Number).filter(function (v) { return v > 0 && isFinite(v); });
    var n = Number(row.n) > 0 && isFinite(Number(row.n)) ? Number(row.n) : null;
    if (!dims.length) return tkRound2(n || 0);
    var base = dims.reduce(function (a, b) { return a * b; }, 1);
    return tkRound2(base * (n || 1));
  }
  // Bản "hiền": không bao giờ ném — trả về {v: số} hoặc {err: "mô tả lỗi"} để hiển thị.
  function takeoffRowCell(row, ctx) {
    try { return { v: tkRowQtyStrict(row, ctx) }; }
    catch (e) { return { err: e.tkErr || "LỖI" }; }
  }
  function takeoffRowQty(row, ctx) {
    var r = takeoffRowCell(row, ctx);
    return r.err ? 0 : r.v;
  }
  function takeoffGroupCell(grp, ctx) {
    var sum = 0;
    for (var i = 0; i < (grp.rows || []).length; i++) {
      var c = takeoffRowCell(grp.rows[i], ctx);
      if (c.err) return { err: c.err };
      sum += c.v;
    }
    return { v: tkRound2(sum) };
  }
  function takeoffGroupQty(grp, ctx) {
    var c = takeoffGroupCell(grp, ctx);
    return c.err ? 0 : c.v;
  }
  // Mã nào có công thức lỗi thì KHÔNG đưa vào tổng — để dòng báo giá mang mã đó khỏi nhận số sai;
  // lỗi được hiện rõ ngay tại bảng diễn giải.
  function takeoffTotals(q) {
    var out = {}, bad = {};
    if (!q) return out;
    var ctx = takeoffCtx(q);
    takeoffGroups(q).forEach(function (grp) {
      var code = String(grp.code || "").trim().toUpperCase();
      if (!code) return;
      var c = takeoffGroupCell(grp, ctx);
      // Đánh dấu rồi xoá SAU vòng lặp, không xoá ngay: hai nhóm cùng mã mà nhóm lỗi đứng trước thì
      // `delete` lúc đó chưa có gì để xoá, nhóm sau vẫn ghi đè → tổng thiếu mà không hề báo lỗi.
      if (c.err) { bad[code] = true; return; }
      out[code] = (out[code] || 0) + c.v;
    });
    Object.keys(bad).forEach(function (code) { delete out[code]; });
    Object.keys(out).forEach(function (code) { out[code] = tkRound2(out[code]); });
    return out;
  }
  // Mã nào đang được ĐÚNG 1 dòng báo giá dùng thì an toàn; từ 2 dòng trở lên sẽ cùng nhận 1 con số
  // (Nam đã chọn cách nối "chỉ theo Mã") → dễ tính trùng tiền, nên cảnh báo ngay tại bảng diễn giải.
  function codeUsageInQuote(q, code) {
    var n = 0;
    q.sections.forEach(function (sec) {
      sec.groups.forEach(function (g) {
        g.items.forEach(function (it) {
          if (String(it.code || "").trim().toUpperCase() === code) n++;
        });
      });
    });
    return n;
  }
  // Hiển thị tối đa 2 số lẻ — và giá trị bên dưới CŨNG đã là 2 số lẻ (xem tkRound2), nên con số
  // nhìn thấy đúng bằng con số dùng để tính tiền.
  function fmtQty(v) {
    return tkRound2(v).toLocaleString("vi-VN", { maximumFractionDigits: 2 });
  }

  // Mỗi mã = 1 khối nhóm (dùng lại đúng khuôn .group-block/.group-head của bảng báo giá):
  // Mã điền 1 lần ở đầu nhóm, bên trong là các dòng vị trí.
  function renderTakeoffGroup(q, grp, idx, ctx) {
    // Nhóm chưa điền mã thì không đếm — nếu không sẽ khớp với mọi dòng báo giá cũng đang bỏ trống Mã
    // và báo cảnh báo trùng một cách vô nghĩa.
    var used = grp.code ? codeUsageInQuote(q, String(grp.code).trim().toUpperCase()) : 0;
    var rowsHtml = (grp.rows || []).length ? grp.rows.map(function (row, i) {
      var ov = String(row.over == null ? "" : row.over).trim();
      var isF = isTakeoffFormula(ov);
      var cell = takeoffRowCell(row, ctx);
      var dimDisabled = ov !== "" ? " disabled" : "";
      return '<tr data-tk="' + row.id + '" data-tk-in="' + grp.id + '">' +
        '<td class="col-stt">' + (i + 1) + '</td>' +
        '<td><input data-tf="label" value="' + escapeHtml(row.label || "") + '" placeholder="Vị trí (vd. Phòng ngủ Master)"></td>' +
        '<td><input class="num" data-tf="d" value="' + escapeHtml(row.d) + '" inputmode="decimal" placeholder="D"' + dimDisabled + '></td>' +
        '<td><input class="num" data-tf="r" value="' + escapeHtml(row.r) + '" inputmode="decimal" placeholder="R"' + dimDisabled + '></td>' +
        '<td><input class="num" data-tf="c" value="' + escapeHtml(row.c) + '" inputmode="decimal" placeholder="C"' + dimDisabled + '></td>' +
        '<td><input class="num" data-tf="n" value="' + escapeHtml(row.n) + '" inputmode="decimal" placeholder="SL"' + dimDisabled + '></td>' +
        '<td class="tk-result' + (cell.err ? " tk-bad" : "") + '" data-tk-qty>' + (cell.err ? "#" + escapeHtml(cell.err) : fmtQty(cell.v)) + '</td>' +
        '<td><input class="' + (isF ? "tk-formula" : "num") + (ov && !isF ? " tk-over" : "") + '" data-tf="over" value="' + escapeHtml(row.over) + '" placeholder="— hoặc =TTC*2" title="Gõ thẳng một con số, hoặc công thức bắt đầu bằng dấu = tham chiếu mã khác (vd. =TTC*2)"></td>' +
        '<td><input data-tf="note" value="' + escapeHtml(row.note || "") + '" placeholder="Ghi chú"></td>' +
        '<td><button class="icon-btn danger" data-tk-del-row="' + row.id + '" data-tk-in="' + grp.id + '" title="Xoá dòng">' + iconTrash() + '</button></td>' +
      '</tr>';
    }).join("") : '<tr class="empty-row"><td colspan="10">Nhóm này chưa có dòng nào.</td></tr>';
    var gCell = takeoffGroupCell(grp, ctx);

    return '<div class="group-block" data-tk-group="' + grp.id + '">' +
      '<div class="group-head">' +
        '<div class="group-head-name"><span class="roman">' + toRoman(idx + 1) + '.</span>' +
          '<input class="group-name-input tk-code-input" list="codeList" data-tk-code="' + grp.id + '" value="' + escapeHtml(grp.code || "") + '" placeholder="MÃ VẬT TƯ (vd. TTC)" title="Điền 1 lần cho cả nhóm — dòng báo giá nào mang mã này sẽ lấy tổng khối lượng bên dưới">' +
        '</div>' +
        '<span class="group-total' + (gCell.err ? " tk-bad" : "") + '" data-tk-group-total="' + grp.id + '">' +
          (gCell.err ? "#" + escapeHtml(gCell.err) : fmtQty(gCell.v) +
            (used > 1 ? ' ⚠ ' + used + ' dòng báo giá' : (used ? '' : (grp.code ? ' · chưa dùng' : '')))) + '</span>' +
        '<button class="icon-btn danger" data-tk-del-group="' + grp.id + '" title="Xoá cả nhóm mã này">' + iconTrash() + '</button>' +
      '</div>' +
      '<div class="table-wrap"><div class="table-scroll"><table class="tk-table">' +
        '<thead><tr>' +
          '<th style="width:32px"></th><th>Vị trí / diễn giải</th>' +
          '<th style="width:70px">Dài</th><th style="width:70px">Rộng</th><th style="width:70px">Cao</th><th style="width:60px">SL</th>' +
          '<th style="width:92px">Khối lượng</th><th style="width:130px">Ghi đè / công thức</th><th style="width:130px">Ghi chú</th><th style="width:40px"></th>' +
        '</tr></thead><tbody>' + rowsHtml + '</tbody>' +
      '</table></div></div>' +
      '<div class="add-item-row"><button type="button" data-tk-add-row="' + grp.id + '">' + iconPlus() + ' Thêm dòng vào nhóm này</button></div>' +
    '</div>';
  }

  function renderTakeoffPanel(q) {
    var groups = takeoffGroups(q);
    var ctx = takeoffCtx(q);
    var groupsHtml = groups.length
      ? groups.map(function (grp, i) { return renderTakeoffGroup(q, grp, i, ctx); }).join("")
      : '<div class="cell-muted" style="padding:10px 2px">Chưa có mã nào. Bấm "Thêm mã" hoặc "Nhập từ Excel".</div>';

    return '<div class="panel" style="margin-bottom:16px;">' +
      '<div class="panel-head"><h2>Diễn giải khối lượng</h2>' +
        '<button class="btn btn-sm" id="tkToggle" type="button">' + (view.takeoffOpen === false ? "Mở ra" : "Thu gọn") + '</button>' +
      '</div>' +
      (view.takeoffOpen === false ? "" :
      '<div class="panel-body">' +
        '<div class="cell-muted" style="margin-bottom:10px;font-size:11.5px">Mỗi <b>Mã</b> là một nhóm, điền mã 1 lần ở đầu nhóm; bên trong là các dòng theo từng phòng / vị trí. Khối lượng mỗi dòng = nhân các ô kích thước có nhập × SL (bỏ trống ô nào thì không tính ô đó). Tổng của nhóm tự áp cho mọi dòng báo giá mang cùng mã đó.<br>' +
          'Cột <b>Ghi đè / công thức</b>: gõ thẳng một con số, hoặc <b>công thức bắt đầu bằng dấu =</b> lấy theo mã khác — mã đóng vai trò như địa chỉ ô trong Excel. Ví dụ <code>=TTC*2</code> · <code>=TTC+TX</code> · <code>=(TTC+TX)*0.3</code> · <code>=[MDF-AC]*1.05</code> (bọc ngoặc vuông khi mã có dấu gạch ngang).</div>' +
        groupsHtml +
        '<div class="tk-sum" id="tkSum">' + takeoffChipsHtml(q) + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
          '<button class="btn btn-sm" id="tkAdd" type="button">' + iconPlus() + ' Thêm mã</button>' +
          '<button class="btn btn-sm" id="tkImport" type="button">Nhập từ Excel…</button>' +
          '<button class="btn btn-sm" id="tkTemplate" type="button">Tải file mẫu</button>' +
        '</div>' +
      '</div>') +
    '</div>';
  }

  function takeoffChipsHtml(q) {
    var totals = takeoffTotals(q);
    var codes = Object.keys(totals).sort();
    return codes.length ? codes.map(function (code) {
      var used = codeUsageInQuote(q, code);
      var warn = used > 1;
      return '<span class="tk-chip' + (warn ? " warn" : (used ? "" : " idle")) + '" title="' +
        (warn ? "Mã này đang ở " + used + " dòng báo giá — cả " + used + " dòng đều nhận cùng khối lượng này, kiểm tra kẻo tính trùng"
              : (used ? "Đang áp cho 1 dòng báo giá" : "Chưa có dòng báo giá nào dùng mã này")) + '">' +
        escapeHtml(code) + ': <b>' + fmtQty(totals[code]) + '</b>' + (warn ? " ⚠ " + used + " dòng" : (used ? "" : " · chưa dùng")) +
      '</span>';
    }).join("") : '<span class="cell-muted">Chưa có mã nào.</span>';
  }

  // Đẩy khối lượng mới xuống các dòng báo giá đang dùng mã đó, không vẽ lại cả trang (giữ con trỏ đang gõ).
  function applyTakeoffToQuoteRows(q) {
    var totals = takeoffTotals(q);
    q.sections.forEach(function (sec) {
      sec.groups.forEach(function (g) {
        g.items.forEach(function (it) {
          var code = String(it.code || "").trim().toUpperCase();
          var tk = code ? totals[code] : undefined;
          var val = (tk != null) ? tk : autoQtyFor(it);
          var rowEl = document.querySelector('[data-item="' + it.id + '"]');
          var qtyInput = rowEl && rowEl.querySelector('[data-f="qty"]');
          // Không còn nguồn tự tính (mã bị đổi/xoá, hoặc công thức của mã đó đang lỗi): phải MỞ KHOÁ
          // để nhập tay lại. Trước đây chỉ `return` — ô vẫn khoá và giữ nguyên con số cũ, tiền tiếp tục
          // tính theo số đã lỗi thời mà không sửa được, chỉ hết sau khi tải lại trang.
          if (val === null || val === undefined) {
            if (qtyInput) {
              qtyInput.disabled = false;
              qtyInput.classList.remove("computed", "from-takeoff");
              qtyInput.title = code ? "Mã \"" + code + "\" chưa có khối lượng hợp lệ trong bảng Diễn giải — nhập tay" : "";
            }
            return;
          }
          it.qty = val;
          if (!rowEl) return;
          if (qtyInput) {
            qtyInput.value = val;
            qtyInput.disabled = true;
            qtyInput.classList.add("computed");
            qtyInput.classList.toggle("from-takeoff", tk != null);
            qtyInput.title = (tk != null)
              ? "Lấy từ bảng Diễn giải khối lượng (mã " + code + ")"
              : "Tự tính từ kích thước";
          }
          var amountCell = rowEl.querySelector(".col-amount");
          if (amountCell) amountCell.textContent = moneyPlain(itemAmount(it));
        });
      });
    });
    var sumEl = document.getElementById("tkSum");
    if (sumEl) sumEl.innerHTML = takeoffChipsHtml(q);
    // Tiêu đề nhóm có kèm cảnh báo "đang dùng ở mấy dòng báo giá" — số đó đổi khi người dùng gõ Mã
    // bên bảng báo giá, nên phải vẽ lại luôn ở đây, không chỉ khi gõ trong bảng diễn giải.
    var tkCtx = takeoffCtx(q);
    takeoffGroups(q).forEach(function (grp) { refreshTakeoffGroupTotal(q, grp, tkCtx); });
    refreshAllTotals(q);
  }

  function wireTakeoff(q) {
    var toggle = document.getElementById("tkToggle");
    if (toggle) toggle.addEventListener("click", function () {
      view.takeoffOpen = (view.takeoffOpen === false);
      renderDetail();
    });
    if (view.takeoffOpen === false) return;

    var groupById = function (id) {
      return takeoffGroups(q).filter(function (x) { return x.id === id; })[0];
    };

    // Thao tác CẤU TRÚC (thêm/xoá nhóm, thêm/xoá dòng) thì vẽ lại cả màn — người dùng vừa bấm nút,
    // không đang gõ nên không sợ văng con trỏ. Còn GÕ CHỮ thì tuyệt đối không vẽ lại, chỉ vá DOM tại chỗ.
    document.getElementById("tkAdd").addEventListener("click", function () {
      takeoffGroups(q).push(blankTakeoffGroup());
      saveState(); renderDetail();
    });
    document.getElementById("tkImport").addEventListener("click", openTakeoffImport);
    document.getElementById("tkTemplate").addEventListener("click", downloadTakeoffTemplate);

    document.querySelectorAll("[data-tk-add-row]").forEach(function (b) {
      b.addEventListener("click", function () {
        var grp = groupById(b.dataset.tkAddRow);
        if (!grp) return;
        grp.rows = grp.rows || [];
        grp.rows.push(blankTakeoffRow());
        saveState(); renderDetail();
      });
    });

    document.querySelectorAll("[data-tk-del-group]").forEach(function (b) {
      b.addEventListener("click", function () {
        var grp = groupById(b.dataset.tkDelGroup);
        if (!grp) return;
        var n = (grp.rows || []).length;
        if (n > 1 && !confirm('Xoá cả nhóm mã "' + (grp.code || "(chưa có mã)") + '" cùng ' + n + ' dòng bên trong?')) return;
        q.takeoff = takeoffGroups(q).filter(function (x) { return x.id !== grp.id; });
        saveState(); renderDetail();
      });
    });

    document.querySelectorAll("[data-tk-del-row]").forEach(function (b) {
      b.addEventListener("click", function () {
        var grp = groupById(b.dataset.tkIn);
        if (!grp) return;
        grp.rows = (grp.rows || []).filter(function (x) { return x.id !== b.dataset.tkDelRow; });
        saveState(); renderDetail();
      });
    });

    // Ô Mã của nhóm: gõ tới đâu áp tới đó, KHÔNG vẽ lại. Chỉ viết hoa lại khi giá trị thực sự khác,
    // và khôi phục vị trí con trỏ — gán lại .value vô điều kiện sẽ đẩy con trỏ về cuối sau mỗi phím.
    document.querySelectorAll("[data-tk-code]").forEach(function (inp) {
      var grp = groupById(inp.dataset.tkCode);
      if (!grp) return;
      inp.addEventListener("input", function () {
        var up = inp.value.toUpperCase();
        if (inp.value !== up) {
          var pos = inp.selectionStart;
          inp.value = up;
          try { inp.setSelectionRange(pos, pos); } catch (e) {}
        }
        grp.code = up;
        refreshTakeoffCells(q);
        applyTakeoffToQuoteRows(q);
        saveState();
      });
    });

    document.querySelectorAll("tr[data-tk]").forEach(function (tr) {
      var grp = groupById(tr.dataset.tkIn);
      if (!grp) return;
      var row = (grp.rows || []).filter(function (x) { return x.id === tr.dataset.tk; })[0];
      if (!row) return;
      tr.querySelectorAll("[data-tf]").forEach(function (inp) {
        inp.addEventListener("input", function () {
          row[inp.dataset.tf] = inp.value;
          if (inp.dataset.tf === "over") {
            var ov = String(row.over).trim(), isF = isTakeoffFormula(ov);
            inp.classList.toggle("tk-over", !!ov && !isF);
            inp.classList.toggle("tk-formula", isF);
            inp.classList.toggle("num", !isF);
            // Có ghi đè / công thức thì các ô kích thước không còn tác dụng — khoá lại cho khỏi hiểu nhầm.
            tr.querySelectorAll('[data-tf="d"],[data-tf="r"],[data-tf="c"],[data-tf="n"]')
              .forEach(function (el) { el.disabled = ov !== ""; });
          }
          refreshTakeoffCells(q);
          applyTakeoffToQuoteRows(q);
          saveState();
        });
      });
    });
  }

  // Công thức tham chiếu chéo giữa các mã, nên sửa 1 ô có thể làm đổi kết quả của nhóm KHÁC.
  // Vì vậy tính lại toàn bộ trong 1 ngữ cảnh mới, thay vì chỉ vá đúng ô vừa gõ.
  function refreshTakeoffCells(q) {
    var ctx = takeoffCtx(q);
    takeoffGroups(q).forEach(function (grp) {
      (grp.rows || []).forEach(function (row) {
        var cellEl = document.querySelector('tr[data-tk="' + row.id + '"] [data-tk-qty]');
        if (!cellEl) return;
        var c = takeoffRowCell(row, ctx);
        cellEl.textContent = c.err ? "#" + c.err : fmtQty(c.v);
        cellEl.classList.toggle("tk-bad", !!c.err);
      });
      refreshTakeoffGroupTotal(q, grp, ctx);
    });
  }
  function refreshTakeoffGroupTotal(q, grp, ctx) {
    var el = document.querySelector('[data-tk-group-total="' + grp.id + '"]');
    if (!el) return;
    var c = takeoffGroupCell(grp, ctx || takeoffCtx(q));
    var used = grp.code ? codeUsageInQuote(q, String(grp.code).trim().toUpperCase()) : 0;
    el.textContent = c.err ? "#" + c.err : (fmtQty(c.v) +
      (used > 1 ? " ⚠ " + used + " dòng báo giá" : (used ? "" : (grp.code ? " · chưa dùng" : ""))));
    el.classList.toggle("tk-bad", !!c.err);
  }

  /* ---------- Diễn giải khối lượng: nhập từ Excel ---------- */
  function downloadTakeoffTemplate() {
    if (typeof XLSX === "undefined") { toast("Thư viện Excel chưa tải xong."); return; }
    var data = [
      { "Mã": "TTC", "Vị trí": "Phòng khách", "Dài": 4.5, "Rộng": 3.2, "Cao": "", "SL": 1, "Khối lượng": "", "Ghi chú": "" },
      { "Mã": "TTC", "Vị trí": "Phòng ngủ Master", "Dài": 4.2, "Rộng": 3.6, "Cao": "", "SL": 1, "Khối lượng": "", "Ghi chú": "" },
      { "Mã": "TX", "Vị trí": "Tường ngăn bếp", "Dài": 6, "Rộng": "", "Cao": 3.2, "SL": 2, "Khối lượng": "", "Ghi chú": "Bỏ trống Rộng" }
    ];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Dien giai khoi luong");
    try { XLSX.writeFile(wb, "DienGiaiKhoiLuong_mau.xlsx"); toast("Đã tải file mẫu."); }
    catch (e) { toast("Trình duyệt chặn tải file — " + e.message); }
  }
  function openTakeoffImport() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".xlsx,.xls,.csv";
    inp.addEventListener("change", function () { if (inp.files[0]) importTakeoffFile(inp.files[0]); });
    inp.click();
  }
  function importTakeoffFile(file) {
    if (typeof XLSX === "undefined") { toast("Thư viện Excel chưa tải xong."); return; }
    var q = currentQuote();
    if (!q) return;
    var fr = new FileReader();
    fr.onload = function () {
      var json;
      try {
        var wb = XLSX.read(fr.result, { type: "array" });
        json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
      } catch (e) { toast("Không đọc được file."); return; }
      if (!json.length) { toast("File rỗng."); return; }

      var alias = {
        code: ["mã", "ma", "code", "mã vật tư"],
        label: ["vị trí", "vi tri", "diễn giải", "dien giai", "hạng mục", "tên", "nội dung"],
        d: ["dài", "dai", "d", "chiều dài"],
        r: ["rộng", "rong", "r", "chiều rộng"],
        c: ["cao", "c", "chiều cao"],
        n: ["sl", "số lượng", "so luong", "sl(bộ)", "số bộ"],
        // "ghi đè" đứng TRƯỚC "khối lượng": file sao lưu có cả 2 cột, nếu "khối lượng" khớp trước thì
        // cột chứa công thức không bao giờ được đọc tới → nhập lại là mất hết công thức.
        over: ["ghi đè", "ghi de", "công thức", "cong thuc", "khối lượng", "khoi luong", "kl"],
        note: ["ghi chú", "ghi chu", "note"]
      };
      // Dò cột theo TÊN TRƯỜNG (không phải theo thứ tự cột), và mỗi cột chỉ được gán cho 1 trường.
      // Hai bẫy đã dính khi test: alias ngắn như "r" khớp kiểu "chứa" sẽ nuốt nhầm cột "Vị trí"
      // (chữ "trí" có chữ r) → alias từ 2 ký tự trở xuống chỉ nhận khi trùng KHÍT tên cột;
      // và nếu không đánh dấu cột đã dùng thì 1 cột có thể bị gán cho 2 trường cùng lúc.
      var keys = Object.keys(json[0]), colFor = {}, usedCol = {};
      Object.keys(alias).forEach(function (f) {
        for (var i = 0; i < alias[f].length; i++) {
          var a = alias[f][i];
          for (var k = 0; k < keys.length; k++) {
            if (usedCol[keys[k]]) continue;
            var kl = String(keys[k]).toLowerCase().trim();
            var ok = (a.length <= 2) ? (kl === a) : (kl === a || kl.indexOf(a) >= 0);
            if (ok) { colFor[f] = keys[k]; usedCol[keys[k]] = true; return; }
          }
        }
      });
      if (!colFor.code) { toast('Không tìm thấy cột "Mã" trong file.'); return; }

      // Gom theo Mã: mã đã có nhóm (kể cả nhóm đang có sẵn trong báo giá) thì dồn dòng vào nhóm đó.
      // Ô Mã để trống thì kế thừa mã của dòng ngay trên — hợp với thói quen gộp ô trong Excel.
      var groups = takeoffGroups(q), byCode = {}, added = 0, newGroups = 0, lastCode = "";
      groups.forEach(function (g) {
        var c = String(g.code || "").trim().toUpperCase();
        if (c && !byCode[c]) byCode[c] = g;
      });
      json.forEach(function (r) {
        var get = function (f) { return colFor[f] != null ? String(r[colFor[f]]).trim() : ""; };
        var code = get("code").toUpperCase() || lastCode;
        if (!code) return;
        lastCode = code;
        if (!byCode[code]) {
          byCode[code] = { id: uid("tkg"), code: code, note: "", rows: [] };
          groups.push(byCode[code]);
          newGroups++;
        }
        byCode[code].rows.push({
          id: uid("tk"), label: get("label"),
          d: get("d"), r: get("r"), c: get("c"), n: get("n"),
          over: get("over"), note: get("note")
        });
        added++;
      });
      if (!added) { toast("Không có dòng nào hợp lệ (cần có cột Mã)."); return; }
      saveState();
      renderDetail();
      toast("Đã nhập " + added + " dòng" + (newGroups ? " vào " + newGroups + " mã mới" : "") + ".");
    };
    fr.readAsArrayBuffer(file);
  }

  function renderSectionBlock(sec, idx) {
    var tkTotals = takeoffTotals(currentQuote());
    var groupsHtml = "";
    sec.groups.forEach(function (g, gIdx) {
      var itemsHtml = "";
      g.items.forEach(function (it, iIdx) {
        // Ưu tiên khối lượng từ bảng Diễn giải (theo Mã) — đó là ý định rõ ràng của người lập;
        // không có thì mới rơi về công thức tự tính từ kích thước của chính dòng đó.
        var tkCode = String(it.code || "").trim().toUpperCase();
        var tkQty = tkCode ? tkTotals[tkCode] : undefined;
        var fromTakeoff = tkQty != null;
        var auto = fromTakeoff ? tkQty : autoQtyFor(it);
        if (auto !== null) it.qty = auto;
        var qtyLocked = auto !== null;
        var qtyTitle = fromTakeoff ? "Lấy từ bảng Diễn giải khối lượng (mã " + tkCode + ")" : "Tự tính từ kích thước";
        var catalogEntry = findCatalogEntry(it.code);
        if (catalogEntry) {
          it.name = catalogEntry.name; it.detail = catalogEntry.detail;
          if (!it.priceOverridden) it.price = catalogEntry.price;
          if (!it.unitOverridden && catalogEntry.unit) it.unit = catalogEntry.unit;
        }
        var linkLocked = !!catalogEntry;
        itemsHtml +=
          '<tr data-item="' + it.id + '" data-group="' + g.id + '" data-section="' + sec.id + '">' +
            '<td class="col-stt">' + (iIdx + 1) + '</td>' +
            '<td class="col-code"><input class="' + (linkLocked ? "matched" : "") + '" list="codeList" data-f="code" value="' + escapeHtml(it.code || "") + '" placeholder="Mã" title="' + (catalogEntry ? escapeHtml(catalogEntry.name + " — " + money(catalogEntry.price) + "/" + catalogEntry.unit) : "Mã vật tư (vd. TTC) — tự điền tên, nội dung, đơn giá") + '">' +
              (catalogHasMedia(catalogEntry) ? '<button type="button" class="catalog-peek" data-peek="' + escapeHtml(catalogEntry.code) + '" title="Xem ảnh / liên kết vật tư">' + iconInfo() + '</button>' : '') +
            '</td>' +
            '<td class="col-name"><textarea class="' + (linkLocked ? "computed" : "") + '" data-f="name" rows="1" placeholder="Tên hạng mục"' + (linkLocked ? " disabled" : "") + '>' + escapeHtml(it.name) + '</textarea></td>' +
            '<td class="col-detail"><textarea class="' + (linkLocked ? "computed" : "") + '" data-f="detail" rows="1" placeholder="Nội dung chi tiết / quy cách"' + (linkLocked ? " disabled" : "") + '>' + escapeHtml(it.detail) + '</textarea></td>' +
            '<td class="col-size"><div class="size-inputs">' +
              '<input data-f="sizeD" value="' + escapeHtml(it.sizeD || "") + '" placeholder="D" inputmode="decimal" title="Dài (mm)">' +
              '<span>×</span>' +
              '<input data-f="sizeR" value="' + escapeHtml(it.sizeR || "") + '" placeholder="R" inputmode="decimal" title="Rộng (mm)">' +
              '<span>×</span>' +
              '<input data-f="sizeC" value="' + escapeHtml(it.sizeC || "") + '" placeholder="C" inputmode="decimal" title="Cao (mm)">' +
            '</div></td>' +
            '<td class="col-unit"><select data-f="unit">' + unitOptionsHtml(it.unit) + '</select></td>' +
            '<td class="col-num col-qty"><input class="num' + (qtyLocked ? ' computed' : '') + (fromTakeoff ? ' from-takeoff' : '') + '" data-f="qty" value="' + it.qty + '" inputmode="decimal"' + (qtyLocked ? ' disabled title="' + qtyTitle + '"' : '') + '></td>' +
            '<td class="col-num"><input class="num" data-f="price" value="' + moneyPlain(it.price) + '" inputmode="decimal" title="' + (linkLocked ? (it.priceOverridden ? "Đơn giá đã sửa riêng cho dự án này (khác bảng giá chung)" : "Gợi ý từ bảng giá theo mã — sửa được theo dự án") : "") + '"></td>' +
            '<td class="col-amount">' + moneyPlain(itemAmount(it)) + '</td>' +

            '<td class="col-del"><button class="icon-btn danger" data-del-item="' + it.id + '" data-group="' + g.id + '" data-section="' + sec.id + '">' + iconTrash() + '</button></td>' +
          '</tr>';
      });

      groupsHtml +=
        '<div class="group-block" data-group-block="' + g.id + '">' +
          '<div class="group-head">' +
            '<div class="group-head-name"><span class="roman">' + toRoman(gIdx + 1) + '.</span><input class="group-name-input" data-group-name="' + g.id + '" data-section="' + sec.id + '" value="' + escapeHtml(g.name) + '" placeholder="Tên phòng / nhóm (để trống nếu hạng mục không chia nhỏ)"></div>' +
            '<span class="group-total" data-group-total="' + g.id + '">' + money(groupTotal(g)) + '</span>' +
            (sec.groups.length > 1 ? '<button class="icon-btn danger" data-del-group="' + g.id + '" data-section="' + sec.id + '">' + iconTrash() + '</button>' : '') +
          '</div>' +
          '<div class="table-scroll"><table class="item-table">' +
            colgroupHtml() +
            '<thead><tr>' +
              '<th class="col-stt">STT' + resizeHandle("stt") + '</th>' +
              '<th class="col-code">Mã' + resizeHandle("code") + '</th>' +
              '<th class="col-name">Tên hạng mục' + resizeHandle("name") + '</th>' +
              '<th class="col-detail">Nội dung chi tiết' + resizeHandle("detail") + '</th>' +

          '</table></div>' +
          '<div class="add-item-row"><button data-add-item="' + g.id + '" data-section="' + sec.id + '">' + iconPlus() + ' Thêm dòng</button></div>' +
        '</div>';
    });

    return '<div class="cat-block" id="section-' + sec.id + '" data-cat-block="' + sec.id + '">' +
      '<div class="cat-head">' +
        '<div class="cat-head-name"><span class="stt">' + toAlpha(idx + 1) + '.</span><input class="cat-name-input" data-cat-name="' + sec.id + '" value="' + escapeHtml(sec.name) + '"></div>' +
        '<span class="cat-total" data-cat-total="' + sec.id + '">' + money(sectionTotal(sec)) + '</span>' +
        '<button class="icon-btn danger" data-del-section="' + sec.id + '">' + iconTrash() + '</button>' +
      '</div>' +
      '<div class="cat-note-row"><input data-section-note="' + sec.id + '" value="' + escapeHtml(sec.note || "") + '" placeholder="Ghi chú hạng mục (vd. Phụ lục 15)"></div>' +
      groupsHtml +
      '<div class="add-group-row"><button data-add-group="' + sec.id + '">' + iconPlus() + ' Thêm phòng / nhóm</button></div>' +
    '</div>';
  }

  function renderDetail() {
    var q = currentQuote();
    if (!q) { view.screen = "list"; renderList(); return; }

    var projectOptions = PROJECTS.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === q.projectId ? " selected" : "") + '>' + escapeHtml(p.name) + '</option>';
    }).join("");

    var statusOptions = Object.keys(STATUS_META).map(function (k) {
      return '<option value="' + k + '"' + (k === q.status ? " selected" : "") + '>' + STATUS_META[k].label + '</option>';
    }).join("");

    var sectionsHtml = q.sections.map(function (sec, idx) { return renderSectionBlock(sec, idx); }).join("");

    var subtotal = quoteTotal(q);
    var vatAmount = subtotal * (Number(q.vat) || 0) / 100;
    var grand = subtotal + vatAmount;

    var html =
      '<div class="detail-head">' +
        '<button class="back-btn" id="btnBack">' + iconBack() + ' Quay lại danh sách</button>' +
        '<span style="flex:1;"></span>' +
        '<button class="btn" id="btnExportPdf">' + iconDownload() + ' Xuất PDF</button>' +
      '</div>' +
      (q.source ? '<div class="mock-note">' + iconInfo() + ' ' + escapeHtml(q.source) + '</div>' : '') +
      '<div>' +
        '<div class="panel" style="margin-bottom:16px;">' +
          '<div class="panel-head"><h2>Thông tin báo giá</h2><span class="pill ' + STATUS_META[q.status].pill + '">' + STATUS_META[q.status].label + '</span></div>' +
          '<div class="panel-body">' +
            '<div class="field" style="margin-bottom:14px;"><label>Tên báo giá</label><input id="fName" value="' + escapeHtml(q.name) + '"></div>' +
            '<div class="form-row">' +
              '<div class="field"><label>Công trình</label><select id="fProject">' + projectOptions + '</select></div>' +
              '<div class="field"><label>Chủ đầu tư</label><input id="fClient" value="' + escapeHtml(projectById(q.projectId).client) + '" disabled></div>' +
              '<div class="field"><label>Ngày lập</label><input id="fDate" type="date" value="' + q.createdDate + '"></div>' +
              '<div class="field"><label>Trạng thái</label><select id="fStatus">' + statusOptions + '</select></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-bottom:16px;">' +
          '<div class="panel-head"><h2>Tổng hợp</h2></div>' +
          '<div class="panel-body">' +
            '<div class="totals-row">' +
              '<div class="summary-row"><span class="label">Tạm tính</span><span class="val">' + money(subtotal) + '</span></div>' +
              '<div class="summary-row"><span class="label">VAT (<input class="vat-input" id="fVat" value="' + q.vat + '">%)</span><span class="val">' + money(vatAmount) + '</span></div>' +
              '<div class="summary-row total"><span class="label">Tổng cộng</span><span class="val" id="grandTotalVal">' + money(grand) + '</span></div>' +
            '</div>' +
            '<div class="amount-words" id="amountWords">Bằng chữ: ' + escapeHtml(soThanhChu(grand)) + '.</div>' +
            '<div class="field" style="margin-top:12px;"><label>Ghi chú (hiện ở cuối trang tổng hợp khi in, trước khi sang trang chi tiết)</label><textarea id="fSummaryNote" rows="2" placeholder="Vd. Đơn giá chưa bao gồm VAT / Bảng giá có hiệu lực 30 ngày...">' + escapeHtml(q.summaryNote || "") + '</textarea></div>' +
            '<div class="status-select-wrap"><button class="btn btn-primary" id="btnSave">' + iconCheck() + ' Lưu báo giá</button></div>' +
          '</div>' +
        '</div>' +
        codeListHtml(q) +
        renderTakeoffPanel(q) +
        renderSummaryTable(q) +
        sectionsHtml +
        '<div style="display:flex; align-items:center; gap:10px; margin-top:2px;">' +
          '<button class="add-cat-btn" id="btnAddCat" style="flex:1;">' + iconPlus() + ' Thêm hạng mục</button>' +
          '<button class="btn btn-sm" id="btnOpenCatalog" type="button">' + iconInfo() + ' Thư viện vật tư</button>' +
          '<a class="btn btn-sm sheet-link-btn" href="' + PRICE_SHEET_URL + '" target="_blank" rel="noopener">' + iconExternal() + ' Dữ liệu nguồn (Sheet)</a>' +
        '</div>' +
      '</div>';

    document.getElementById("content").innerHTML = html;
    document.getElementById("crumbCurrent").textContent = q.name;

    document.getElementById("btnBack").addEventListener("click", function () { view.screen = "list"; renderList(); });
    document.getElementById("btnSave").addEventListener("click", function () { saveState(); toast("Đã lưu báo giá lên server."); });
    document.getElementById("btnExportPdf").addEventListener("click", function () { printQuote(q); });
    document.getElementById("btnOpenCatalog").addEventListener("click", function () { view.screen = "catalog"; renderCatalogScreen(); renderNav(); });
    wireTakeoff(q);

    document.getElementById("fName").addEventListener("input", function (e) { q.name = e.target.value; q.updatedDate = isoToday(); saveState(); });
    document.getElementById("fProject").addEventListener("change", function (e) { q.projectId = e.target.value; q.updatedDate = isoToday(); saveState(); renderDetail(); });
    document.getElementById("fDate").addEventListener("change", function (e) { q.createdDate = e.target.value; saveState(); });
    document.getElementById("fStatus").addEventListener("change", function (e) { q.status = e.target.value; q.updatedDate = isoToday(); saveState(); renderDetail(); });
    document.getElementById("fVat").addEventListener("input", function (e) { q.vat = Number(e.target.value) || 0; saveState(); refreshTotalsOnly(q); });
    document.getElementById("fSummaryNote").addEventListener("input", function (e) { q.summaryNote = e.target.value; q.updatedDate = isoToday(); saveState(); });

    document.querySelectorAll(".summary-row-link").forEach(function (row) {
      row.addEventListener("click", function () {
        var target = document.getElementById("section-" + row.dataset.scrollTo);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    document.getElementById("btnAddCat").addEventListener("click", function () {
      q.sections.push({ id: uid("c"), name: "Hạng mục mới", note: "", groups: [blankGroup()] });
      q.updatedDate = isoToday();
      saveState();
      renderDetail();
    });

    document.querySelectorAll("[data-del-section]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sec = q.sections.filter(function (s) { return s.id === btn.dataset.delSection; })[0];
        if (sec && confirm('Xoá hạng mục "' + sec.name + '"?')) {
          q.sections = q.sections.filter(function (s) { return s.id !== btn.dataset.delSection; });
          q.updatedDate = isoToday();
          saveState();
          renderDetail();
        }
      });
    });

    document.querySelectorAll("[data-cat-name]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var sec = q.sections.filter(function (s) { return s.id === inp.dataset.catName; })[0];
        if (sec) sec.name = inp.value;
        q.updatedDate = isoToday();
        saveState();
        var summaryName = document.querySelector('[data-summary-name="' + inp.dataset.catName + '"]');
        if (summaryName) summaryName.textContent = inp.value;
      });
    });

    document.querySelectorAll("[data-section-note]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var sec = q.sections.filter(function (s) { return s.id === inp.dataset.sectionNote; })[0];
        if (sec) sec.note = inp.value;
        q.updatedDate = isoToday();
        saveState();
        var summaryNote = document.querySelector('[data-summary-note="' + inp.dataset.sectionNote + '"]');
        if (summaryNote) summaryNote.textContent = inp.value;
      });
    });

    document.querySelectorAll("[data-add-group]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sec = q.sections.filter(function (s) { return s.id === btn.dataset.addGroup; })[0];
        if (sec) sec.groups.push(blankGroup());
        q.updatedDate = isoToday();
        saveState();
        renderDetail();
      });
    });

    document.querySelectorAll("[data-del-group]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sec = q.sections.filter(function (s) { return s.id === btn.dataset.section; })[0];
        if (sec) sec.groups = sec.groups.filter(function (g) { return g.id !== btn.dataset.delGroup; });
        q.updatedDate = isoToday();
        saveState();
        renderDetail();
      });
    });

    document.querySelectorAll("[data-group-name]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var sec = q.sections.filter(function (s) { return s.id === inp.dataset.section; })[0];
        var g = sec && sec.groups.filter(function (x) { return x.id === inp.dataset.groupName; })[0];
        if (g) g.name = inp.value;
        q.updatedDate = isoToday();
        saveState();
      });
    });

    document.querySelectorAll("[data-add-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sec = q.sections.filter(function (s) { return s.id === btn.dataset.section; })[0];
        var g = sec && sec.groups.filter(function (x) { return x.id === btn.dataset.addItem; })[0];
        if (g) g.items.push(blankItem());
        q.updatedDate = isoToday();
        saveState();
        renderDetail();
      });
    });

    document.querySelectorAll("[data-del-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sec = q.sections.filter(function (s) { return s.id === btn.dataset.section; })[0];
        var g = sec && sec.groups.filter(function (x) { return x.id === btn.dataset.group; })[0];
        if (g) g.items = g.items.filter(function (it) { return it.id !== btn.dataset.delItem; });
        q.updatedDate = isoToday();
        saveState();
        renderDetail();
      });
    });

    document.querySelectorAll(".item-table textarea").forEach(autoResizeTextarea);

    // (Đã bỏ đoạn tự điền nốt phần còn lại của mã ngay khi gõ: nó ghi đè inp.value và bôi đen sau MỖI
    //  phím, gõ rất khó chịu và không hề cho thấy có những mã nào. Thay bằng <datalist> — xem codeListHtml.)

    document.querySelectorAll("[data-peek]").forEach(function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); openCatalogPeek(b.dataset.peek); });
    });

    document.querySelectorAll(".item-table tr[data-item]").forEach(function (row) {
      row.querySelectorAll("input[data-f], select[data-f], textarea[data-f]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          var sec = q.sections.filter(function (s) { return s.id === row.dataset.section; })[0];
          var g = sec && sec.groups.filter(function (x) { return x.id === row.dataset.group; })[0];
          var it = g && g.items.filter(function (x) { return x.id === row.dataset.item; })[0];
          if (!it) return;
          var f = inp.dataset.f;
          var isNumeric = (f === "qty" || f === "price" || f === "sizeD" || f === "sizeR" || f === "sizeC");
          var rawDigits = f === "price" ? inp.value.replace(/[^0-9]/g, "") : inp.value.replace(/[^0-9.]/g, "");
          it[f] = isNumeric ? (Number(rawDigits) || 0) : inp.value;
          q.updatedDate = isoToday();
          saveState();
          if (inp.tagName === "TEXTAREA") autoResizeTextarea(inp);
          if (f === "price") {
            inp.value = moneyPlain(it.price);
            it.priceOverridden = true;
            inp.title = findCatalogEntry(it.code) ? "Đơn giá đã sửa riêng cho dự án này (khác bảng giá chung)" : "";
          }

          if (f === "unit") {
            it.unitOverridden = true;
            if (it.unit === "cái") it.qty = 1;
            renderDetail();
            return;
          }

          if (f === "sizeD" || f === "sizeR" || f === "sizeC") {
            // Dòng đang lấy khối lượng từ bảng Diễn giải thì bảng đó là nguồn duy nhất — sửa kích thước
            // ở đây KHÔNG được đè lên. Trước đây đè mất, thậm chí mở khoá cho gõ tay rồi lưu số sai.
            var tkTotals = takeoffTotals(q);
            var myCode = String(it.code || "").trim().toUpperCase();
            if (myCode && tkTotals[myCode] != null) {
              it.qty = tkTotals[myCode];
            } else {
              var auto = autoQtyFor(it);
              if (auto !== null) it.qty = auto;
              var qtyInput = row.querySelector('[data-f="qty"]');
              if (qtyInput) {
                qtyInput.value = it.qty;
                qtyInput.disabled = auto !== null;
                qtyInput.classList.toggle("computed", auto !== null);
                qtyInput.title = auto !== null ? "Tự tính từ kích thước" : "";
              }
            }
          }

          if (f === "code") {
            var entry = findCatalogEntry(it.code);
            it.priceOverridden = false; // đổi mã -> lấy giá mới theo mã, bỏ giá đã sửa riêng trước đó
            it.unitOverridden = false; // tương tự cho đơn vị tính
            var priceInput = row.querySelector('[data-f="price"]');
            var nameInput = row.querySelector('[data-f="name"]');
            var detailInput = row.querySelector('[data-f="detail"]');
            var unitSelect = row.querySelector('[data-f="unit"]');
            var qtyInputC = row.querySelector('[data-f="qty"]');
            if (entry) {
              it.name = entry.name; it.detail = entry.detail; it.price = entry.price;
              [nameInput, detailInput].forEach(function (el) {
                if (!el) return;
                el.disabled = true;
                el.classList.add("computed");
              });
              if (priceInput) { priceInput.value = moneyPlain(it.price); priceInput.title = "Gợi ý từ bảng giá theo mã — sửa được theo dự án"; }
              if (nameInput) { nameInput.value = it.name; nameInput.title = "Lấy từ bảng giá theo mã"; autoResizeTextarea(nameInput); }
              if (detailInput) { detailInput.value = it.detail; detailInput.title = "Lấy từ bảng giá theo mã"; autoResizeTextarea(detailInput); }
              if (entry.unit) {
                it.unit = entry.unit;
                if (unitSelect) unitSelect.value = it.unit;
                if (it.unit === "cái") {
                  it.qty = 1;
                  if (qtyInputC) qtyInputC.value = it.qty;
                }
              }
              inp.classList.add("matched");
              inp.title = entry.name + " — " + money(entry.price) + "/" + entry.unit;
            } else {
              [nameInput, detailInput].forEach(function (el) {
                if (!el) return;
                el.disabled = false;
                el.classList.remove("computed");
                el.title = "";
              });
              if (priceInput) priceInput.title = "";
              inp.classList.remove("matched");
              inp.title = "Mã vật tư (vd. TTC) — tự điền tên, nội dung, đơn giá";
            }
            // Đồng bộ nút "xem ảnh/liên kết" cạnh ô Mã mà không render lại cả bảng (giữ vị trí con trỏ).
            var codeCell = inp.parentElement;
            var existingPeek = codeCell.querySelector(".catalog-peek");
            if (catalogHasMedia(entry)) {
              if (!existingPeek) {
                existingPeek = document.createElement("button");
                existingPeek.type = "button";
                existingPeek.className = "catalog-peek";
                existingPeek.title = "Xem ảnh / liên kết vật tư";
                existingPeek.innerHTML = iconInfo();
                existingPeek.addEventListener("click", function (e) { e.stopPropagation(); openCatalogPeek(existingPeek.dataset.peek); });
                codeCell.appendChild(existingPeek);
              }
              existingPeek.dataset.peek = entry.code;
            } else if (existingPeek) {
              existingPeek.remove();
            }
          }

          if (f === "qty" || f === "price" || f === "sizeD" || f === "sizeR" || f === "sizeC" || f === "code") {
            var amountCell = row.querySelector(".col-amount");
            if (amountCell) amountCell.textContent = moneyPlain(itemAmount(it));
            // Gõ Mã xong phải kéo ngay khối lượng từ bảng Diễn giải về dòng này (và cập nhật lại dải tổng
            // theo mã, vì số dòng đang dùng mã đó vừa đổi) — không đợi tới lần vẽ lại trang.
            if (f === "code") applyTakeoffToQuoteRows(q);
            else refreshAllTotals(q);
          }
        });
      });
    });
  }

  function autoResizeTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function refreshAllTotals(q) {
    q.sections.forEach(function (sec) {
      sec.groups.forEach(function (g) {
        var gEl = document.querySelector('[data-group-total="' + g.id + '"]');
        if (gEl) gEl.textContent = money(groupTotal(g));
      });
      var secEl = document.querySelector('[data-cat-total="' + sec.id + '"]');
      if (secEl) secEl.textContent = money(sectionTotal(sec));
      var summaryEl = document.querySelector('[data-summary-money="' + sec.id + '"]');
      if (summaryEl) summaryEl.textContent = money(sectionTotal(sec));
    });
    var totalEl = document.querySelector('[data-summary-total-money]');
    if (totalEl) totalEl.textContent = money(quoteTotal(q));
    refreshTotalsOnly(q);
  }

  function refreshTotalsOnly(q) {
    var subtotal = quoteTotal(q);
    var vatAmount = subtotal * (Number(q.vat) || 0) / 100;
    var grand = subtotal + vatAmount;
    var rows = document.querySelectorAll(".summary-row .val");
    if (rows.length >= 3) {
      rows[0].textContent = money(subtotal);
      rows[1].textContent = money(vatAmount);
      rows[2].textContent = money(grand);
    }
    var wordsEl = document.getElementById("amountWords");
    if (wordsEl) wordsEl.textContent = "Bằng chữ: " + soThanhChu(grand) + ".";
  }

  /* ===================== XUẤT PDF (bản in riêng) ===================== */
  // Dựng 1 tài liệu tĩnh (không input/textarea) trong #printArea rồi gọi window.print() —
  // trình duyệt cho chọn "Lưu thành PDF" trong hộp thoại in. Sửa hàm này để chỉnh UI/nội dung
  // khi in: header công ty, bảng thông tin, bảng chi tiết, khối ký tên...
  // (Hàm fmtQty dùng chung khai báo 1 lần ở phần Diễn giải khối lượng — trước đây bị khai báo lại
  //  ở đây, và vì cùng một phạm vi nên bản sau đè bản trước, làm mọi số trong bảng Diễn giải mất
  //  dấu phân cách nghìn. Đã gộp làm một.)

  // GHI CHÚ CỐ ĐỊNH của bản in — giống nhau ở mọi báo giá (Nam chốt 2026-09-23). Muốn sửa nội
  // dung ghi chú gửi khách thì sửa ngay tại đây, không cần đụng vào chỗ nào khác.
  var PRINT_FIXED_NOTES = [
    { text: "Các hạng mục công việc không bao gồm trong chi phí chung (CĐT cấp không tính phí):", subs: [
      "Cung cấp mặt bằng kho tạm trong tòa nhà.",
      "Điện, nước thi công, chi phí hạ trạm, chi phí vận chuyển rác ra khỏi công trường.",
      "Nhà vệ sinh cho công nhân.",
      "Bảo hiểm chung cho công trình, bảo hiểm tài sản của CĐT, bảo hiểm bên thứ 3 và các nhà thầu khác trên công trường."
    ] },
    { text: "Hiệu lực bảng báo giá kể từ ngày gửi: 10 ngày." },
    { text: "Thời gian thi công: Thỏa thuận sau." },
    { text: "Phương thức thanh toán: Thỏa thuận sau." },
    { text: "Đơn giá sẽ được điều chỉnh nếu có bất kì sự thay đổi từ phía Chủ Đầu Tư." },
    { text: "Khối lượng nghiệm thu thực tế, những hạng mục và khối lượng không bao gồm trong báo giá được xem như phát sinh." },
    { text: "Toàn bộ phát sinh sẽ thực hiện khi có sự đồng ý, kí duyệt của Chủ Đầu Tư." },
    { text: "Thời gian bảo hành 12 tháng." }
  ];

  // Header của bản in — dùng ở 2 chỗ:
  //   · trong <thead> của bảng bọc ngoài → khi IN, trình duyệt tự lặp nó ở đầu mọi trang giấy;
  //   · đầu mỗi .print-page → chỉ để XEM TRƯỚC trên màn hình (khi in thì ẩn đi).
  function printRunHeadHtml(q) {
    return '<div class="print-runhead">' +
      '<div class="print-brand">' +
        '<img class="print-logo" src="' + LOGO_MARK_DARK + '" alt="measure &amp; make">' +
        '<div class="print-brand-word">measure<span>&amp;</span>make</div>' +
      '</div>' +
      '<div class="print-doc-meta">' +
        '<div>Số: ' + escapeHtml(q.code || "—") + '</div>' +
        '<div>Ngày lập: ' + fmtDate(q.createdDate) + '</div>' +
      '</div>' +
    '</div>';
  }

  function printNotesHtml() {
    var items = PRINT_FIXED_NOTES.map(function (n, i) {
      var subs = (n.subs && n.subs.length)
        ? '<ul>' + n.subs.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join("") + '</ul>'
        : "";
      return '<div class="nt-item"><span class="nt-no">' + (i + 1) + '/.</span>' +
        '<div class="nt-body">' + escapeHtml(n.text) + subs + '</div></div>';
    }).join("");
    return '<div class="print-notes"><div class="nt-title">Ghi chú:</div>' + items + '</div>';
  }

  function buildPrintHtml(q) {
    var p = projectById(q.projectId);
    var meta = STATUS_META[q.status] || { label: "—" };
    var subtotal = quoteTotal(q);
    var vatPct = Number(q.vat) || 0;
    var vatAmount = subtotal * vatPct / 100;
    var grand = subtotal + vatAmount;

    // Bảng hạng mục ở trang 1: chỉ còn các dòng A→K. Tổng/Tạm tính/VAT/Bằng chữ đã chuyển lên khối
    // .print-total-block ở đầu trang (Nam yêu cầu 2026-09-24: thể hiện tổng giá trị dự toán trước tiên).
    var summaryRows = q.sections.map(function (sec, idx) {
      return '<tr>' +
        '<td class="center">' + toAlpha(idx + 1) + '</td>' +
        '<td>' + escapeHtml(sec.name) + '</td>' +
        '<td class="num">' + money(sectionTotal(sec)) + '</td>' +
        '<td class="center">' + escapeHtml(sec.note || "") + '</td>' +
      '</tr>';
    }).join("");

    var totalBlockHtml =
      '<div class="print-total-block">' +
        '<div class="tb-eyebrow">Tổng giá trị dự toán</div>' +
        '<div class="tb-row">' +
          '<div class="tb-grand">' + money(grand) + '</div>' +
          '<div class="tb-parts">' +
            '<div><span>Tạm tính</span><b>' + money(subtotal) + '</b></div>' +
            '<div><span>VAT ' + vatPct + '%</span><b>' + money(vatAmount) + '</b></div>' +
          '</div>' +
        '</div>' +
        '<div class="tb-words"><b>Bằng chữ:</b> ' + escapeHtml(soThanhChu(grand)) + '.</div>' +
      '</div>';

    var sectionsHtml = q.sections.map(function (sec, sIdx) {
      var groupsHtml = sec.groups.map(function (g, gIdx) {
        var itemRows = g.items.map(function (it, iIdx) {
          var sizeParts = [it.sizeD, it.sizeR, it.sizeC].filter(function (v) { return v !== "" && v != null; });
          var sizeText = sizeParts.join(" × ");
          return '<tr>' +
            '<td class="center">' + (iIdx + 1) + '</td>' +
            '<td class="name-cell"><b>' + escapeHtml(it.name || "") + '</b>' + (it.detail ? '<span class="detail-line">' + escapeHtml(it.detail) + '</span>' : "") + '</td>' +
            '<td class="center">' + escapeHtml(sizeText) + '</td>' +
            '<td class="center">' + escapeHtml(it.unit || "") + '</td>' +
            '<td class="num">' + fmtQty(it.qty) + '</td>' +
            '<td class="num">' + moneyPlain(it.price) + '</td>' +
            '<td class="num">' + moneyPlain(itemAmount(it)) + '</td>' +
            '<td class="center">' + escapeHtml(it.note || "") + '</td>' +
          '</tr>';
        }).join("");
        return (g.name ? '<div class="print-group-title">' + toRoman(gIdx + 1) + '. ' + escapeHtml(g.name) + '</div>' : "") +
          '<table class="print-item-table">' +
            printColgroupHtml() +
            '<thead><tr>' +
              '<th class="center">STT</th><th>Tên hạng mục / Nội dung chi tiết</th>' +
              '<th class="center">Kích thước</th><th class="center">ĐVT</th><th class="center">KL</th>' +
              '<th class="num">Đơn giá</th><th class="num">Thành tiền</th><th class="center">Ghi chú</th>' +
            '</tr></thead>' +
            '<tbody>' + itemRows + '</tbody>' +
          '</table>' +
          '<div class="print-group-total">Cộng: ' + money(groupTotal(g)) + '</div>';
      }).join("");
      // Mỗi hạng mục = 1 TRANG GIẤY riêng, tiêu đề in hoa đúng tên hạng mục ở bảng tổng hợp.
      return '<tr><td><section class="print-page">' +
        printRunHeadHtml(q) +
        '<div class="print-block-title"><span class="print-letter">' + toAlpha(sIdx + 1) + '</span><h2>' + escapeHtml(sec.name) + '</h2></div>' +
        '<div class="print-section-note">' + escapeHtml(sec.note || "") + '</div>' +
        '<div class="print-section">' +
          groupsHtml +
          '<div class="print-cat-total">Cộng hạng mục ' + toAlpha(sIdx + 1) + ': ' + money(sectionTotal(sec)) + '</div>' +
        '</div>' +
      '</section></td></tr>';
    }).join("");

    return (
      '<div class="print-doc"><table class="print-sheet">' +
        '<thead><tr><td>' + printRunHeadHtml(q) + '</td></tr></thead>' +
        '<tbody>' +
        '<tr><td><section class="print-page">' +
          printRunHeadHtml(q) +
          '<div class="print-meta">' +
            '<div class="col-left">' +
              '<div><span class="lbl">Chủ đầu tư:</span> ' + escapeHtml(p && p.client ? p.client : "—") + '</div>' +
              '<div><span class="lbl">Địa chỉ:</span> ' + escapeHtml(p && p.address ? p.address : "—") + '</div>' +
            '</div>' +
            '<div class="col-right">' +
              '<div><span class="lbl">Trạng thái:</span> ' + escapeHtml(meta.label) + '</div>' +
              '<div><span class="lbl">Cập nhật:</span> ' + fmtDate(q.updatedDate) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="print-title">Bảng tổng hợp dự toán thi công hoàn thiện</div>' +
          '<div class="print-subtitle">' + escapeHtml(p ? p.name : q.name) + '</div>' +
          '<div class="print-intro">INDUST DESIGN trân trọng gửi dự toán thi công hoàn thiện công trình chi tiết như sau:</div>' +
          totalBlockHtml +
          '<table class="print-summary-table">' +
            '<thead><tr><th class="center" style="width:7%;">STT</th><th>Hạng mục</th><th class="num" style="width:22%;">Giá trị (VNĐ)</th><th class="center" style="width:15%;">Ghi chú</th></tr></thead>' +
            '<tbody>' + summaryRows + '</tbody>' +
          '</table>' +
          (q.summaryNote ? '<div class="print-summary-note">' + escapeHtml(q.summaryNote) + '</div>' : "") +
          printNotesHtml() +
          '<div class="print-signoff">' +
            '<div class="sign-block"><div class="sign-title">Ý KIẾN KHÁCH HÀNG</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></div>' +
            '<div class="sign-block"><div class="sign-title">INDUST DESIGN</div><div class="sign-sub">measure &amp; make<br>(Ký, ghi rõ họ tên)</div></div>' +
          '</div>' +
        '</section></td></tr>' +
        sectionsHtml +
        '</tbody>' +
      '</table></div>'
    );
  }

  // Artifact chặn cả window.print() lẫn window.open() gọi từ script (đã kiểm chứng thực tế, kể cả
  // trong trình duyệt thật, không riêng gì VS Code) — không có cách nào tự bật hộp thoại in bằng
  // code. Giải pháp: chuyển sang màn "xem trước khi in" ngay trong trang, rồi người dùng tự bấm
  // Ctrl+P / Cmd+P — đây là phím tắt gốc của trình duyệt nên không bị sandbox chặn.
  function printQuote(q) {
    view.screen = "print";
    view.printId = q.id;
    renderPrintPreview();
  }

  function renderPrintPreview() {
    var q = state.quotes.filter(function (x) { return x.id === view.printId; })[0];
    if (!q) { view.screen = "list"; renderList(); return; }

    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "");
    var shortcut = isMac ? "Cmd + P" : "Ctrl + P";

    var html =
      '<div class="print-toolbar no-print">' +
        '<button class="btn" id="btnBackFromPrint">' + iconBack() + ' Quay lại</button>' +
        '<div class="print-hint">Bấm <b>' + shortcut + '</b> để mở hộp thoại in của trình duyệt, sau đó chọn "Lưu thành PDF" (Save as PDF).</div>' +
      '</div>' +
      buildPrintHtml(q);

    document.getElementById("content").innerHTML = html;
    document.getElementById("crumbCurrent").textContent = "Xem trước bản in";
    document.getElementById("btnBackFromPrint").addEventListener("click", function () {
      view.screen = "detail";
      renderDetail();
    });
  }

  /* ===================== ICONS ===================== */

  function iconPlus() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconDownload() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>'; }
  function iconSearch() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'; }
  function iconEdit() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>'; }
  function iconTrash() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>'; }
  function iconBack() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'; }
  function iconCheck() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; }
  function iconInfo() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".2" fill="currentColor" stroke-width="1.6"/></svg>'; }
  function iconSun() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.85 1.85M17.95 17.95l1.85 1.85M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.85-1.85M17.95 6.05l1.85-1.85"/></svg>'; }
  function iconMoon() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 119.5 4a6.8 6.8 0 0010.5 10.5z"/></svg>'; }
  function iconExternal() { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>'; }
  function iconSync() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 006.5 6.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0013.5 4.5L20 15"/><path d="M20 20v-5h-5"/></svg>'; }
  function iconClose() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }

  /* ===================== INIT ===================== */

  setupColumnResize();
})();
</script>


</body></html>
