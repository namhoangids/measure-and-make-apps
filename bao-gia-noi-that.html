<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#ececed;color:#1d1f20}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>M&amp;M Báo Giá Nội Thất</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap');

  /* Họ màu nền / viền / chữ lấy đúng theo app FF&E (bộ token Industry) để 2 app nhìn cùng một hệ.
     Trước đây bên này dùng tông kem ấm (#F2F1EC / #E7E2D5), FF&E dùng xám trung tính.
     Màu nhấn (accent) và màu trạng thái (good/warn) giữ nguyên của app này. */
  :root {
    --paper: #ececed;
    --surface: #ffffff;
    --surface-2: #eeeef1;
    --sidebar: #ffffff;
    --sidebar-line: #e4e4e7;
    --sidebar-text: #5a5a5d;
    --sidebar-text-dim: #9a9a9d;
    --sidebar-active: #f4f4f7;
    --sidebar-heading: #1d1f20;
    --ink: #1d1f20;
    --ink-soft: #5a5a5d;
    --ink-mute: #7a7a7d;
    --border: #d2d2d6;
    --border-soft: #e4e4e7;
    --accent: #24507A;
    --accent-ink: #ffffff;
    --accent-soft: #DCE7F0;
    --accent-soft-border: #B7CFE0;
    --good: #2f7d5d;
    --good-soft: #dfeee6;
    --warn: #a8722f;
    --warn-soft: #f3e6d3;
    --neutral-pill: #eeeef1;
    --shadow: 0 1px 2px rgba(20,24,28,.06), 0 6px 20px rgba(20,24,28,.05);
    --shadow-lift: 0 10px 34px rgba(20,24,28,.14);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131517;
      --surface: #1b1e21;
      --surface-2: #25292e;
      --sidebar: #1b1e21;
      --sidebar-line: #2c3035;
      --sidebar-text: #b6b6b9;
      --sidebar-text-dim: #74747a;
      --sidebar-active: #202327;
      --sidebar-heading: #e9e9ea;
      --ink: #e9e9ea;
      --ink-soft: #b6b6b9;
      --ink-mute: #96969a;
      --border: #3a3f45;
      --border-soft: #2c3035;
      --accent: #6FA8D6;
      --accent-ink: #131517;
      --accent-soft: #1F3A50;
      --accent-soft-border: #2C4A63;
      --good: #6fbb96;
      --good-soft: #1c3128;
      --warn: #d4a35f;
      --warn-soft: #382c19;
      --neutral-pill: #25292e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --shadow-lift: 0 10px 34px rgba(0,0,0,.5);
    }
  }

  :root[data-theme="dark"] {
    --paper: #131517;
    --surface: #1b1e21;
    --surface-2: #25292e;
    --sidebar: #1b1e21;
    --sidebar-line: #2c3035;
    --sidebar-text: #b6b6b9;
    --sidebar-text-dim: #74747a;
    --sidebar-active: #202327;
    --sidebar-heading: #e9e9ea;
    --ink: #e9e9ea;
    --ink-soft: #b6b6b9;
    --ink-mute: #96969a;
    --border: #3a3f45;
    --border-soft: #2c3035;
    --accent: #6FA8D6;
    --accent-ink: #131517;
    --accent-soft: #1F3A50;
    --accent-soft-border: #2C4A63;
    --good: #6fbb96;
    --good-soft: #1c3128;
    --warn: #d4a35f;
    --warn-soft: #382c19;
    --neutral-pill: #25292e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lift: 0 10px 34px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft-border); }

  h1, h2, h3 { font-family: 'Barlow', sans-serif; letter-spacing: .01em; text-wrap: balance; margin: 0; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 18px 22px;
    border-bottom: 1px solid var(--sidebar-line);
  }
  .brand-mark { height: 45px; width: auto; flex-shrink: 0; display: block; }
  .brand-word { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px; color: var(--sidebar-heading); letter-spacing: .01em; line-height: 1.3; }
  .brand-word span { color: var(--sidebar-text-dim); font-weight: 400; }

  .theme-toggle {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .12s ease, background .12s ease, color .12s ease;
  }
  .theme-toggle:hover { border-color: var(--ink-mute); color: var(--ink); background: var(--surface-2); }

  .nav { flex: 1; padding: 14px 10px 18px; }
  .nav-group { margin-bottom: 18px; }
  .nav-group-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--sidebar-text-dim);
    padding: 0 10px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    background: transparent;
    border: none;
    color: var(--sidebar-text);
    font-family: inherit;
    font-size: 13.3px;
    text-align: left;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--sidebar-active); color: var(--sidebar-heading); }
  .nav-item.active { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .nav-item.disabled { cursor: default; opacity: .62; }
  .nav-item.disabled:hover { background: transparent; color: var(--sidebar-text); }
  .nav-item .soon {
    font-size: 9.5px;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--sidebar-line);
    color: var(--sidebar-text-dim);
    letter-spacing: .03em;
    white-space: nowrap;
  }

  .sidebar-foot {
    border-top: 1px solid var(--sidebar-line);
    padding: 12px 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .sidebar-foot-text { line-height: 1.35; min-width: 0; }
  .sidebar-foot-name { font-size: 13px; color: var(--sidebar-heading); font-weight: 500; }
  .sidebar-foot-role { font-size: 11.5px; color: var(--sidebar-text-dim); }
  .sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 5px; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--ink-mute);
  }
  .crumbs b { color: var(--ink-soft); font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .trial-chip { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft-border); padding: 3px 10px; border-radius: 20px; font-size: 11.5px; }

  .content { padding: 26px 28px 60px; max-width: 1320px; width: 100%; margin: 0 auto; }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 6px; }
  .page-head h1 { font-size: 27px; font-weight: 700; color: var(--ink); }
  .page-sub { color: var(--ink-mute); font-size: 12.8px; margin-top: 6px; max-width: 620px; }
  .head-actions { display: flex; gap: 10px; flex-shrink: 0; }

  button { font-family: inherit; cursor: pointer; }
  .btn {
    font-size: 13.3px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .12s ease, background .12s ease;
  }
  .btn:hover { border-color: var(--ink-mute); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
  .btn-sm { padding: 6px 11px; font-size: 12.3px; }
  .btn-danger-ghost { color: #b5473f; }
  .btn-danger-ghost:hover { background: #f6e6e4; border-color: #eccbc7; }
  :root[data-theme="dark"] .btn-danger-ghost:hover { background: #3a2422; border-color: #5c332e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger-ghost:hover { background: #3a2422; border-color: #5c332e; } }

  /* ---------- Stat tiles ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0 26px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat-label { font-size: 11.5px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .stat-value { font-family: 'Barlow', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.accent { color: var(--accent); }
  .stat-foot { font-size: 11.5px; color: var(--ink-mute); margin-top: 4px; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
  .tab { border: none; background: transparent; padding: 7px 14px; border-radius: 7px; font-size: 12.8px; color: var(--ink-mute); font-weight: 500; }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .toolbar-right { display: flex; align-items: center; gap: 10px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-width: 240px; }
  .search-box input { border: none; background: transparent; outline: none; font-family: inherit; font-size: 13px; color: var(--ink); width: 100%; }
  .search-box input::placeholder { color: var(--ink-mute); }
  .search-box svg { flex-shrink: 0; color: var(--ink-mute); }

  /* ---------- Table ---------- */
  .table-wrap { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 880px; }
  thead th {
    text-align: left; font-size: 10.8px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-mute); padding: 12px 16px; border-bottom: 1px solid var(--border-soft); white-space: nowrap;
    background: var(--surface-2);
  }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border-soft); vertical-align: top; font-size: 13.2px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.row-click { cursor: pointer; }
  tbody tr.row-click:hover td { background: var(--surface-2); }
  .cell-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-mute); }
  .cell-title { font-weight: 500; color: var(--ink); }
  .cell-money { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cell-muted { color: var(--ink-mute); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-good { background: var(--good-soft); color: var(--good); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-neutral { background: var(--neutral-pill); color: var(--ink-mute); }

  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--ink-mute); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { background: #f6e6e4; color: #b5473f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon-btn.danger:hover { background: #3a2422; color: #e08d84; } }
  :root[data-theme="dark"] .icon-btn.danger:hover { background: #3a2422; color: #e08d84; }

  .empty-row td { padding: 60px 20px; text-align: center; color: var(--ink-mute); font-size: 13.3px; }

  .mock-note {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-mute);
    background: var(--accent-soft); border: 1px solid var(--accent-soft-border); color: var(--accent);
    padding: 8px 14px; border-radius: 8px; margin-bottom: 20px; width: fit-content;
  }

  /* ---------- Detail / editor view ---------- */
  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-mute); background: transparent; border: none; font-size: 12.8px; font-weight: 500; padding: 6px 4px; }
  .back-btn:hover { color: var(--ink); }

  .editor-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; }
  .panel-head h2 { font-size: 16px; font-weight: 600; color: var(--ink); }
  .panel-body { padding: 18px 20px; }

  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--paper); color: var(--ink); font-family: inherit; font-size: 13.3px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 54px; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

  .cat-block { border: 1px solid var(--border-soft); border-radius: 9px; margin-bottom: 14px; overflow: hidden; }
  .cat-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 11px 14px; background: var(--surface-2); }
  .cat-head-name { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
  .cat-head-name .stt { font-size: 11.5px; color: var(--ink-mute); font-weight: 600; flex-shrink: 0; }
  .cat-head input.cat-name-input { background: transparent; border: none; font-weight: 600; font-size: 13.5px; color: var(--ink); font-family: inherit; outline: none; width: 100%; }
  .cat-total { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .cat-note-row { padding: 0 14px 10px; background: var(--surface-2); }
  .cat-note-row input {
    width: 100%; background: transparent; border: 1px dashed var(--border); border-radius: 6px; padding: 6px 9px;
    font-family: inherit; font-size: 11.8px; color: var(--ink-mute); outline: none;
  }
  .cat-note-row input:focus { border-style: solid; border-color: var(--accent); color: var(--ink); }

  .group-block { border-top: 1px solid var(--border-soft); }
  .group-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 9px 14px; background: var(--paper); }
  .group-head-name { display: flex; align-items: baseline; gap: 7px; flex: 1; min-width: 0; }
  .group-head-name .roman { font-size: 11px; color: var(--ink-mute); font-weight: 600; flex-shrink: 0; }
  .group-head input.group-name-input {
    flex: 1; min-width: 0; background: transparent; border: none; font-weight: 500; font-size: 12.6px;
    color: var(--ink-soft); font-family: inherit; outline: none;
  }
  .group-head input.group-name-input::placeholder { font-style: italic; color: var(--ink-mute); }
  .group-total { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 12.2px; color: var(--ink-mute); white-space: nowrap; flex-shrink: 0; }
  .add-group-row { padding: 6px 14px 10px; background: var(--paper); }
  .add-group-row button, .add-item-row button { font-size: 12px; color: var(--ink-mute); background: transparent; border: none; }
  .add-group-row button:hover, .add-item-row button:hover { color: var(--accent); }

  .item-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .item-table th { position: relative; font-size: 10.3px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-mute); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  .item-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; overflow: hidden; }
  .item-table tr:last-child td { border-bottom: none; }
  .item-table input, .item-table select, .item-table textarea {
    width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 7px; border-radius: 6px;
    font-family: inherit; font-size: 12.6px; color: var(--ink); outline: none;
  }
  .item-table textarea {
    resize: none; overflow: hidden; display: block; line-height: 1.4; min-height: 30px;
  }
  .item-table input:hover, .item-table select:hover, .item-table textarea:hover { border-color: var(--border); }
  .item-table input:focus, .item-table select:focus, .item-table textarea:focus { border-color: var(--accent); background: var(--surface); }
  .item-table input.num { text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .item-table input.num.computed { color: var(--ink-mute); background: var(--surface-2); cursor: not-allowed; }
  .item-table textarea.computed { color: var(--ink-mute); cursor: not-allowed; }
  .item-table .col-stt { text-align: center; color: var(--ink-mute); font-size: 12px; padding-top: 12px; }
  .item-table th.col-stt, .item-table th.col-code, .item-table th.col-size, .item-table th.col-unit, .item-table th.col-qty { text-align: center; }
  .item-table .col-code input { font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; text-align: center; }
  .item-table .col-code input.matched { color: var(--accent); font-weight: 600; }
  .item-table .col-detail textarea { color: var(--ink-soft); font-size: 12.2px; }
  .item-table .col-unit select { text-align: center; text-align-last: center; }
  .item-table .col-qty input.num { text-align: center; }
  .size-inputs { display: flex; align-items: center; gap: 3px; }
  .size-inputs input { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 6px 2px; width: auto; flex: 1 1 0; min-width: 18px; }
  .size-inputs input::placeholder { color: var(--ink-mute); font-style: italic; }
  .size-inputs span { color: var(--ink-mute); font-size: 10px; flex-shrink: 0; }
  .item-table .col-amount { text-align: right; padding-top: 12px; padding-right: 12px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); white-space: nowrap; }
  /* Bảng diễn giải khối lượng */
  .tk-table input { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 12px; color: var(--ink); }
  .tk-table input:hover { border-color: var(--border-soft); }
  .tk-table input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .tk-table input.num { text-align: right; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .tk-table input.tk-over { color: var(--warn); font-weight: 600; }
  .tk-table input.tk-formula { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-weight: 600; text-align: left; }
  .tk-table input:disabled { opacity: .35; }

  .add-item-row { padding: 8px 12px 10px; }
  .add-cat-btn { width: 100%; border: 1.5px dashed var(--border); background: transparent; color: var(--ink-mute); border-radius: 9px; padding: 12px; font-size: 12.8px; font-weight: 500; }

  .summary-table-wrap { margin-bottom: 16px; }
  .summary-table-wrap table { width: 100%; border-collapse: collapse; }
  .summary-table-wrap th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-mute); padding: 9px 14px; border-bottom: 1px solid var(--border-soft); background: var(--surface-2); }
  .summary-table-wrap td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); font-size: 12.8px; vertical-align: top; }
  .summary-table-wrap tr:last-child td { border-bottom: none; }
  .summary-table-wrap .stt-col { width: 34px; color: var(--ink-mute); }
  .summary-table-wrap .money-col { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .summary-table-wrap .note-col { color: var(--ink-mute); font-size: 12px; white-space: nowrap; }
  .summary-table-wrap tr.summary-total td { font-weight: 700; border-top: 1px solid var(--border); border-bottom: none; background: var(--surface-2); }
  .summary-table-wrap tr.summary-row-link { cursor: pointer; }

  .totals-row { display: flex; flex-wrap: wrap; gap: 6px 40px; }
  .summary-row { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-soft); }
  .summary-row.total { font-size: 19px; font-weight: 700; color: var(--ink); }
  .summary-row .label { white-space: nowrap; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-mute); }
  .summary-row .val { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vat-input { width: 56px; text-align: right; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 12.6px; outline: none; }

  .amount-words { font-size: 11.5px; font-style: italic; color: var(--ink-mute); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-soft); }

  .status-select-wrap { margin-top: 16px; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--paper); padding: 11px 20px; border-radius: 9px; font-size: 12.8px; font-weight: 500; box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Sync modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,18,21,.5); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .modal-panel { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow-lift); width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
  .modal-head h3 { font-size: 16px; font-weight: 600; color: var(--ink); }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-steps { margin: 0 0 14px; padding-left: 18px; color: var(--ink-soft); font-size: 12.6px; line-height: 1.6; }
  .sync-textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 11.8px; padding: 10px 12px; outline: none; }
  .sync-textarea:focus { border-color: var(--accent); }
  .sync-status { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--warn); }
  .form-hint { font-size: 11.8px; color: var(--ink-mute); margin-top: 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border-soft); }

  /* ---------- Thư viện vật tư: ảnh + liên kết theo mã (mã cố định, gọi lại được nhiều dự án) ---------- */
  .cell-thumb-img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-soft); display: block; }
  .cell-thumb-ph { width: 38px; height: 38px; border-radius: 6px; border: 1px dashed var(--border-soft); background: var(--surface-2); display: block; }
  .cat-thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .cat-thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-soft); }
  .cat-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cat-thumb button { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; border: 0; background: rgba(20,24,28,.6); color: #fff; font-size: 11px; line-height: 16px; padding: 0; }
  .cat-thumb-add { width: 64px; height: 64px; border-radius: 8px; border: 1.5px dashed var(--border); background: transparent; color: var(--ink-mute); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .cat-thumb-add:hover { border-color: var(--accent); color: var(--accent); }
  .cat-link-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border-soft); font-size: 12.6px; }
  .cat-link-row a { color: var(--accent); text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .cat-link-row a:hover { text-decoration: underline; }
  .cat-link-row button { border: 0; background: transparent; color: var(--ink-mute); flex-shrink: 0; display: flex; }
  .cat-link-row button:hover { color: #b5473f; }
  .item-table .col-code { position: relative; }
  .catalog-peek { position: absolute; top: 2px; right: 1px; width: 15px; height: 15px; padding: 0; border: 0; background: transparent; color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .catalog-peek svg { width: 11px; height: 11px; }
  .catalog-peek:hover { color: var(--ink); }
  .peek-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .peek-gallery img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-soft); cursor: zoom-in; }
  .lightbox-overlay { position: fixed; inset: 0; background: rgba(10,12,14,.82); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 24px; cursor: zoom-out; }
  .lightbox-overlay img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

  @media (max-width: 980px) {
    .editor-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- Mobile: sidebar trở thành ngăn kéo (off-canvas) ---------- */
  .menu-toggle {
    display: none;
    width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    align-items: center; justify-content: center;
  }
  .menu-toggle:hover { border-color: var(--ink-mute); }
  .sidebar-scrim {
    position: fixed; inset: 0; background: rgba(10,12,14,.5); z-index: 65;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .sidebar-scrim.show { opacity: 1; pointer-events: auto; }
  @media (max-width: 860px) {
    .menu-toggle { display: flex; }
    .sidebar {
      position: fixed; left: 0; top: 0; z-index: 70;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: var(--shadow-lift);
    }
    .sidebar.open { transform: translateX(0); }
    .topbar { flex-wrap: wrap; row-gap: 8px; padding: 12px 16px; }
    .trial-chip { display: none; }
    .content { padding: 18px 16px 40px; }
    .page-head { flex-wrap: wrap; }
  }

  /* ---------- Bản in / xuất PDF ---------- */
  /* Artifact chặn window.print()/window.open() gọi từ script (đã kiểm chứng thực tế) — nên không
     thể tự bật hộp thoại in bằng code. Cách hoạt động thật: bấm "Xuất PDF" chuyển sang màn xem
     trước (bản in sạch, không input/textarea) ngay trong trang; người dùng tự bấm Ctrl+P (Cmd+P
     trên Mac) — đây là hành động gốc của trình duyệt, không bị sandbox chặn. */
  .print-toolbar { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 18px; }
  .print-toolbar .print-hint { font-size: 12.8px; color: var(--accent); }
  .print-toolbar .print-hint b { font-family: 'IBM Plex Mono', monospace; }
  /* Toàn bộ bản in dùng màu cố định (không theo var(--...) đổi theo theme sáng/tối của app) —
     đây là bản mô phỏng TỜ GIẤY TRẮNG sẽ in ra, nên luôn phải trông giống nhau bất kể app đang ở
     theme nào lúc xem trước.
     BẢNG MÀU + FONT bản in (Nam duyệt bản nháp 2026-09-24, lấy từ tài liệu review của Nam):
       cam #F15A22 (điểm nhấn + MỌI đường kẻ) · chữ than-xanh #22333B (không dùng đen tuyệt đối)
       xám ấm #8C8178 / #62707A (chữ phụ) · nền vằn #F7F6F3 · font Montserrat.
     ĐƯỜNG KẺ: mọi đường ngang = cam, dày --print-hair (0.5px, mảnh nhất trình duyệt còn vẽ khi in A4);
     kẻ dọc giữa các cột = nét đứt cam. KHÔNG có viền bao quanh bảng, KHÔNG kẻ ngang giữa các dòng —
     phân dòng bằng nền vằn.
     CẤU TRÚC (Nam chốt 2026-09-23): mỗi `.print-page` = ĐÚNG 1 tờ giấy A4.
       · trang 1  = khối TỔNG GIÁ TRỊ DỰ TOÁN (tạm tính + VAT + bằng chữ) → bảng hạng mục → ghi chú → ký
       · trang 2+ = mỗi hạng mục (q.sections[i]) một trang riêng, đúng thứ tự bảng tổng hợp
     Header (logo + measure&make + số/ngày) lặp lại ở đầu MỌI trang — xem @media print bên dưới. */
  .print-doc { --print-hair: 0.5px; --print-orange: #F15A22; --print-ink: #22333B; --print-dash: rgba(241,90,34,.5);
    font-family: 'Montserrat', 'Segoe UI', sans-serif; max-width: 100%; margin: 20px 0 40px; color: var(--print-ink); font-size: 12px; line-height: 1.5; overflow-x: auto; }
  /* Cả tài liệu nằm trong 1 <table>: <thead> chính là HEADER LẶP LẠI ở đầu mọi trang giấy khi in
     (trình duyệt tự lặp thead qua các trang). Đã thử position:fixed + top âm trước đó và Chrome
     đẩy header xuống ĐÁY trang — đo bằng bản in PDF thật, đừng quay lại cách đó. */
  .print-sheet { width: 100%; border-collapse: collapse; }
  .print-sheet > thead { display: none; } /* xem trước trên màn hình: mỗi .print-page đã có header riêng */
  /* App có quy tắc chung `tbody td { padding:…; border-bottom: 1px solid var(--border-soft) }` —
     nó ăn cả vào ô của bảng bọc này và vẽ 1 gạch mờ ở cuối mỗi trang in (đã thấy trong PDF thật). */
  .print-sheet > thead > tr > td, .print-sheet > tbody > tr > td { padding: 0; border: none; background: transparent; vertical-align: top; }
  .print-page { width: 210mm; max-width: 100%; min-height: 297mm; margin: 0 auto 20px; background: #ffffff; border: 1px solid #DAD5C7; border-radius: 8px; box-shadow: 0 1px 2px rgba(20,24,28,.06), 0 6px 20px rgba(20,24,28,.05); padding: 14mm 12mm 16mm; }
  .print-runhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: var(--print-hair) solid var(--print-orange); padding-bottom: 9px; margin-bottom: 34px; background: #ffffff; }
  .print-brand { display: flex; align-items: center; gap: 10px; }
  .print-logo { height: 32px; width: auto; display: block; }
  .print-brand-word { font-weight: 600; font-size: 14.5px; line-height: 1.25; color: var(--print-ink); }
  .print-brand-word span { color: #8C8178; font-weight: 400; }
  .print-doc-meta { text-align: right; font-size: 11px; line-height: 1.6; color: #62707A; }
  /* Thông tin báo giá: CĐT + Địa chỉ bên trái, Trạng thái + Cập nhật bên phải (yêu cầu của Nam). */
  .print-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; font-size: 12px; margin-bottom: 18px; }
  .print-meta .col-right { text-align: right; }
  .print-meta .lbl { color: #8C8178; }
  .print-title { font-size: 17px; font-weight: 700; text-align: center; margin: 0 0 4px; letter-spacing: .02em; text-transform: uppercase; color: var(--print-ink); }
  .print-subtitle { text-align: center; font-size: 12px; color: #62707A; margin-bottom: 16px; }
  .print-intro { font-size: 12px; margin-bottom: 14px; }

  /* Khối TỔNG GIÁ TRỊ DỰ TOÁN ở đầu trang 1: con số tổng lớn + Tạm tính + VAT + Bằng chữ. */
  .print-total-block { border-top: var(--print-hair) solid var(--print-orange); border-bottom: var(--print-hair) solid var(--print-orange); padding: 12px 4px 10px; margin-bottom: 16px; }
  .print-total-block .tb-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #62707A; margin-bottom: 4px; }
  .print-total-block .tb-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .print-total-block .tb-grand { font-size: 28px; font-weight: 800; line-height: 1.1; color: var(--print-orange); font-variant-numeric: tabular-nums; }
  .print-total-block .tb-parts { min-width: 230px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .print-total-block .tb-parts div { display: flex; justify-content: space-between; gap: 24px; padding: 3px 0; }
  .print-total-block .tb-parts span:first-child { color: #62707A; }
  .print-total-block .tb-parts b { font-weight: 700; }
  .print-total-block .tb-words { margin-top: 12px; font-size: 11.5px; font-style: italic; }
  .print-total-block .tb-words b { font-style: normal; font-weight: 600; }

  /* Tiêu đề trang hạng mục: ô chữ cái cam (A/B/C… đúng thứ tự ở bảng tổng hợp) + tên in hoa. */
  .print-block-title { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
  .print-letter { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px; background: var(--print-orange); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .print-block-title h2 { font-family: inherit; margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; color: var(--print-ink); }
  /* Ghi chú cố định — nội dung giống nhau ở mọi báo giá, sửa ở hằng PRINT_FIXED_NOTES trong JS. */
  .print-notes { margin-top: 14px; font-size: 10.5px; line-height: 1.45; }
  .print-notes .nt-title { font-weight: 700; margin-bottom: 3px; }
  .print-notes .nt-item { display: flex; gap: 8px; margin-bottom: 2px; }
  .print-notes .nt-no { flex: 0 0 26px; }
  .print-notes ul { margin: 2px 0 4px; padding-left: 16px; }
  .print-notes li { margin-bottom: 1px; }
  .print-summary-note { font-size: 11px; font-style: italic; color: #62707A; margin-top: 12px; white-space: pre-wrap; }
  .print-section { margin-bottom: 8px; }
  .print-section-note { font-size: 11px; font-style: italic; color: #8C8178; margin: 0 0 30px; padding-left: 34px; }
  .print-group-title { font-size: 12.5px; font-weight: 700; margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--print-orange); color: var(--print-ink); }
  .print-group-title:not(:first-child) { margin-top: 22px; }

  .print-item-table, .print-summary-table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 12px; margin-bottom: 6px; }
  .print-item-table th, .print-item-table td, .print-summary-table th, .print-summary-table td { border: none; border-right: 1px dashed var(--print-dash); padding: 9px 10px; vertical-align: top; overflow-wrap: break-word; }
  .print-summary-table th, .print-summary-table td { padding: 4px 10px; }
  .print-item-table th:last-child, .print-item-table td:last-child, .print-summary-table th:last-child, .print-summary-table td:last-child { border-right: none; }
  .print-item-table th, .print-summary-table th { background: transparent; text-align: left; font-size: 9.6px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #62707A; border-bottom: var(--print-hair) solid var(--print-orange); padding-bottom: 8px; }
  .print-item-table tbody tr:nth-child(even), .print-summary-table tbody tr:nth-child(even) { background: #F7F6F3; }
  .print-summary-table tbody tr:last-child td { border-bottom: var(--print-hair) solid var(--print-orange); }
  .print-item-table td.num, .print-summary-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .print-item-table th.num, .print-summary-table th.num { text-align: right; }
  .print-item-table td.center, .print-item-table th.center, .print-summary-table td.center, .print-summary-table th.center { text-align: center; }
  .print-item-table td.name-cell b { font-size: 12.3px; font-weight: 600; }
  .print-item-table td.name-cell .detail-line { display: block; color: #8C8178; font-size: 10.5px; margin-top: 3px; line-height: 1.45; }
  /* 3 tầng số cộng, tăng dần độ nổi: số trong dòng → "Cộng:" (đậm, CÙNG cỡ cột Thành tiền = 12px)
     → "Cộng hạng mục X:" (to hơn 1 cỡ = 14px, đậm, cam, có đường kẻ cam phía trên). */
  .print-group-total { text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0 0; color: var(--print-ink); }
  .print-cat-total { text-align: right; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; border-top: var(--print-hair) solid var(--print-orange); margin-top: 20px; padding-top: 12px; color: var(--print-orange); }
  .print-signoff { display: flex; justify-content: space-between; margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--print-ink); }
  .print-signoff .sign-block { width: 45%; }
  .print-signoff .sign-title { font-weight: 700; margin-bottom: 2px; }
  .print-signoff .sign-sub { color: #8C8178; font-size: 10px; margin-bottom: 30px; }

  @media print {
    @page { size: A4; margin: 14mm 12mm; }
    /* FOOTER mỗi trang giấy (Nam chốt 2026-09-24): trái "measure & make", phải "Page X/Y".
       Dùng margin box của @page nên nằm trong lề dưới 14mm, không chiếm chỗ nội dung. Chỉ hiện khi IN
       (xem trước trên màn hình không có). Chữ 8px, than-xanh nhạt hơn ink một chút. */
    @page {
      @bottom-left { content: "measure & make"; font-family: 'Montserrat', 'Segoe UI', sans-serif; font-size: 8px; color: #4F5F68; vertical-align: top; padding-top: 4mm; }
      @bottom-right { content: "Page " counter(page) "/" counter(pages); font-family: 'Montserrat', 'Segoe UI', sans-serif; font-size: 8px; color: #4F5F68; vertical-align: top; padding-top: 4mm; }
    }
    body { background: #fff; }
    .sidebar, .topbar, .toast, .modal-overlay, .no-print { display: none !important; }
    .app { display: block; }
    .main { display: block; }
    .content { max-width: 100%; padding: 0; margin: 0; }
    .print-doc { max-width: 100%; margin: 0; overflow: visible; }
    /* Nền vằn, ô chữ cam, chữ cam… mặc định trình duyệt BỎ khi in — bắt buộc in đủ màu. */
    .print-doc, .print-doc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Khi in thì .print-page không còn là "tờ giấy giả" nữa — chính trang giấy thật đảm nhiệm
       khổ và lề, nên bỏ hết khung/bóng/kích thước mô phỏng đi. */
    .print-page { width: auto; max-width: none; min-height: 0; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; }
    /* Header lặp ở đầu MỌI trang giấy = <thead> của bảng bọc ngoài; các bản in-flow trong từng
       .print-page (chỉ để xem trước trên màn hình) ẩn đi. Mỗi hạng mục là 1 <tr> → 1 trang mới;
       hạng mục dài hơn 1 trang vẫn tràn bình thường và thead vẫn lặp ở trang tràn. */
    .print-sheet > thead { display: table-header-group; }
    .print-sheet > tbody > tr + tr { break-before: page; page-break-before: always; }
    .print-page > .print-runhead { display: none; }
    /* KHÔNG đặt break-inside:avoid cho .print-section — 1 hạng mục dài hơn 1 trang vẫn phải tràn
       sang trang sau (có header lặp lại + thead của bảng tự lặp), chứ không được đẩy nguyên khối. */
    .print-item-table tr { break-inside: avoid; }
    .print-group-title, .print-block-title { break-after: avoid; }
    .print-signoff, .print-notes .nt-item, .print-total-block { break-inside: avoid; }
  }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  [hidden] { display: none !important; }
</style>

  db.settings({ ignoreUndefinedProperties: true });

  var docUnsub = null, saveTimer = null, pendingSave = false;
  // Đếm số lần ghi đang bay lên server. Firestore bắn onSnapshot NGAY cho bản ghi của chính mình
  // (latency compensation) rồi bắn LẦN NỮA khi server xác nhận serverTimestamp — nếu cứ thế vẽ lại
  // cả màn thì đang gõ dở là con trỏ văng khỏi ô. Xem thêm ở chỗ đăng ký onSnapshot.
  var inflightWrites = 0, firstPaintDone = false, repaintPending = false;
  // Chốt chặn cuối cho lỗi "gõ 1 ký tự là văng khỏi ô": đang đặt con trỏ trong một ô nhập liệu thì
  // KHÔNG vẽ lại #content (vì vẽ lại = thay innerHTML = huỷ luôn ô đang gõ). Hoãn lại, khi nào rời ô
  // hẳn mới vẽ. Đây là lớp bắt mọi nguyên nhân, kể cả nguyên nhân chưa lường tới.
  function typingInsideContent() {
    var ae = document.activeElement, c = document.getElementById("content");
    return !!(ae && c && c.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  }
  // Vẽ lại NGAY lúc rời ô sẽ nuốt mất cú bấm: bấm nút -> ô đang gõ mất focus -> vẽ lại -> chính cái nút
  // vừa bấm bị huỷ trước khi trình duyệt kịp phát sự kiện click -> phải bấm lần hai mới ăn.
  // Nên: đang giữ chuột thì hoãn, và chỉ vẽ lại khi người dùng thật sự rảnh tay.
  var pointerDown = false;
  document.addEventListener("mousedown", function () { pointerDown = true; }, true);
  document.addEventListener("mouseup", function () {
    pointerDown = false;
    setTimeout(flushPendingRepaint, 120); // sau khi cú click đã được xử lý xong
  }, true);
  function flushPendingRepaint() {
    if (!repaintPending || pointerDown) return;
    if (typingInsideContent()) return; // vẫn đang gõ ở ô khác
    repaintPending = false;
    renderCurrentScreen();
  }
  (function watchBlurToRepaint() {
    var c = document.getElementById("content");
    if (!c) return;
    c.addEventListener("focusout", function () { setTimeout(flushPendingRepaint, 120); });
  })();

  // Ghi lên Firestore có debounce 500ms, lạc quan (trả về ngay, không đợi mạng) — báo lỗi qua toast nếu
  // sau đó thật sự ghi thất bại. Đây là hàm DUY NHẤT lưu dữ liệu — gộp cả quotes, bảng giá vật tư, công
  // trình, khách hàng vào 1 tài liệu Firestore (giống cơ chế đã dùng cho app FF&E Schedule).
  function saveState() {
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 500);
  }
  function flushSave() {
    if (!pendingSave) return;
    pendingSave = false;
    var payload = {
      quotes: state.quotes, priceCatalog: PRICE_CATALOG, projects: PROJECTS, customers: CUSTOMERS
    };
    // Dùng mốc giờ của máy, KHÔNG dùng serverTimestamp: serverTimestamp làm dữ liệu đổi lần thứ hai
    // lúc server xác nhận → Firestore bắn thêm 1 snapshot nữa → vẽ lại lần nữa → văng con trỏ.
    // Trường này chỉ để tham khảo, không nơi nào trong app đọc tới.
    payload.updatedAt = Date.now();
    payload.updatedBy = (fbAuth.currentUser && fbAuth.currentUser.email) || null;
    inflightWrites++;
    MAIN_DOC.set(payload).then(function () { inflightWrites--; }, function (err) {
      inflightWrites--;
      toast("Không lưu được lên server — " + err.message);
    });
  }
  window.addEventListener("beforeunload", function () { if (pendingSave) flushSave(); });

    var seed = { quotes: seedQuotes(), priceCatalog: DEFAULT_PRICE_CATALOG.slice(), projects: DEFAULT_PROJECTS.slice(), customers: [] };

    try { var b = localStorage.getItem(CATALOG_KEY); if (b) { var db2 = JSON.parse(b); if (db2 && Array.isArray(db2.items) && db2.items.length) seed.priceCatalog = db2.items; } } catch (e) {}

  function startApp() {
    showLoading("Đang tải dữ liệu…");
    if (docUnsub) { docUnsub(); docUnsub = null; }
    MAIN_DOC.get().then(function (snap) {
      if (snap.exists) return;
      showLoading("Lần đầu tiên — đang tạo dữ liệu ban đầu trên server…");
      var seed = localSeed();
      return MAIN_DOC.set({
        quotes: seed.quotes, priceCatalog: seed.priceCatalog, projects: seed.projects, customers: seed.customers,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function () {
      docUnsub = MAIN_DOC.onSnapshot(function (snap) {
        if (!snap.exists) return;
        var d = snap.data();
        // Chuẩn hoá TRƯỚC rồi mới so với thứ đang hiện trên màn: câu hỏi đúng phải là "có gì khác cái
        // đang hiện không", chứ không phải "có phải bản mình vừa ghi không". So với bản vừa ghi thì
        // Firestore chuẩn hoá lại dữ liệu (bỏ field rỗng...) là lệch vân tay → tưởng nhầm có thay đổi.
        var nQuotes = Array.isArray(d.quotes) ? d.quotes : [];
        var nCatalog = (Array.isArray(d.priceCatalog) && d.priceCatalog.length) ? d.priceCatalog : DEFAULT_PRICE_CATALOG.slice();
        var nProjects = (Array.isArray(d.projects) && d.projects.length) ? d.projects : DEFAULT_PROJECTS.slice();
        var nCustomers = Array.isArray(d.customers) ? d.customers : [];
        var incomingJson = JSON.stringify([nQuotes, nCatalog, nProjects, nCustomers]);
        var onScreenJson = JSON.stringify([state.quotes, PRICE_CATALOG, PROJECTS, CUSTOMERS]);
        state.quotes = nQuotes;
        PRICE_CATALOG = nCatalog;
        PROJECTS = nProjects;
        CUSTOMERS = nCustomers;
        if (view.editingId && !state.quotes.some(function (q) { return q.id === view.editingId; })) { view.screen = "list"; view.editingId = null; }
        // Không khác gì cái đang hiện → không việc gì phải vẽ lại, và cũng KHÔNG hẹn vẽ lại.
        if (firstPaintDone && incomingJson === onScreenJson) return;
        // Dữ liệu có khác thật, nhưng do CHÍNH MÌNH vừa ghi (Firestore dội bản ghi của mình về):
        // màn hình đã đúng sẵn, vẽ lại chỉ tổ huỷ ô đang gõ → bỏ qua. Lần vẽ ĐẦU TIÊN luôn phải chạy,
        // nếu không màn hình sẽ trắng.
        // Phải kiểm cả inflightWrites chứ không chỉ hasPendingWrites: Firestore giải quyết promise của
        // set() TRƯỚC rồi mới bắn snapshot xác nhận (bài học lần vá hụt đầu tiên).
        if (firstPaintDone) {
          if (snap.metadata.hasPendingWrites || inflightWrites > 0) return;
          // Thay đổi thật từ nơi khác mà mình đang gõ dở: hẹn vẽ lại sau, đừng cướp ô đang gõ.
          if (typingInsideContent()) { repaintPending = true; return; }
        }
        firstPaintDone = true;
        hideAuthOverlay();
        renderUserFoot();
        renderCurrentScreen();
      }, function (err) {
        showLoading("Mất kết nối tới server: [" + err.code + "] " + err.message + " — thử tải lại trang (F5).");
      });
    }).catch(function (err) {
      showLoading("Không tải được dữ liệu: [" + err.code + "] " + err.message + " — thử tải lại trang (F5). Nếu vẫn vậy, kiểm tra lại Rules của Firestore đã Publish đúng chưa.");
    });
  }

  var CHU_SO_VN = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];

  function docBaChuSo(n, coHangCaoHon) {
    var tram = Math.floor(n / 100);
    var du = n % 100;
    var chuc = Math.floor(du / 10);
    var donvi = du % 10;
    var out = [];

    if (tram > 0) out.push(CHU_SO_VN[tram] + " trăm");
    else if (coHangCaoHon && du > 0) out.push("không trăm");

    if (chuc === 0) {
      if (donvi > 0) out.push((tram > 0 || coHangCaoHon) ? ("linh " + CHU_SO_VN[donvi]) : CHU_SO_VN[donvi]);
    } else if (chuc === 1) {
      out.push(donvi === 5 ? "mười lăm" : donvi === 0 ? "mười" : "mười " + CHU_SO_VN[donvi]);
    } else {
      var chucWord = CHU_SO_VN[chuc] + " mươi";
      if (donvi === 0) out.push(chucWord);
      else if (donvi === 1) out.push(chucWord + " mốt");
      else if (donvi === 5) out.push(chucWord + " lăm");
      else if (donvi === 4) out.push(chucWord + " tư");
      else out.push(chucWord + " " + CHU_SO_VN[donvi]);
    }
    return out.join(" ").trim();
  }

  function soThanhChu(num) {
    num = Math.round(Number(num) || 0);
    if (num === 0) return "Không đồng";
    var amDau = num < 0;
    num = Math.abs(num);

    var groups = [];
    var n = num;
    while (n > 0) { groups.unshift(n % 1000); n = Math.floor(n / 1000); }

    var SCALE = ["", " nghìn", " triệu", " tỷ", " nghìn tỷ", " triệu tỷ"];
    var parts = [];
    var started = false;
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (g === 0) continue;
      var scaleIdx = groups.length - 1 - i;
      parts.push(docBaChuSo(g, started) + (SCALE[scaleIdx] || ""));
      started = true;
    }

    var sentence = parts.join(", ");
    sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
    return (amDau ? "Âm " : "") + sentence + " đồng";
  }

  function fmtDate(iso) {

    var dd = String(d.getDate()).padStart(2, "0");

    return dd + "/" + mm + "/" + d.getFullYear();
  }

  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var dd = String(d.getDate()).padStart(2, "0");
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var hh = String(d.getHours()).padStart(2, "0");
    var mi = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mi + " " + dd + "/" + mm + "/" + d.getFullYear();
  }

  var MIN_COL_WIDTHS = { stt: 24, code: 40, name: 60, detail: 60, size: 108, unit: 50, qty: 46, price: 56, amount: 56, note: 50, del: 26 };

  function loadColWidths() {

  // Cột bảng in dùng đúng tỉ lệ độ rộng cột (colWidths) mà người dùng đã kéo chỉnh trong bảng
  // nhập liệu — không tính cột "del" (nút xoá, không có khi in). Tên hạng mục + Nội dung chi tiết
  // gộp lại thành 1 cột khi in (đỡ chật hơn 10 cột), độ rộng = tổng 2 cột đó cộng lại.
  var PRINT_COL_KEYS = ["stt", "nameDetail", "size", "unit", "qty", "price", "amount", "note"];
  function printColWidth(k) {
    if (k === "nameDetail") return (colWidths.name || DEFAULT_COL_WIDTHS.name) + (colWidths.detail || DEFAULT_COL_WIDTHS.detail);
    return colWidths[k] || DEFAULT_COL_WIDTHS[k];
  }
  // Khổ giấy A4 hẹp hơn bảng nhập liệu nhiều, nên tỉ lệ cột chỉ ĐI THEO độ rộng đã kéo trong
  // khoảng an toàn [min, max] dưới đây. Không có sàn thì cột Đơn giá / Thành tiền bị bóp lại,
  // số tiền hàng tỉ (nowrap) tràn ra ngoài và dính vào nhau — đã dính thật khi soi bản in.
  // Cột Tên hạng mục ăn nốt phần % còn thừa.
  var PRINT_COL_PCT_RANGE = { stt: [5.5, 6.5], size: [9, 14], unit: [5, 8], qty: [6, 9], price: [12, 16], amount: [12, 16], note: [8, 13] };
  function printColgroupHtml() {
    var total = PRINT_COL_KEYS.reduce(function (s, k) { return s + printColWidth(k); }, 0);
    var pct = {}, used = 0;
    PRINT_COL_KEYS.forEach(function (k) {
      if (k === "nameDetail") return;
      var raw = (printColWidth(k) / total) * 100;
      var range = PRINT_COL_PCT_RANGE[k] || [0, 100];
      pct[k] = Math.min(Math.max(raw, range[0]), range[1]);
      used += pct[k];
    });
    pct.nameDetail = Math.max(100 - used, 16);
    return "<colgroup>" + PRINT_COL_KEYS.map(function (k) {
      return '<col style="width:' + pct[k].toFixed(2) + '%">';
    }).join("") + "</colgroup>";
  }

  function applyColWidths() {
    document.querySelectorAll("col[data-col]").forEach(function (col) {
      var w = colWidths[col.dataset.col];
      if (w != null) col.style.width = w + "px";
    });
  }

  function resizeHandle(key) { return '<span class="col-resize-handle" data-resize="' + key + '"></span>'; }

  function setupColumnResize() {
    var dragging = null;
    document.addEventListener("mousedown", function (e) {
      var handle = e.target.closest && e.target.closest(".col-resize-handle");
      if (!handle) return;
      e.preventDefault();
      dragging = { key: handle.dataset.resize, startX: e.clientX, startWidth: colWidths[handle.dataset.resize] || 80 };
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
    });
    document.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      var delta = e.clientX - dragging.startX;
      var minW = MIN_COL_WIDTHS[dragging.key] || 36;
      colWidths[dragging.key] = Math.max(minW, Math.min(480, dragging.startWidth + delta));
      applyColWidths();
    });
    document.addEventListener("mouseup", function () {
      if (!dragging) return;
      dragging = null;
      document.body.style.cursor = "";
      document.querySelectorAll(".col-resize-handle.dragging").forEach(function (h) { h.classList.remove("dragging"); });
      saveColWidths();
    });
  }

  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXx7O9IHwhr-vbvZ6SVgrupPloVNFxxCdIHwnYdghNrYMZBBO8vQYBLgViKyJW-r2i/exec";

  // Khi Mã khớp: Tên hạng mục, Nội dung chi tiết, Đơn giá tự điền và khoá theo bảng giá này.
  var DEFAULT_PRICE_CATALOG = [

  var PRICE_CATALOG = DEFAULT_PRICE_CATALOG.slice();
  var catalogSyncedAt = null;

  // Dữ liệu đồng bộ từ Apps Script trả về dạng { updated, priceCatalog:[...], projects:[...], customers:[...] }
  // — cả 3 mảng đều đọc từ 1 file Sheet duy nhất (khác tab). Thiếu mảng nào thì giữ nguyên phần đó, không báo lỗi,
  // để vẫn đồng bộ được các phần khác nếu Nam lỡ sửa Apps Script thiếu 1 nhánh.
  function applyMasterDataFromSheet(data) {
    if (!data || typeof data !== "object") throw new Error("JSON không hợp lệ.");
    var syncedAt = data.updated || new Date().toISOString();
    var counts = [];

    if (Array.isArray(data.priceCatalog)) {
      // Ảnh/liên kết sản phẩm không đi qua Google Sheet (chỉ lưu trong trình duyệt) — khi đồng bộ,
      // giữ nguyên ảnh/liên kết đã có sẵn cho mã đó thay vì xoá mất, chỉ ghi đè tên/nội dung/đơn giá.
      var oldByCode = {};
      PRICE_CATALOG.forEach(function (e) { oldByCode[e.code] = e; });
      var items = data.priceCatalog
        .filter(function (it) { return it && it.code; })
        .map(function (it) {
          var code = String(it.code).trim().toUpperCase();
          var prev = oldByCode[code];
          return {
            code: code,
            name: it.name || "",
            detail: it.detail || "",
            unit: it.unit || "",
            price: Number(it.price) || 0,
            images: (it.images && it.images.length) ? it.images : (prev ? (prev.images || []) : []),
            links: (it.links && it.links.length) ? it.links : (prev ? (prev.links || []) : [])
          };
        });
      if (items.length) {
        PRICE_CATALOG = items;
        catalogSyncedAt = syncedAt;
        counts.push(items.length + " mã vật tư");
      }
    }

    if (Array.isArray(data.projects)) {
      // Địa chỉ công trình (dùng cho bản in) KHÔNG có cột bên Google Sheet — giống ảnh/liên kết
      // của vật tư, phải giữ lại giá trị đang có theo id, nếu không mỗi lần đồng bộ là mất sạch.
      var oldPrjById = {};
      PROJECTS.forEach(function (x) { oldPrjById[x.id] = x; });
      var projects = data.projects
        .filter(function (p) { return p && p.id; })
        .map(function (p) {
          var pid = String(p.id).trim();
          var prevPrj = oldPrjById[pid];
          return {
            id: pid,
            name: p.name || "",
            type: p.type || "",
            client: p.client || "",
            address: p.address || (prevPrj ? (prevPrj.address || "") : ""),
            note: p.note || ""
          };
        });
      if (projects.length) {
        PROJECTS = projects;
        counts.push(projects.length + " công trình");
      }
    }

    if (Array.isArray(data.customers)) {
      var customers = data.customers
        .filter(function (c) { return c && c.name; })
        .map(function (c) {
          return { name: c.name || "", phone: c.phone || "", email: c.email || "", project: c.project || "", note: c.note || "" };
        });
      CUSTOMERS = customers;
      if (customers.length) counts.push(customers.length + " khách hàng");
    }

    if (!counts.length) throw new Error("Không tìm thấy dữ liệu hợp lệ nào trong JSON (cần ít nhất 1 trong 3 mảng priceCatalog/projects/customers).");
    saveState(); // đẩy cả 3 mảng vừa đồng bộ lên Firestore, để mọi người dùng chung thấy ngay
    return counts;
  }

  function findCatalogEntry(code) {

    if (!norm) return null;

  // Nén ảnh về canvas (tối đa `max` px cạnh dài, JPEG) rồi trả về Blob — cùng cơ chế đã dùng cho
  // app FF&E Schedule. Blob này được tải thẳng lên Firebase Storage (xem uploadToStorage bên dưới),
  // Firestore chỉ giữ URL — không nhét ảnh thô vào tài liệu (Firestore giới hạn 1MB/tài liệu).
  function resizeImageFile(file, max, q) {
    max = max || 900; q = q || 0.72;
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          if (Math.max(w, h) > max) { var s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          c.toBlob(function (b) { b ? resolve(b) : reject(new Error("Không nén được ảnh")); }, "image/jpeg", q);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function toRoman(num) {
    var map = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
    var res = "";
    for (var i = 0; i < map.length; i++) {
      while (num >= map[i][0]) { res += map[i][1]; num -= map[i][0]; }
    }
    return res;
  }

  function toAlpha(num) {
    var res = "";
    while (num > 0) {
      var rem = (num - 1) % 26;
      res = String.fromCharCode(65 + rem) + res;
      num = Math.floor((num - 1) / 26);
    }
    return res;
  }

  function itemAmount(it) { return (Number(it.qty) || 0) * (Number(it.price) || 0); }

  function groupTotal(g) {
    return g.items.reduce(function (s, it) { return s + itemAmount(it); }, 0);
  }
  function sectionTotal(sec) {
    return sec.groups.reduce(function (s, g) { return s + groupTotal(g); }, 0);
  }
  function quoteTotal(q) {
    return q.sections.reduce(function (s, sec) { return s + sectionTotal(sec); }, 0);
  }

  /* ---------- Điều hướng ô trong bảng chi tiết bằng phím mũi tên (kiểu Excel/Sheets) ---------- */
  // Trái/Phải: chỉ nhảy ô khi con trỏ đang ở đầu/cuối chữ (không chặn thao tác sửa text bình thường).
  // Lên/Xuống: input 1 dòng luôn nhảy ô; textarea chỉ nhảy khi con trỏ ở đầu (Lên) hoặc cuối (Xuống) nội dung.
  // Lên/Xuống tìm ô cùng cột (cùng data-f) ở dòng trước/sau, bỏ qua ô đang khoá (disabled).
  function itemNavCells() {
    return Array.prototype.slice.call(document.querySelectorAll(".item-table input[data-f], .item-table textarea[data-f]"))
      .filter(function (el) { return !el.disabled; });
  }
  function focusNavCell(list, idx) {
    if (idx < 0 || idx >= list.length) return false;
    var el = list[idx];
    el.focus();
    if (typeof el.setSelectionRange === "function" && el.value != null) {
      var pos = el.value.length;
      el.setSelectionRange(pos, pos);
    }
    return true;
  }
  document.getElementById("content").addEventListener("keydown", function (e) {
    var el = e.target;
    if (!el.matches || !el.matches(".item-table input[data-f], .item-table textarea[data-f]")) return;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) === -1) return;

    var isTextarea = el.tagName === "TEXTAREA";
    var collapsed = el.selectionStart === el.selectionEnd;
    var atStart = collapsed && el.selectionStart === 0;
    var atEnd = collapsed && el.selectionEnd === el.value.length;

    if (e.key === "ArrowLeft" && !atStart) return;
    if (e.key === "ArrowRight" && !atEnd) return;
    if (isTextarea && e.key === "ArrowUp" && !atStart) return;
    if (isTextarea && e.key === "ArrowDown" && !atEnd) return;

    var list = itemNavCells();
    var idx = list.indexOf(el);
    if (idx === -1) return;

    if (e.key === "ArrowLeft") { if (focusNavCell(list, idx - 1)) e.preventDefault(); return; }
    if (e.key === "ArrowRight") { if (focusNavCell(list, idx + 1)) e.preventDefault(); return; }

    var f = el.dataset.f;
    if (e.key === "ArrowUp") {
      for (var i = idx - 1; i >= 0; i--) {
        if (list[i].dataset.f === f) { focusNavCell(list, i); e.preventDefault(); return; }
      }
    }
    if (e.key === "ArrowDown") {
      for (var j = idx + 1; j < list.length; j++) {
        if (list[j].dataset.f === f) { focusNavCell(list, j); e.preventDefault(); return; }
      }
    }
  });

      '<div class="page-head">' +
        '<div><h1>Danh sách công trình</h1><div class="page-sub">Công trình dùng chung giữa app Báo giá / Dự toán và app FF&amp;E Schedule.</div></div>' +

      '</table></div></div>';

    // sau khi lưu — vẽ lại là huỷ mất ô đang gõ (xem phần chống "gõ 1 ký tự văng khỏi ô").
    document.querySelectorAll("[data-prjaddr]").forEach(function (inp) {

      b.addEventListener("click", function () {
        var id = b.dataset.delprj;

          // Không cho xoá khi còn báo giá gắn vào — xoá xong các báo giá đó sẽ mồ côi, không biết thuộc công trình nào.
          alert('Không xoá được "' + p.name + '" vì còn ' + used.length + ' báo giá đang gắn vào công trình này:\n\n' +

        saveState();
        renderProjectsScreen();
        toast('Đã xoá công trình "' + p.name + '".');
      });
    });
  }

  // đã có sẵn. Gõ đúng mã ở bảng chi tiết báo giá vẫn tự điền như cũ (đơn giá luôn sửa được riêng từng

  // riêng, sửa tay không mất khi đổi lại đúng mã" đã dùng cho app FF&E Schedule.
  function renderCatalogScreen() {
    var sorted = PRICE_CATALOG.slice().sort(function (a, b) { return a.code.localeCompare(b.code); });
    var rows;
    if (!sorted.length) {
      rows = '<tr class="empty-row"><td colspan="7">Chưa có mã vật tư nào. Bấm "Thêm mã vật tư" để bắt đầu.</td></tr>';
    } else {
      rows = sorted.map(function (e) {
        var thumb = (e.images && e.images[0]) ? '<img class="cell-thumb-img" src="' + e.images[0] + '" alt="">' : '<span class="cell-thumb-ph"></span>';
        var media = [];
        if ((e.images || []).length) media.push(e.images.length + " ảnh");
        if ((e.links || []).length) media.push(e.links.length + " liên kết");
        return '<tr>' +
          '<td>' + thumb + '</td>' +
          '<td class="cell-code">' + escapeHtml(e.code) + '</td>' +
          '<td><div class="cell-title">' + escapeHtml(e.name) + '</div><div class="cell-muted">' + escapeHtml(e.detail || "") + '</div></td>' +
          '<td class="cell-muted">' + escapeHtml(e.unit || "") + '</td>' +
          '<td class="cell-money">' + money(e.price) + '</td>' +
          '<td class="cell-muted">' + (media.length ? escapeHtml(media.join(" · ")) : "—") + '</td>' +
          '<td><div class="row-actions">' +
            '<button class="icon-btn" data-edit-catalog="' + escapeHtml(e.code) + '" title="Sửa">' + iconEdit() + '</button>' +
            '<button class="icon-btn danger" data-del-catalog="' + escapeHtml(e.code) + '" title="Xoá">' + iconTrash() + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join("");
    }

    var html =
      '<div class="mock-note">' + iconInfo() + ' ' + PRICE_CATALOG.length + ' mã vật tư' + (catalogSyncedAt ? ", đồng bộ tên/đơn giá lần cuối " + fmtDateTime(catalogSyncedAt) + " từ Sheet" : "") + '. Ảnh và liên kết sản phẩm chỉ lưu trong trình duyệt này (không qua Sheet) — vẫn giữ nguyên khi đồng bộ lại.</div>' +
      '<div class="page-head">' +
        '<div><h1>Thư viện vật tư</h1><div class="page-sub">Soạn sẵn tên, nội dung, đơn vị tính, đơn giá tham khảo, ảnh và liên kết sản phẩm cho từng mã. Gõ đúng mã này ở bảng chi tiết báo giá để tự điền — riêng đơn giá luôn sửa được theo từng dự án.</div></div>' +
        '<div class="head-actions"><button class="btn" id="btnSyncCatalog2">' + iconSync() + ' Đồng bộ dữ liệu</button><button class="btn btn-primary" id="btnAddCatalog">' + iconPlus() + ' Thêm mã vật tư</button></div>' +
      '</div>' +
      '<div class="table-wrap"><div class="table-scroll"><table>' +
        '<thead><tr><th></th><th>Mã</th><th>Tên / nội dung</th><th>ĐVT</th><th>Đơn giá</th><th>Ảnh / liên kết</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div></div>';

    document.getElementById("content").innerHTML = html;
    document.getElementById("crumbCurrent").textContent = "Thư viện vật tư";

    document.getElementById("btnAddCatalog").addEventListener("click", function () { openCatalogEditor(null); });
    document.getElementById("btnSyncCatalog2").addEventListener("click", openSyncModal);
    document.querySelectorAll("[data-edit-catalog]").forEach(function (b) {
      b.addEventListener("click", function () { openCatalogEditor(b.dataset.editCatalog); });
    });
    document.querySelectorAll("[data-del-catalog]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm('Xoá mã "' + b.dataset.delCatalog + '" khỏi thư viện? Các dự án đã dùng mã này sẽ giữ nguyên số liệu đã điền, chỉ không tự động khớp mã nữa.')) return;

        saveCatalog(); renderCatalogScreen();
        toast("Đã xoá mã vật tư.");
      });
    });
  }

    if (addBtn) addBtn.addEventListener("click", function () { document.getElementById("ceFileInput").click(); });

  function paintCeLinks() {
    var wrap = document.getElementById("ceLinks");
    if (!(ceDraft.links || []).length) { wrap.innerHTML = '<div class="cell-muted" style="font-size:12px;">Chưa có liên kết sản phẩm.</div>'; return; }
    wrap.innerHTML = ceDraft.links.map(function (l, i) {
      return '<div class="cat-link-row"><a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + iconExternal() + escapeHtml(l.label || l.url) + '</a><button type="button" data-rm-link="' + i + '">' + iconClose() + '</button></div>';
    }).join("");
    wrap.querySelectorAll("[data-rm-link]").forEach(function (b) {
      b.addEventListener("click", function () { ceDraft.links.splice(Number(b.dataset.rmLink), 1); paintCeLinks(); });
    });
  }

  function openCatalogEditor(code) {
    ensureCatalogModal();
    var entry = code ? findCatalogEntry(code) : null;
    ceOriginalCode = entry ? entry.code : null;
    ceDraft = entry
      ? { images: (entry.images || []).slice(), links: (entry.links || []).map(function (l) { return { url: l.url, label: l.label }; }), uploadKey: entry.code }
      : { images: [], links: [], uploadKey: "draft_" + Date.now() };

    document.getElementById("catalogModalTitle").textContent = entry ? "Sửa mã " + entry.code : "Thêm mã vật tư";
    document.getElementById("ceCode").value = entry ? entry.code : "";
    document.getElementById("ceUnit").value = entry ? (entry.unit || "") : "cái";
    document.getElementById("ceUnitList").innerHTML = UNIT_OPTIONS.concat(catalogUnits()).filter(function (u, i, a) { return a.indexOf(u) === i; })
      .map(function (u) { return '<option value="' + escapeHtml(u) + '">'; }).join("");
    document.getElementById("cePrice").value = moneyPlain(entry ? entry.price : 0);
    document.getElementById("ceName").value = entry ? entry.name : "";
    document.getElementById("ceDetail").value = entry ? (entry.detail || "") : "";
    document.getElementById("ceDelete").style.display = entry ? "" : "none";
    paintCeThumbs();
    paintCeLinks();

    var fileInput = document.getElementById("ceFileInput");
    fileInput.value = "";
    fileInput.onchange = function () {
      var files = Array.prototype.slice.call(fileInput.files || []);
      if (!files.length) return;
      var room = 6 - (ceDraft.images || []).length;
      var batch = files.slice(0, Math.max(0, room));
      batch.reduce(function (chain, f) {
        return chain.then(function () {
          return resizeImageFile(f).then(function (blob) {
            var path = "baogia/materials/" + slug(ceDraft.uploadKey) + "/" + Date.now() + "_" + Math.round(Math.random() * 1e4) + ".jpg";
            return uploadToStorage(path, blob, "image/jpeg");
          }).then(function (url) {
            ceDraft.images = (ceDraft.images || []).concat([url]);
            paintCeThumbs();
          });
        });
      }, Promise.resolve()).catch(function (err) { toast("Không tải được ảnh lên: " + err.message); });
    };

    document.getElementById("ceAddLink").onclick = function () {
      var url = document.getElementById("ceLinkUrl").value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      ceDraft.links = ceDraft.links || [];
      ceDraft.links.push({ url: url, label: document.getElementById("ceLinkLabel").value.trim() });
      document.getElementById("ceLinkUrl").value = "";
      document.getElementById("ceLinkLabel").value = "";
      paintCeLinks();
    };

    document.getElementById("ceDelete").onclick = function () {
      if (!ceOriginalCode) return;
      if (!confirm('Xoá mã "' + ceOriginalCode + '" khỏi thư viện?')) return;
      var idx = findCatalogEntryIndex(ceOriginalCode);
      if (idx > -1) PRICE_CATALOG.splice(idx, 1);
      saveCatalog(); closeCatalogEditor();
      if (view.screen === "catalog") renderCatalogScreen();
      if (view.screen === "detail") renderDetail();
      toast("Đã xoá mã vật tư.");
    };

    document.getElementById("ceSave").onclick = function () {
      var codeVal = document.getElementById("ceCode").value.trim().toUpperCase();
      var nameVal = document.getElementById("ceName").value.trim();
      if (!codeVal || !nameVal) { toast("Cần nhập Mã và Tên hạng mục."); return; }
      var dupIdx = findCatalogEntryIndex(codeVal);
      if (dupIdx > -1 && PRICE_CATALOG[dupIdx].code !== ceOriginalCode) { toast('Mã "' + codeVal + '" đã tồn tại.'); return; }

      var rec = {
        code: codeVal, name: nameVal,
        detail: document.getElementById("ceDetail").value.trim(),
        unit: document.getElementById("ceUnit").value.trim() || "cái",
        price: Number(document.getElementById("cePrice").value.replace(/[^0-9]/g, "")) || 0,
        images: (ceDraft.images || []).slice(), links: (ceDraft.links || []).slice()
      };

      var i2 = ceOriginalCode ? findCatalogEntryIndex(ceOriginalCode) : -1;
      if (i2 > -1) PRICE_CATALOG[i2] = rec; else PRICE_CATALOG.push(rec);

      saveCatalog();
      closeCatalogEditor();
      if (view.screen === "catalog") renderCatalogScreen();
      if (view.screen === "detail") renderDetail();
      toast(ceOriginalCode ? "Đã lưu mã " + codeVal : "Đã thêm mã " + codeVal + " vào thư viện.");
    };

    document.getElementById("catalogModalOverlay").hidden = false;
  }

  // Gợi ý Mã: dùng <datalist> của trình duyệt, KHÔNG tự vẽ dropdown.
  // Lý do: datalist chỉ là 1 thuộc tính list="..." trên ô nhập; trình duyệt tự lọc và vẽ danh sách
  // BÊN NGOÀI trang, không chèn/xoá node nào cạnh ô đang gõ → không thể làm văng con trỏ.
  // Gợi ý gồm mã trong Thư viện vật tư + các mã đang dùng trong chính báo giá này (mã lạ xếp sau).
  function codeListHtml(q) {
    var seen = {}, opts = [];
    PRICE_CATALOG.forEach(function (e) {
      var code = String(e.code || "").trim().toUpperCase();
      if (!code || seen[code]) return;
      seen[code] = true;
      var desc = [e.name, e.price ? moneyPlain(e.price) + "/" + (e.unit || "") : ""].filter(Boolean).join(" · ");
      opts.push('<option value="' + escapeHtml(code) + '">' + escapeHtml(desc) + '</option>');
    });
    if (q) {
      var addLoose = function (code) {
        code = String(code || "").trim().toUpperCase();
        if (!code || seen[code]) return;
        seen[code] = true;
        opts.push('<option value="' + escapeHtml(code) + '">(chưa có trong thư viện vật tư)</option>');
      };
      q.sections.forEach(function (sec) {
        sec.groups.forEach(function (g) { g.items.forEach(function (it) { addLoose(it.code); }); });
      });
      takeoffGroups(q).forEach(function (grp) { addLoose(grp.code); });
    }
    return '<datalist id="codeList">' + opts.join("") + '</datalist>';
  }
