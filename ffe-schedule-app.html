<title>FF&E — Hà Đô Charm Villas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bảng kê FF&E (thiết bị vệ sinh TOTO) cho Hà Đô Charm Villas — bảng chỉnh sửa trực tiếp, quản lý phòng, nhập/xuất Excel, màn xem chi tiết từng hạng mục.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
/* Industry design system — tokens từ bộ kit gốc (_ds/industry-…/styles.css) + bộ tối. */
:root{
  --bg:#ececed; --surface:#ffffff; --panel:#f4f4f7; --panel-2:#eeeef1;
  --ink:#1d1f20; --ink-2:#5a5a5d; --ink-3:#7a7a7d; --ink-4:#9a9a9d;
  --line:#e4e4e7; --line-2:#d2d2d6;
  --accent:#5980a6; --accent-strong:#456a8e; --accent-deep:#33506c; --accent-ink:#f4f6f8;
  --wash:#e9f1fa; --wash-line:#bcd4ea; --wash-ink:#2c455d; --sel:#e4eef8;
  --ordered:#5980a6; --approved:#2f7d55; --specified:#9a9a9d; --danger:#a5514b;
  --shadow:0 1px 2px rgba(29,31,32,.12), 0 8px 26px -12px rgba(29,31,32,.22);
  color-scheme:light;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){ color-scheme:dark;
  --bg:#131517; --surface:#1b1e21; --panel:#202327; --panel-2:#25292e;
  --ink:#e9e9ea; --ink-2:#b6b6b9; --ink-3:#96969a; --ink-4:#74747a;
  --line:#2c3035; --line-2:#3a3f45;
  --accent:#7ba5cd; --accent-strong:#94b8db; --accent-deep:#a7c6e6; --accent-ink:#10161c;
  --wash:#1e2a35; --wash-line:#33475a; --wash-ink:#bdd6ef; --sel:#1d2933;
  --ordered:#7ba5cd; --approved:#6db98a; --specified:#74747a; --danger:#d98b84;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#131517; --surface:#1b1e21; --panel:#202327; --panel-2:#25292e;
  --ink:#e9e9ea; --ink-2:#b6b6b9; --ink-3:#96969a; --ink-4:#74747a;
  --line:#2c3035; --line-2:#3a3f45;
  --accent:#7ba5cd; --accent-strong:#94b8db; --accent-deep:#a7c6e6; --accent-ink:#10161c;
  --wash:#1e2a35; --wash-line:#33475a; --wash-ink:#bdd6ef; --sel:#1d2933;
  --ordered:#7ba5cd; --approved:#6db98a; --specified:#74747a; --danger:#d98b84;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-weight:600;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tnum{font-variant-numeric:tabular-nums}
.kick{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.app{max-width:1300px;margin:0 auto;min-height:100%;background:var(--surface);border-inline:1px solid var(--line-2);display:flex;flex-direction:column}
@media(max-width:1300px){.app{border-inline:0}}

.loadwrap{min-height:100vh;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{width:min(340px,100%);border:1px solid var(--line-2);background:var(--surface);padding:28px 26px;display:flex;flex-direction:column;gap:12px}
.loginbrand{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;letter-spacing:.03em}
.loginsub{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.loginbox .field label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.loginbox .field input{width:100%;padding:8px 9px;font-size:13px;background:var(--panel);border:1px solid var(--line-2);color:var(--ink)}
.loginerr{font-size:11.5px;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);padding:7px 9px}
.loginfoot{font-size:10.5px;color:var(--ink-4);text-align:center;margin-top:4px}

.topbar{display:flex;align-items:center;gap:13px;padding:11px 16px;border-bottom:1px solid var(--line-2);position:relative}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;letter-spacing:.03em;color:var(--ink);padding:0}
.brand:hover{color:var(--accent)}
.crumb{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:1px;margin-left:auto}
.tab{font-size:12px;padding:6px 10px;color:var(--ink-3);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-3)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-4)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;font-family:"Barlow Condensed",sans-serif}
.menu{position:absolute;right:16px;top:46px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:30;min-width:210px}
.menu button{display:block;width:100%;text-align:left;font-size:12.5px;padding:8px 12px}
.menu button:hover{background:var(--panel)}
.menu hr{border:0;border-top:1px solid var(--line);margin:2px 0}

.toolbar{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{width:210px;padding:5px 9px;font-size:12px;background:var(--panel);border:1px solid var(--line-2);color:var(--ink)}
.search::placeholder{color:var(--ink-4)}
.selfilter{position:relative}
.selfilter select{appearance:none;font-size:11.5px;padding:5px 22px 5px 9px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.selfilter::after{content:"▾";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink-4);pointer-events:none}
.selfilter select:not([data-default="1"]){border-color:var(--accent);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 9px;border:1px solid var(--wash-line);background:var(--wash);color:var(--wash-ink)}
.chip button{color:inherit;font-size:12px;line-height:1;opacity:.7}
.chip.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-3)}
.chip.ghost:hover{border-color:var(--ink-4);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);margin-left:auto}
.seg button{font-size:11px;padding:5px 10px;color:var(--ink-3)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;padding:6px 12px;border:1px solid var(--line-2);white-space:nowrap}
.btn:hover{border-color:var(--ink-4)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn-sm{font-size:12px;padding:5px 10px}

.stats{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.8fr;border-bottom:1px solid var(--line)}
.stat{padding:9px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
@media(max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px}
  .crumb{display:none}
  .tabs{order:10;flex-basis:100%;margin-left:0;overflow-x:auto}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .dform{grid-template-columns:1fr}
}
.stat .v{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;margin-top:1px}
.bar{height:5px;background:var(--panel-2);margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.warn i{background:#b9863f}

.body{display:flex;align-items:stretch;flex:1;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tablewrap{overflow-x:auto;flex:1}
.tbl{min-width:1020px}
.trow .stt,.thead .stt{color:var(--ink-4);font-size:10px;text-align:right;justify-self:end}
.thead,.trow{display:grid;grid-template-columns:22px 28px 62px minmax(140px,1fr) 96px 104px 36px 112px 120px 44px 96px 66px 22px;column-gap:8px;align-items:center}
.thead{padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line-2);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);position:sticky;top:0;z-index:2}
.thead button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:3px;align-items:center}
.thead button:hover{color:var(--ink)}
.thead .r,.trow .r{text-align:right;justify-self:end}
.sortmark{font-size:8px;color:var(--accent)}
.grouphd{padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;position:sticky;top:26px;z-index:1}
.grouphd h4{font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.grouphd .sub{font-size:10.5px;color:var(--ink-4)}
.grouphd .gbar{width:88px;height:4px;background:var(--panel-2);position:relative;overflow:hidden}
.grouphd .gbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.grouphd .gbar i.over{background:#b9863f}
.grouphd .gact{margin-left:auto;display:flex;gap:4px;align-items:center}
.grouphd .gact button{font-size:11px;color:var(--ink-3);padding:3px 7px;border:1px solid var(--line-2)}
.grouphd .gact button:hover{color:var(--ink);border-color:var(--ink-4)}
.grouphd .gact .del:hover{color:var(--danger);border-color:var(--danger)}
.trow{padding:6px 16px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.trow:hover{background:var(--panel)}
.trow:hover .rowdel{opacity:1}
.trow[aria-selected="true"]{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.trow .code{color:var(--ink-3);font-size:11px}
.trow.unspec{color:var(--ink-4)}
.cell-ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowdel{opacity:0;color:var(--ink-4);font-size:13px;line-height:1;justify-self:center}
.rowdel:hover{color:var(--danger)}
.dot{display:inline-block;width:6px;height:6px;margin-right:6px;vertical-align:1px}
.dot.ordered{background:var(--ordered)}
.dot.approved{background:var(--ink)}
.dot.specified{background:var(--specified)}
.dot.unspecified{border:1px solid var(--ink-4)}
.cbox{width:14px;height:14px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--surface)}
.cbox[data-on="1"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbox svg{width:9px;height:9px;display:none}
.cbox[data-on="1"] svg{display:block}
.tfoot{padding:9px 16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);gap:12px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.addrow{padding:6px 16px;border-bottom:1px solid var(--line);font-size:11.5px}
.addrow button{color:var(--accent)}
.addrow button:hover{text-decoration:underline}

/* chỉnh sửa trực tiếp trong ô */
.ed{cursor:text;border-bottom:1px dotted transparent;padding:1px 3px;margin:-1px -3px;border-radius:2px;display:inline-block;max-width:100%}
.ed:hover{border-bottom-color:var(--ink-4);background:var(--panel-2)}
.ed:empty::before{content:"—";color:var(--ink-4)}
.ed-input{width:100%;min-width:60px;padding:2px 4px;font:inherit;font-size:12px;background:var(--surface);border:1px solid var(--accent);color:var(--ink)}
.grouphd .ed{font:inherit;font-family:"Barlow Condensed",sans-serif}

/* cards */
.cards{padding:6px 0}
.cardrow{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.cardrow:hover{background:var(--panel)}
.cardrow[aria-selected="true"]{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.thumb{width:56px;height:56px;flex:none;overflow:hidden}
.thumb img,.btile .slot img{width:100%;height:100%;object-fit:cover;display:block}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border:1px solid var(--line-2);color:var(--ink-3)}
.tag.accent{border-color:var(--wash-line);background:var(--wash);color:var(--wash-ink)}

/* board */
.board{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.btile{border:1px solid var(--line-2);display:flex;flex-direction:column}
.btile:hover{border-color:var(--ink-4)}
.btile[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btile .cap{padding:8px 9px}
.btile .cap .top{display:flex;justify-content:space-between;font-size:10px;color:var(--accent)}
.btile .cap h4{font-size:13px;margin:3px 0;line-height:1.15}
.btile .cap .meta{font-size:11px;color:var(--ink-3)}

/* image slot / blueprint */
.slot{background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line-2) 50%,transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--line-2) 50%,transparent calc(50% + .5px)),var(--panel);border:1px solid var(--line-2);position:relative}
.bp{position:relative}
.bp>i.mk{position:absolute;width:9px;height:9px;color:color-mix(in srgb,var(--ink) 45%,transparent)}
.bp>i.mk::before,.bp>i.mk::after{content:"";position:absolute;background:currentColor}
.bp>i.mk::before{left:4px;top:0;width:1px;height:100%}
.bp>i.mk::after{top:4px;left:0;height:1px;width:100%}
.bp>i.tl{top:-5px;left:-5px}.bp>i.tr{top:-5px;right:-5px}.bp>i.bl{bottom:-5px;left:-5px}.bp>i.br{bottom:-5px;right:-5px}

/* rail */
.rail{width:272px;flex:none;border-left:1px solid var(--line-2);padding:14px 15px;overflow-y:auto;position:sticky;top:0;align-self:flex-start;max-height:100vh}
@media(max-width:920px){.rail{display:none}}
.rail .kick{color:var(--accent);margin-bottom:8px}
.rail h3{font-size:17px;margin-top:10px}
.rail .vend{font-size:11.5px;color:var(--ink-3);margin-bottom:11px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:11.5px}
.spec dt{color:var(--ink-4)}
.spec dd{margin:0}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.att{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.att span::before{content:"▸ ";color:var(--ink-4)}
.railbtns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.railbtns .btn{flex:1;justify-content:center;min-width:96px}
.railnote{font-size:11px;color:var(--ink-3);border:1px dashed var(--line-2);padding:9px;margin-top:12px;white-space:pre-wrap}
.progress{display:flex;gap:2px;margin:8px 0 2px}
.progress i{flex:1;height:4px;background:var(--panel-2)}
.progress i.on{background:var(--accent)}
.plabels{display:flex;gap:2px;font-size:9px;color:var(--ink-4)}
.plabels span{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plabels span.on{color:var(--ink-2)}

.selbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);z-index:5;flex-wrap:wrap}
.selbar b{font-family:"Barlow Condensed",sans-serif;font-size:15px}
.selbar .btn{border-color:rgba(255,255,255,.4);color:var(--accent-ink)}
.selbar .btn-white{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent)}
.selbar button.link{margin-left:auto;font-size:12px;text-decoration:underline;opacity:.9}

.panel{padding:20px 16px;overflow-y:auto;flex:1}
.panel h2{font-size:22px;margin-bottom:3px}
.panel .lead{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.budtable{width:100%;border-collapse:collapse;font-size:12.5px}
.budtable th{text-align:left;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line-2)}
.budtable td{padding:9px 10px;border-bottom:1px solid var(--line)}
.budtable .r{text-align:right}
.minibar{height:5px;background:var(--panel-2);position:relative;overflow:hidden;min-width:80px;display:block}
.minibar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.minibar i.over{background:#b9863f}
.polist{display:flex;flex-direction:column;gap:10px}
.pocard{border:1px solid var(--line-2);padding:12px 14px}
.pocard .poh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pocard .poh b{font-family:"Barlow Condensed",sans-serif;font-size:15px}
.pocard .poh .st{font-size:11px;color:var(--ink-3);margin-left:auto}
.pocard ul{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.pocard li{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.vcard{border:1px solid var(--line-2);padding:12px 13px}
.vcard b{font-family:"Barlow Condensed",sans-serif;font-size:15px}
.vcard .m{font-size:11.5px;color:var(--ink-3);margin-top:3px}

.prjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.prjcard{border:1px solid var(--line-2);background:var(--surface);padding:18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.prjcard:hover{border-color:var(--accent)}
.prjcard.picked{border-color:var(--accent);background:var(--panel)}
.prjcard b{font-family:"Barlow Condensed",sans-serif;font-size:16px}
.prjcard .m{font-size:11.5px;color:var(--ink-3)}
.prjcard-new{align-items:center;justify-content:center;color:var(--accent);font-weight:600;border-style:dashed}

/* item detail */
.dhead{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.dhead .bc{font-size:12px;color:var(--ink-3)}
.dhead .bc a{color:var(--accent);cursor:pointer}
.dhead .bc a:hover{text-decoration:underline}
.dhead .dcode{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px}
.dhead .statustag{display:inline-flex;align-items:center;font-size:10px;padding:3px 8px;border:1px solid var(--line-2);color:var(--ink-2)}
.dnav{margin-left:auto;display:flex;gap:4px}
.dnav button{font-size:11.5px;color:var(--ink-3);padding:5px 10px;border:1px solid var(--line-2)}
.dnav button:hover:not(:disabled){color:var(--ink);border-color:var(--ink-4)}
.dnav button:disabled{opacity:.38;cursor:not-allowed}
.dbody{display:flex;align-items:flex-start}
@media(max-width:820px){.dbody{flex-direction:column}}
.dleft{width:330px;flex:none;border-right:1px solid var(--line-2);padding:16px}
@media(max-width:820px){.dleft{width:100%;border-right:0;border-bottom:1px solid var(--line-2)}}
.dhero{width:100%;height:230px;position:relative;overflow:hidden;cursor:pointer;background:var(--panel)}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dhero.ph{display:grid;place-items:center}
.dhero .phlabel{font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--ink-4)}
.dhero .hint{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;text-align:center;color:#fff;background:color-mix(in srgb,#000 55%,transparent);opacity:0;transition:opacity .12s}
.dhero:hover .hint{opacity:1}
.posbtn{position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center;background:color-mix(in srgb,#000 55%,transparent);color:#fff;font-size:12px;z-index:2;border-radius:2px}
.posbtn:hover{background:color-mix(in srgb,#000 75%,transparent)}
.pospick{position:absolute;top:34px;right:6px;z-index:3;display:grid;grid-template-columns:repeat(3,26px);gap:2px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:4px}
.pospick button{width:26px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--ink-2);border:1px solid transparent}
.pospick button:hover{border-color:var(--accent);color:var(--accent)}
.dthumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dthumbs .add{width:54px;height:54px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--ink-4);font-size:15px}
.dthumbs .add:hover{border-color:var(--accent);color:var(--accent)}
.dthumb{width:54px;height:54px;position:relative;overflow:hidden;border:1px solid var(--line-2);cursor:pointer}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dthumb.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dthumb-x{position:absolute;top:0;right:0;width:15px;height:15px;line-height:12px;font-size:11px;color:#fff;background:color-mix(in srgb,#000 55%,transparent)}
.dthumb-x:hover{background:var(--danger)}
.dleft.drop{outline:2px dashed var(--accent);outline-offset:-5px}
.imghint{font-size:10px;color:var(--ink-4);line-height:1.35;margin-top:8px}
.drule{height:1px;background:var(--line);margin:14px 0}
.dright{flex:1;min-width:0;padding:16px}
.dtitle{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;line-height:1.08;text-wrap:balance}
.dsub{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.dsec{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:15px 0 7px}
.dsec.mut{color:var(--ink-3)}
.dgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 14px;font-size:12.5px;padding-bottom:12px;border-bottom:1px solid var(--line);margin:0}
@media(max-width:560px){.dgrid{grid-template-columns:auto 1fr}}
.dgrid dt{color:var(--ink-4)}
.dgrid dd{margin:0}
.dtimeline{display:flex;gap:3px}
.dstep{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.dstep .rod{height:4px;background:var(--panel-2)}
.dstep.on .rod{background:var(--accent)}
.dstep small{font-size:10px;color:var(--ink-4);line-height:1.25}
.dstep.on small{color:var(--ink-2)}
.dactions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.dnote{margin-top:10px;padding:9px;border:1px dashed var(--line-2);font-size:11.5px;color:var(--ink-2);white-space:pre-wrap}
.dfiles{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-2)}
.dfile{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--line);background:var(--panel)}
.dfile .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:inherit;text-decoration:none}
.dfile a.fn:hover{color:var(--accent);text-decoration:underline}
.dfile .fs{font-size:10px;color:var(--ink-4);flex:none}
.dfile .fx{flex:none;color:var(--ink-4);font-size:13px;line-height:1}
.dfile .fx:hover{color:var(--danger)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:70;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}

.backdrop{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px;z-index:40}
.dialog{width:min(500px,100%);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
.dialog.wide{width:min(620px,100%)}
.dialog header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dialog header h3{font-size:17px}
.dialog header .kick{margin-left:auto}
.dform{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.dform .full{grid-column:1/-1}
.dform label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.dform input,.dform select,.dform textarea{width:100%;padding:6px 8px;font-size:12.5px;background:var(--panel);border:1px solid var(--line-2)}
.dform textarea{resize:vertical;min-height:52px}
.dialog footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.dialog footer .spacer{margin-right:auto}
.roomrow{display:grid;grid-template-columns:1fr 130px 52px auto;gap:8px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.roomrow input{padding:5px 7px;font-size:12.5px;background:var(--panel);border:1px solid var(--line-2)}
.roomrow .rc{color:var(--ink-4);text-align:right}
.roomrow .rx{display:flex;gap:3px}
.roomrow .rx button{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-2);font-size:11px;color:var(--ink-3)}
.roomrow .rx button:hover{color:var(--ink);border-color:var(--ink-4)}
.roomrow .rx button.del:hover{color:var(--danger);border-color:var(--danger)}
.impbox{border:1px dashed var(--line-2);padding:16px;text-align:center;font-size:12px;color:var(--ink-3);margin:0 16px 14px}
.impbox.drop{border-color:var(--accent);background:var(--wash)}

.clientbar{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--wash);color:var(--wash-ink);border-bottom:1px solid var(--wash-line);font-size:11.5px}
.clientbar button{margin-left:auto;font-size:11px;text-decoration:underline;color:var(--wash-ink)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);font-size:12.5px;padding:9px 15px;box-shadow:var(--shadow);animation:tin .2s ease;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// hiện trong dữ liệu gốc (TOTO...) — mỗi model chỉ giữ 1 dòng, để lần đầu mở app đã có ví dụ thật
// thay vì thư viện trống trơn.
function buildDefaultCatalog(){
  const seen = new Set(), out = [];
  DEFAULT_ITEMS.forEach(it=>{
    const code = (it.model||"").trim().toUpperCase();
    if(!code || seen.has(code)) return;
    seen.add(code);
    out.push({ code, name:it.name, vendor:it.vendor||null, model:it.model, uom:it.uom,
      unit:it.unit, dims:it.dims||undefined, finish:it.finish||undefined, images:[], links:[] });
  });
  return out;
}

function ensureOrdAndCategory(){
  let n = 0;
  items.forEach(it=>{
    if(typeof it.ord!=="number") it.ord = ++n; else n = Math.max(n, it.ord);
    if(!it.category || !CATEGORIES.includes(it.category)) it.category = guessCategory(it);
  });
}

function linkMatCodesFromModel(){
  if(!catalog.length) return;
  items.forEach(it=>{
    if(it.matCode || !it.model) return;
    const guess = it.model.trim().toUpperCase();
    if(catalog.some(m=>m.code===guess)) it.matCode = guess;
  });
}

let catalogUnsub = null, catalogSeeded = false;
function subscribeCatalog(){
  if(catalogUnsub) return;
  catalogUnsub = CATALOG_COL.onSnapshot(snap=>{
    if(snap.empty && !catalogSeeded){ catalogSeeded = true; seedGlobalCatalog(); }
    catalog = snap.docs.map(d=>d.data());
    render();
  }, err=>{ toast("Không tải được thư viện vật tư — "+err.message); });
}
// Lần đầu tiên chuyên mục này còn trống: lấy đúng bản catalog đang có sẵn trong dự án Hà Đô Charm Villas
// (đề phòng Nam đã tự sửa/thêm ảnh cho vài mã), không có thì mới dùng bộ mặc định TOTO.
async function seedGlobalCatalog(){
  let seedList = null;
  try{
    const legacy = await projectDocRef("hado-charm-villas").get();
    if(legacy.exists && Array.isArray(legacy.data().catalog) && legacy.data().catalog.length) seedList = legacy.data().catalog;
  }catch(e){}
  const list = seedList || buildDefaultCatalog();
  const batch = db.batch();
  list.forEach(m=>{ if(m && m.code) batch.set(CATALOG_COL.doc(slug(m.code)), m); });
  try{ await batch.commit(); }catch(e){}
}

// Ghi lên Firestore có debounce 500ms (gộp nhiều sửa liên tiếp thành 1 lần ghi) — trả về true ngay
// (lạc quan: coi như ghi được), báo lỗi qua toast nếu sau đó thật sự ghi thất bại (mất mạng...).
function save(){
  pendingSave = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
  return true;
}
function flushSave(){
  if(!pendingSave || !currentProjectId) return;
  pendingSave = false;
  projectDocRef(currentProjectId).set({
    name: currentProjectName, rooms, items, vendors,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
  }).catch(err=> toast("Không lưu được lên server — "+err.message));
}
window.addEventListener("beforeunload", ()=>{ if(pendingSave) flushSave(); });

function slugifyVi(s){
  return String(s||"").replace(/đ/g,"d").replace(/Đ/g,"D")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
}
function uniqueProjectId(name){
  const base = slugifyVi(name) || "du-an";
  const existing = new Set(projects.map(p=>p.id));
  let id = base, n = 2;
  while(existing.has(id)){ id = base+"-"+n; n++; }
  return id;
}

// ── Điều hướng qua URL hash: #/<projectId>/<tab>?view=&item= — để F5 giữ nguyên màn đang xem ──
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, "");
  if(!raw) return null;
  const [pathPart, queryPart] = raw.split("?");
  const parts = pathPart.split("/").map(p=> { try{ return decodeURIComponent(p); }catch(e){ return p; } });
  const params = new URLSearchParams(queryPart||"");
  return { projectId: parts[0]||null, tab: parts[1]||"schedule", view: params.get("view")||"table", detail: params.get("item")||null };
}
function updateHash(){
  // history.replaceState có thể ném lỗi trong vài sandbox đặc biệt (vd. trang data:) — không để lỗi này làm hỏng cả render().
  try{
    if(!currentProjectId){
      if(location.hash) history.replaceState(null,"", location.pathname+location.search);
      return;
    }
    let h = "#/"+encodeURIComponent(currentProjectId)+"/"+ui.tab;
    if(ui.tab==="schedule"){
      const params = new URLSearchParams();
      if(ui.view && ui.view!=="table") params.set("view", ui.view);
      if(ui.detail) params.set("item", ui.detail);
      const qs = params.toString();
      if(qs) h += "?"+qs;
    }
    if(location.hash !== h) history.replaceState(null,"", h);
  }catch(e){}
}

async function openProject(id, opts){
  opts = opts || {};
  if(docUnsub){ docUnsub(); docUnsub=null; }
  ui.tab = ["schedule","budget","orders","library"].includes(opts.tab) ? opts.tab : "schedule";
  ui.view = ["table","cards","board"].includes(opts.view) ? opts.view : "table";
  ui.detail = opts.detail || null;
  ui.menu = false; ui.picks.clear();
  // Mỗi dự án là 1 tập dữ liệu riêng — xoá bộ lọc/sắp xếp của dự án trước để không bị hiểu nhầm
  // là dự án mới "rỗng" khi bộ lọc cũ (phòng/NCC/nhóm...) không khớp dữ liệu dự án này.
  ui.q=""; ui.room=""; ui.status=""; ui.vendor=""; ui.cat=""; ui.matCodeFilter=""; ui.leadOnly=false;
  ui.sortKey="ord"; ui.sortDir=1;
  renderLoading("Đang tải dữ liệu dự án…");
  const ref = projectDocRef(id);
  try{
    const snap = await ref.get();
    if(!snap.exists){
      toast("Không tìm thấy dự án này"); currentProjectId=null; render(); return;
    }
  }catch(err){
    renderLoading("Không tải được dữ liệu: ["+err.code+"] "+err.message+" — thử tải lại trang (F5).");
    return;
  }
  currentProjectId = id;
  docUnsub = ref.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data();
    currentProjectName = d.name || (id==="hado-charm-villas" ? "Hà Đô Charm Villas — TOTO" : id);
    if(!d.name && !RO()) ref.update({name: currentProjectName}).catch(()=>{});
    rooms = Array.isArray(d.rooms) ? d.rooms : [];
    items = Array.isArray(d.items) ? d.items : [];
    vendors = Array.isArray(d.vendors) ? d.vendors : [];
    ensureOrdAndCategory();
    if(ui.detail && !items.some(i=>i.code===ui.detail)) ui.detail = null;
    if(!ui.selected || !items.some(i=>i.code===ui.selected)) ui.selected = items[0]?.code || null;
    render();
  }, err=>{
    renderLoading("Mất kết nối tới server: ["+err.code+"] "+err.message+" — thử tải lại trang (F5).");
  });
}

function findMaterial(code){ const c=(code||"").trim().toUpperCase(); return c ? (catalog.find(m=>m.code===c)||null) : null; }
function materialList(){ return catalog.slice().sort((a,b)=>a.code.localeCompare(b.code)); }
function lineTotal(it){ return it.unit==null ? null : it.qty*it.unit; }
// Vị trí crop của ảnh (object-position) — lưu theo URL trên chính hạng mục/mã vật tư, không đổi cấu trúc mảng images[].
function imgPos(entity, url){ return (entity && entity.imagePos && entity.imagePos[url]) || "center center"; }
// Hạng mục chưa tự có ảnh riêng thì mượn ảnh của mã vật tư (Thư viện) — nhờ vậy hạng mục mới/nhân bản sang
// phòng khác, hay dự án mới tạo, đều thấy ngay ảnh của vật liệu đó mà không cần chép lại dữ liệu ảnh mỗi nơi.
function itemImages(it){
  if(it.images && it.images.length) return it.images;
  const m = it.matCode ? findMaterial(it.matCode) : null;
  return (m && m.images) || [];
}
function itemImgPos(it, url){
  if(it.imagePos && it.imagePos[url]) return it.imagePos[url];
  const m = it.matCode ? findMaterial(it.matCode) : null;
  return (m && m.imagePos && m.imagePos[url]) || "center center";
}
const IMG_POSITIONS = [

function addVendor(name){

  if(name && !vendors.includes(name) && !items.some(i=>i.vendor===name)) vendors.push(name);

function roomBudget(name){ const r = rooms.find(x=>x.name===name); return r ? (+r.budget||0) : 0; }
function budgetTotal(){ return rooms.reduce((a,r)=>a+(+r.budget||0),0); }
function nextCode(){
  const n = items.map(i=>+((i.code||"").match(/(\d+)\s*$/)||[])[1]).filter(x=>x).reduce((a,b)=>Math.max(a,b),0);
  return "TT-"+String(n+1).padStart(3,"0");
}
function nextOrd(){ return items.reduce((m,i)=>Math.max(m, i.ord||0), 0) + 1; }
function roomNames(){ return rooms.map(r=>r.name); }
const roomIndex = name => { const i = rooms.findIndex(r=>r.name===name); return i<0 ? 1e6 : i; };

// gom theo phòng, LUÔN theo thứ tự rooms[] (đồng nhất giữa Bảng / Thẻ / Bảng ảnh)
function groupsForView(list){
  const groups = roomNames().map(name=>[name, list.filter(i=>i.room===name)]);
  const known = new Set(roomNames());
  const orphanNames = [...new Set(list.filter(i=>!known.has(i.room)).map(i=>i.room||"(chưa phân phòng)"))];
  orphanNames.forEach(name=> groups.push([name, list.filter(i=>(i.room||"(chưa phân phòng)")===name), true]));
  return groups;
}

function filtered(){
  let list = items.filter(it=>{
    if(ui.room && it.room!==ui.room) return false;
    if(ui.status && it.status!==ui.status) return false;
    if(ui.vendor && it.vendor!==ui.vendor) return false;
    if(ui.cat && (it.category||"Khác")!==ui.cat) return false;
    if(ui.matCodeFilter && it.matCode!==ui.matCodeFilter) return false;
    if(ui.leadOnly && !(it.lead>8)) return false;
    if(ui.q){
      const s = (it.code+" "+(it.matCode||"")+" "+it.name+" "+(it.vendor||"")+" "+(it.model||"")+" "+(it.room||"")+" "+(it.category||"")).toLowerCase();
      if(!s.includes(ui.q.toLowerCase())) return false;
    }
    return true;
  });
  const k = ui.sortKey, d = ui.sortDir;
  list.sort((a,b)=>{
    let av,bv;
    if(k==="ord"){ av=a.ord||0; bv=b.ord||0; }
    else if(k==="total"){ av=lineTotal(a)??-1; bv=lineTotal(b)??-1; }
    else if(k==="unit"){ av=a.unit??-1; bv=b.unit??-1; }
    else if(k==="qty"){ av=a.qty; bv=b.qty; }
    else if(k==="lead"){ av=a.lead??-1; bv=b.lead??-1; }
    else if(k==="status"){ av=STATUSES.indexOf(a.status); bv=STATUSES.indexOf(b.status); }
    else { av=(a[k]||"").toString().toLowerCase(); bv=(b[k]||"").toString().toLowerCase(); }
    return av<bv ? -d : av>bv ? d : ((a.ord||0)-(b.ord||0));
  });
  return list;
}

function stats(){
  const budget = budgetTotal();
  const committed = items.filter(i=>i.status==="Approved"||i.status==="Ordered").reduce((a,i)=>a+(lineTotal(i)||0),0);
  const specced = items.filter(i=>i.status!=="Unspecified").length;
  const value = items.reduce((a,i)=>a+(lineTotal(i)||0),0);
  return { count:items.length, specced, budget, committed, value };
}

async function renameProject(id){
  const p = projects.find(x=>x.id===id); if(!p) return;
  const name = prompt("Tên mới cho dự án:", p.name);
  if(!name || !name.trim() || name.trim()===p.name) return;
  try{ await projectDocRef(id).update({name: name.trim()}); toast("Đã đổi tên dự án"); }
  catch(err){ toast("Không đổi được tên — "+err.message); }
}
async function deleteProjectsBulk(ids){
  try{
    await Promise.all(ids.map(id=> projectDocRef(id).delete()));
    toast(ids.length>1 ? `Đã xoá ${ids.length} dự án` : "Đã xoá dự án");
  }catch(err){ toast("Không xoá được — "+err.message); }
}
async function duplicateProjectsBulk(ids){
  try{
    for(const id of ids){
      const p = projects.find(x=>x.id===id); if(!p) continue;
      const raw = p._raw || {};
      const newName = (raw.name||p.name) + " (bản sao)";
      const newId = uniqueProjectId(newName);
      await db.collection("ffe_projects").doc(newId).set({
        name: newName, rooms: raw.rooms||[], items: raw.items||[], vendors: raw.vendors||[],
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
      });
    }
    toast(ids.length>1 ? `Đã chép ${ids.length} dự án` : "Đã chép dự án");
  }catch(err){ toast("Không chép được — "+err.message); }
}
function openNewProjectDialog(){
  ui.dialog = {type:"newproject"};
  paintDialog(`
    <header><h3>Tạo dự án mới</h3></header>
    <div class="dform">
      <div class="full"><label>Tên dự án</label><input id="np_name" placeholder="vd. Project B — Vinhomes Ocean Park"></div>
      <div class="full"><label>Dữ liệu ban đầu</label>
        <select id="np_source">
          <option value="blank">Dự án trống — tự nhập từ đầu</option>
          <option value="mock">Dữ liệu mẫu TOTO (giống Hà Đô Charm Villas) — sửa lại sau</option>
        </select>
      </div>
    </div>
    <footer><button class="btn btn-sm" data-close>Huỷ</button><button class="btn btn-primary btn-sm" id="np_save">Tạo dự án</button></footer>`);
  $("#np_save").onclick = async ()=>{
    const name = $("#np_name").value.trim();
    if(!name){ $("#np_name").focus(); $("#np_name").style.borderColor="var(--danger)"; return; }
    const id = uniqueProjectId(name);
    const source = $("#np_source").value;
    const data = source==="mock"
      ? { rooms: DEFAULT_ROOMS.map(r=>({...r})), items: DEFAULT_ITEMS.map(x=>({...x})), vendors:[...DEFAULT_VENDORS] }
      : { rooms: [], items: [], vendors: [] };
    $("#np_save").disabled = true; $("#np_save").textContent = "Đang tạo…";
    try{
      await db.collection("ffe_projects").doc(id).set({
        name, ...data,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
      });
      closeDialog();
      toast("Đã tạo dự án “"+name+"”");
      openProject(id, {tab:"schedule"});
    }catch(err){
      toast("Không tạo được dự án — "+err.message);
      $("#np_save").disabled = false; $("#np_save").textContent = "Tạo dự án";
    }
  };
}

const edCell = (code,field,html)=> RO()

  : `<span class="ed" data-ed="${field}" data-code="${code}">${html}</span>`;
const anyFilterOn = () => ui.q||ui.room||ui.status||ui.vendor||ui.cat||ui.matCodeFilter||ui.leadOnly;

function tableView(){
  const list = filtered();
  const anyFilter = anyFilterOn();
  const ro = RO();
  let rows = "", stt = 0;
  const groupBlock = (roomName, g, orphan)=>{
    const editable = !orphan && !ro;
    const sub = g.reduce((a,i)=>a+(lineTotal(i)||0),0);
    const budg = (!orphan) ? roomBudget(roomName) : 0;
    let h = `<div class="grouphd">
      ${editable
        ? `<h4><span class="ed" data-ed="room.name" data-room="${esc(roomName)}">${esc(roomName)}</span></h4>`
        : `<h4>${esc(roomName)}</h4>`}
      <span class="sub tnum">${g.length} hạng mục · ${money(sub)}${editable?` / <span class="ed" data-ed="room.budget" data-room="${esc(roomName)}">${num(budg)}</span> ₫` : (budg?` / ${money(budg)}`:"")}</span>
      ${budg ? `<span class="gbar" title="${money(sub)} / ${money(budg)}"><i class="${sub>budg?"over":""}" style="width:${Math.min(100,sub/budg*100)}%"></i></span>`:""}
      ${ro?"":`<span class="gact">
        <button data-addto="${esc(roomName)}">+ dòng</button>
        ${editable?`<button class="del" data-delroom="${esc(roomName)}" title="Xoá phòng">×</button>`:""}
      </span>`}
    </div>`;
    for(const it of g) h += tableRow(it, ++stt);
    if(!g.length && !ro) h += `<div class="addrow"><button data-addto="${esc(roomName)}">+ Thêm hạng mục vào phòng này</button>${anyFilter?` <span style="color:var(--ink-4)">(có thể đang bị ẩn bởi bộ lọc)</span>`:""}</div>`;
    return h;
  };

  for(const [name,g,orphan] of groupsForView(list)) rows += groupBlock(name, g, orphan);

  const visSum = list.reduce((a,i)=>a+(lineTotal(i)||0),0);
  return `
  <div class="tablewrap"><div class="tbl">
    <div class="thead">
      <span></span>
      <span class="stt">STT</span>
      ${sortBtn("matCode","Mã vật tư")}
      ${sortBtn("name","Hạng mục")}
      ${sortBtn("category","Nhóm")}
      ${sortBtn("vendor","NCC")}
      ${sortBtn("qty","SL",true)}
      ${sortBtn("unit","Đơn giá",true)}
      ${sortBtn("total","Thành tiền",true)}
      ${sortBtn("lead","Lead",true)}
      ${sortBtn("status","Trạng thái")}
      <span>PO</span>
      <span></span>
    </div>
    ${rows || `<div class="empty">Chưa có hạng mục nào.</div>`}
  </div></div>
  <div class="tfoot">
    <span>Hiện ${list.length} / ${items.length} hạng mục${anyFilter?` · <button class="link" id="clearAll" style="text-decoration:underline;color:var(--accent)">bỏ lọc</button>`:""}</span>
    <span class="tnum">Tổng dòng đang hiện · ${money(visSum)}</span>
  </div>`;
}

    const sub = g.reduce((a,i)=>a+(lineTotal(i)||0),0), b = roomBudget(room);
    out += `<div class="grouphd"><h4>${esc(room)}</h4><span class="sub tnum">${g.length} hạng mục · ${money(sub)}${b?` / ${money(b)}`:""}</span>

      ${(orphan||RO())?"":`<span class="gact"><button data-addto="${esc(room)}">+ dòng</button></span>`}</div>`;
    if(!g.length){ if(!RO()) out += `<div class="addrow"><button data-addto="${esc(room)}">+ Thêm hạng mục vào phòng này</button></div>`; continue; }
    for(const it of g){
      const t = lineTotal(it), img = itemImages(it)[0];
      out += `<div class="cardrow" data-code="${it.code}" aria-selected="${ui.selected===it.code}" tabindex="0">
        <div class="thumb ${img?"":"slot bp"}">${img?`<img src="${img}" alt="" style="object-position:${itemImgPos(it,img)}">`:`<i class="mk tl"></i><i class="mk tr"></i><i class="mk bl"></i><i class="mk br"></i>`}</div>

  if(!seq.includes(ui.detail)) seq = items.map(i=>i.code);
  return seq;
}

// ── panels ────────────────────────────────────────────────────
function panelView(){
  if(ui.tab==="budget") return budgetPanel();
  if(ui.tab==="orders") return ordersPanel();
  return libraryPanel();
}
function budgetPanel(){
  const s = stats();
  const rowsHtml = roomNames().map(r=>{
    const g = items.filter(i=>i.room===r);
    const spent = g.reduce((a,i)=>a+(lineTotal(i)||0),0);
    const commit = g.filter(i=>i.status==="Approved"||i.status==="Ordered").reduce((a,i)=>a+(lineTotal(i)||0),0);
    const b = roomBudget(r), pct = b?spent/b*100:0;
    return `<tr>
      <td>${esc(r)}</td>
      <td class="r tnum">${money(b)}</td>
      <td class="r tnum">${money(spent)}</td>
      <td class="r tnum">${money(commit)}</td>
      <td class="r tnum" style="color:${spent>b?'#b9863f':'var(--ink-3)'}">${money(b-spent)}</td>
      <td style="width:120px"><span class="minibar"><i class="${spent>b?"over":""}" style="width:${Math.min(100,pct)}%"></i></span></td>
    </tr>`;
  }).join("");
  const totalSpent = items.reduce((a,i)=>a+(lineTotal(i)||0),0);
  return `<div class="panel">
    <h2>Ngân sách theo phòng</h2>
    <p class="lead">Giá trị đã chốt so với ngân sách. “Đã cam kết” = các dòng Đã duyệt + Đã đặt. Sửa ngân sách phòng ngay ở tiêu đề nhóm trong Bảng kê.</p>
    <table class="budtable">
      <thead><tr><th>Phòng</th><th class="r">Ngân sách</th><th class="r">Đã chốt</th><th class="r">Đã cam kết</th><th class="r">Còn lại</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
      <tfoot><tr style="font-weight:600">
        <td>Tổng</td>
        <td class="r tnum">${money(s.budget)}</td>
        <td class="r tnum">${money(totalSpent)}</td>
        <td class="r tnum">${money(s.committed)}</td>
        <td class="r tnum">${money(s.budget-totalSpent)}</td><td></td>
      </tr></tfoot>
    </table>
  </div>`;
}
function ordersPanel(){
  const pos = {};
  items.filter(i=>i.po).forEach(i=>{ (pos[i.po] ||= []).push(i); });
  const keys = Object.keys(pos).sort();
  if(!keys.length) return `<div class="panel"><h2>Đơn đặt hàng</h2><p class="lead">Chưa có PO nào. Chọn các dòng trong Bảng kê rồi bấm “Tạo PO”.</p></div>`;
  const cards = keys.map(k=>{
    const g = pos[k], vend = g[0].vendor, sum = g.reduce((a,i)=>a+(lineTotal(i)||0),0);
    const stg = Math.min(...g.map(i=>i.stage??1));
    return `<div class="pocard">
      <div class="poh"><b>${esc(k)}</b><span style="font-size:12px;color:var(--ink-3)">${esc(vend||"—")} · lập ${esc(g[0].poDate||"—")}</span><span class="st">${STAGE[stg]||"Đã đặt hàng"}</span></div>
      <ul>${g.map(i=>`<li><span>${i.code} · ${esc(i.name)} ×${i.qty}</span><span class="tnum">${money(lineTotal(i))}</span></li>`).join("")}</ul>
      <div style="display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600">
        <span>Tổng đơn</span><span class="tnum">${money(sum)}</span></div>
    </div>`;
  }).join("");
  const total = keys.reduce((a,k)=>a+pos[k].reduce((x,i)=>x+(lineTotal(i)||0),0),0);
  return `<div class="panel"><h2>Đơn đặt hàng</h2>
    <p class="lead">${keys.length} đơn · ${money(total)} đã cam kết</p>
    <div class="polist">${cards}</div></div>`;
}
function libraryPanel(){
  const rows = vendorList().map(v=>{
    const g = items.filter(i=>i.vendor===v);
    const sum = g.reduce((a,i)=>a+(lineTotal(i)||0),0);
    return `<div class="vcard">
      <b>${esc(v)}</b>
      <div class="m">${g.length} hạng mục · ${money(sum)}</div>
      <div class="m" style="margin-top:6px;color:var(--ink-4)">${[...new Set(g.map(i=>i.room))].map(esc).join(", ")}</div>
    </div>`;
  }).join("");
  const unsp = items.filter(i=>!i.vendor);
  return `<div class="panel"><h2>Nhà cung cấp</h2>
    <p class="lead">${vendorList().length} NCC trên dự án. ${unsp.length} hạng mục chưa có nguồn.</p>
    <div class="vgrid">${rows}</div>
    ${unsp.length?`<h3 style="font-size:15px;margin:22px 0 8px">Chưa có NCC</h3><div class="att">${unsp.map(i=>`<span>${i.code} · ${esc(i.name)} — ${esc(i.room)}</span>`).join("")}</div>`:""}
  </div>`;
}

// ── dialogs ───────────────────────────────────────────────────
function paintDialog(inner, wide){
  let b = $("#backdrop");
  if(!b){ b = document.createElement("div"); b.id="backdrop"; b.className="backdrop"; document.body.appendChild(b); }
  b.innerHTML = `<div class="dialog ${wide?"wide":""}" role="dialog" aria-modal="true">${inner}</div>`;
  b.onclick = e=>{ if(e.target===b || e.target.hasAttribute("data-close")) closeDialog(); };
  document.addEventListener("keydown", escClose);
  const first = b.querySelector("input,select,textarea,button"); if(first) first.focus();
}
function escClose(e){ if(e.key==="Escape") closeDialog(); }
function closeDialog(){ const b=$("#backdrop"); if(b) b.remove(); ui.dialog=null; document.removeEventListener("keydown",escClose); }

const roomOpts = sel => roomNames().map(r=>`<option ${r===sel?"selected":""}>${esc(r)}</option>`).join("");

// Điền các ô trong form Thêm/Sửa (prefix "a_" hoặc "d_") theo 1 mã trong Thư viện vật tư.
// Không tự động chạy ngầm — chỉ áp dụng khi bấm "Áp dụng", để không ghi đè dữ liệu đang gõ dở.
function applyMaterialToForm(prefix, code){
  const m = findMaterial(code || $("#"+prefix+"matcode").value);
  if(!m){ toast("Không tìm thấy mã này trong thư viện vật tư"); return; }
  $("#"+prefix+"matcode").value = m.code;
  if($("#"+prefix+"name")) $("#"+prefix+"name").value = m.name || "";
  if($("#"+prefix+"vendor")) $("#"+prefix+"vendor").value = m.vendor || "";
  if($("#"+prefix+"model")) $("#"+prefix+"model").value = m.model || "";
  if($("#"+prefix+"uom")) $("#"+prefix+"uom").value = m.uom || "chiếc";
  if($("#"+prefix+"unit") && m.unit!=null) $("#"+prefix+"unit").value = m.unit;
  if($("#"+prefix+"dims")) $("#"+prefix+"dims").value = m.dims || "";
  if($("#"+prefix+"finish")) $("#"+prefix+"finish").value = m.finish || "";
  toast("Đã điền theo mã "+m.code+" — vẫn sửa được tất cả các ô");
}

      if(new Set(names).size !== names.length){ toast("Tên phòng bị trùng"); return; }

      const renameMap = {};

// ── Lịch sử mã vật tư: mỗi lần ghi đè, lưu lại bản trước đó (giống commit history) ──
async function archiveMaterialVersion(id, dataBeforeOverwrite){
  const {imagePos, ...rest} = dataBeforeOverwrite; // bớt imagePos cho gọn lịch sử, không cần thiết để xem lại
  try{
    await CATALOG_COL.doc(id).collection("history").add({
      ...rest,
      _archivedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(e){ /* không chặn luồng lưu chính nếu ghi lịch sử lỗi */ }
}
async function openMaterialHistory(code){
  const id = slug(code);
  ui.dialog = {type:"material-history"};
  paintDialog(`<header><h3>Lịch sử "${esc(code)}"</h3></header><div style="padding:16px" id="mh_body">Đang tải…</div><footer><button class="btn btn-sm" data-close>Đóng</button></footer>`);
  try{
    const snap = await CATALOG_COL.doc(id).collection("history").orderBy("_archivedAt","desc").limit(20).get();
    const rows = snap.docs;
    $("#mh_body").innerHTML = rows.length ? rows.map(d=>{
      const v = d.data();
      return `<div class="roomrow" style="grid-template-columns:1fr auto">
        <span>
          <b>${esc(v.name||"—")}</b>
          <div style="font-size:11px;color:var(--ink-3)">${fmtDate(v._archivedAt)}${v.updatedBy?" · "+esc(v.updatedBy):""} — ${v.vendor?esc(v.vendor)+" · ":""}${v.unit!=null?money(v.unit):"—"}</div>
        </span>
        <button class="btn btn-sm" data-restore="${d.id}">Khôi phục</button>
      </div>`;
    }).join("") : `<div class="empty">Chưa có phiên bản cũ nào — lịch sử bắt đầu từ lần sửa tiếp theo.</div>`;
    document.querySelectorAll("[data-restore]").forEach(b=> b.onclick = async ()=>{
      const histDoc = rows.find(d=>d.id===b.dataset.restore); if(!histDoc) return;
      if(!confirm("Khôi phục về phiên bản này? Bản hiện tại sẽ được lưu vào lịch sử trước khi ghi đè.")) return;
      try{
        const liveSnap = await CATALOG_COL.doc(id).get();
        if(liveSnap.exists) await archiveMaterialVersion(id, liveSnap.data());
        const {_archivedAt, ...restoreData} = histDoc.data();
        await CATALOG_COL.doc(id).set({...restoreData, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy:(fbAuth.currentUser&&fbAuth.currentUser.email)||null});
        closeDialog(); toast("Đã khôi phục mã "+code); openMaterialLibrary();
      }catch(err){ toast("Không khôi phục được — "+err.message); }
    });
  }catch(err){
    $("#mh_body").innerHTML = `<div class="empty">Không tải được lịch sử — ${esc(err.message)}</div>`;
  }
}

// Sửa mã vật tư ĐÃ CÓ SẴN (import Excel, hoặc đã tồn tại): thêm/xoá/sắp xếp ảnh, đổi vị trí, thêm liên kết
// đều lưu thẳng lên Firestore ngay — không đợi bấm "Lưu" mới ghi. Trước đây các thao tác này chỉ sửa
// `matDraft` trong bộ nhớ, nếu Nam đóng dialog mà quên bấm "Lưu" thì ảnh đã tải lên Storage nhưng
// không có trong Firestore, "gọi" lại mã đó lần sau sẽ không thấy ảnh. Mã MỚI (chưa có matOriginalCode)
// vẫn chỉ lưu khi bấm "Lưu", vì lúc đó chưa chắc đã có Tên/Mã hợp lệ để ghi.
async function persistMatDraft(){
  if(!matOriginalCode) return;
  try{
    await CATALOG_COL.doc(slug(matOriginalCode)).set({
      images:(matDraft.images||[]).slice(),
      imagePos:{...(matDraft.imagePos||{})},
      links:(matDraft.links||[]).slice(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
    }, {merge:true});
  }catch(e){ toast("Không lưu được ảnh/liên kết — "+e.message); }
}
function paintMatMedia(){
  const im = matDraft.images || [];
  $("#m_hero").innerHTML = im[0]
    ? `<div class="dhero" data-mpick="1" style="height:140px" title="Đổi ảnh chính"><img src="${im[0]}" alt="" style="object-position:${imgPos(matDraft,im[0])}"><span class="hint">Bấm để đổi · thêm nhiều ảnh</span><button class="posbtn" data-mtogglepos="1" title="Chỉnh vị trí ảnh">⤢</button>${matPosPickerOpen?positionPickerHtml():""}</div>`
    : `<div class="dhero slot bp ph" data-mpick="1" style="height:140px"><i class="mk tl"></i><i class="mk tr"></i><i class="mk bl"></i><i class="mk br"></i><span class="phlabel">+ Thêm ảnh</span></div>`;
  $("#m_hero [data-mpick]").onclick = matPickImages;
  $("#m_hero [data-mtogglepos]") && ($("#m_hero [data-mtogglepos]").onclick = e=>{ e.stopPropagation(); matPosPickerOpen = !matPosPickerOpen; paintMatMedia(); });
  document.querySelectorAll("#m_hero [data-setpos]").forEach(el=> el.onclick = e=>{
    e.stopPropagation();
    matDraft.imagePos = matDraft.imagePos||{}; matDraft.imagePos[im[0]] = el.dataset.setpos;
    matPosPickerOpen = false; paintMatMedia(); persistMatDraft();
  });
  const thumbs = $("#m_thumbs");
  thumbs.innerHTML = im.map((src,i)=>`<div class="dthumb ${i===0?"active":""}" style="width:48px;height:48px" data-mthumb="${i}" title="${i===0?"Ảnh chính":"Đặt làm ảnh chính"}"><img src="${src}" alt="" style="object-position:${imgPos(matDraft,src)}"><button class="dthumb-x" data-mrmimg="${i}">×</button></div>`).join("")
    + (im.length<6 ? `<button class="add" style="width:48px;height:48px" data-mpick="1">+</button>` : "");
  thumbs.querySelectorAll("[data-mpick]").forEach(b=> b.onclick = matPickImages);
  thumbs.querySelectorAll("[data-mthumb]").forEach(el=> el.onclick = e=>{
    if(e.target.closest("[data-mrmimg]")) return;
    const i = +el.dataset.mthumb;
    if(i>0){ matDraft.images.unshift(matDraft.images.splice(i,1)[0]); paintMatMedia(); persistMatDraft(); }
  });
  thumbs.querySelectorAll("[data-mrmimg]").forEach(b=> b.onclick = e=>{ e.stopPropagation(); matDraft.images.splice(+b.dataset.mrmimg,1); paintMatMedia(); persistMatDraft(); });
}
function matPickImages(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange = async ()=>{
    const files = [...inp.files].filter(f=>f.type && f.type.startsWith("image/"));
    for(const f of files){
      if(matDraft.images.length>=6){ toast("Tối đa 6 ảnh mỗi mã"); break; }
      try{
        const blob = await resizeImageBlob(f);
        const path = `ffe/_catalog/materials/${slug(matDraft.uploadKey)}/${Date.now()}.jpg`;
        matDraft.images.push(await uploadToStorage(path, blob, "image/jpeg"));
        paintMatMedia(); await persistMatDraft();
      }catch(e){ toast("Không tải được ảnh lên: "+e.message); }
    }
    inp.remove();
  };
  inp.click();
}
// Gắn nhiều ảnh cùng lúc theo tên file trùng Mã vật tư (vd file "LW575JW-F4W.jpg" tự khớp vào mã đó).
// Excel không nhúng ảnh trực tiếp được (SheetJS không đọc ảnh chèn trong ô) nên đây là lối tắt thay thế:
// đặt tên ảnh trùng mã rồi chọn cả chùm 1 lần, khỏi phải mở từng mã lên tải ảnh thủ công.
function matBulkUploadByFilename(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange = ()=>{
    const files = [...inp.files].filter(f=>f.type && f.type.startsWith("image/"));
    inp.remove();
    bulkAttachImagesByFilename(files);
  };
  inp.click();
}
async function bulkAttachImagesByFilename(files){
  if(!files.length) return;
  toast(`Đang tải ${files.length} ảnh…`);
  const pending = {}; // slug(mã) -> mảng images đang tích luỹ, để nhiều ảnh cùng mã không ghi đè nhau
  let ok = 0; const misses = [];
  for(const f of files){
    const base = f.name.replace(/\.[^.]+$/, "").trim().toUpperCase();
    const m = base ? findMaterial(base) : null;
    if(!m){ misses.push(f.name); continue; }
    const key = slug(m.code);
    if(!pending[key]) pending[key] = (m.images||[]).slice();
    if(pending[key].length >= 6){ misses.push(`${f.name} (${m.code} đã đủ 6 ảnh)`); continue; }
    try{
      const blob = await resizeImageBlob(f);
      const path = `ffe/_catalog/materials/${key}/${Date.now()}_${ok}.jpg`;
      pending[key].push(await uploadToStorage(path, blob, "image/jpeg"));
      await CATALOG_COL.doc(key).set({
        images: pending[key].slice(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
      }, {merge:true});
      ok++;
    }catch(e){ misses.push(`${f.name} (lỗi tải lên)`); }
  }
  let msg = ok ? `Đã gắn ${ok} ảnh theo tên file trùng Mã vật tư` : `Không gắn được ảnh nào`;
  if(misses.length) msg += ` — ${misses.length} ảnh không khớp/lỗi: ${misses.slice(0,4).join(", ")}${misses.length>4?"…":""}`;
  toast(msg);
  if(ui.dialog && ui.dialog.type==="materials") openMaterialLibrary();
}

function importMaterialFile(file){
  if(typeof XLSX==="undefined"){ toast("Thư viện Excel chưa tải xong"); return; }
  const fr = new FileReader();
  fr.onload = async ()=>{
    let json;
    try{
      const wb = XLSX.read(fr.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      json = XLSX.utils.sheet_to_json(ws, {defval:""});
    }catch(e){ toast("Không đọc được file"); return; }
    if(!json.length){ toast("File rỗng"); return; }
    const keys = Object.keys(json[0]);
    const alias = {
      code:["mã vật tư","mã cố định","code"],
      name:["tên hạng mục","tên","name"],
      vendor:["nhà cung cấp","ncc","vendor","supplier"],
      model:["mã ncc","mã / model","mã model","model","vendor ref","ký mã hiệu"],
      uom:["đvt","đơn vị tính","đơn vị","uom"],
      unit:["đơn giá","don gia","unit price","giá"],
      dims:["kích thước","dims","size","kt"],
      finish:["hoàn thiện","finish"],
    };
    // "mã" một mình quá ngắn/mập mờ (dễ khớp nhầm "Mã NCC") — chỉ nhận đúng tên cột cho field code, các field khác vẫn cho includes().
    const colFor = {};
    keys.forEach(k=>{ const kl=String(k).toLowerCase().trim();
      for(const [f,al] of Object.entries(alias)){
        const hit = f==="code" ? al.some(a=>kl===a) : al.some(a=>kl===a||kl.includes(a));
        if(hit){ if(!colFor[f]) colFor[f]=k; }
      }
    });
    if(!colFor.code || !colFor.name){ toast('Không tìm thấy cột "Mã vật tư" và/hoặc "Tên hạng mục"'); return; }
    const rows = json.map(r=>{
      const g = f => colFor[f]!=null ? r[colFor[f]] : "";
      return {
        code: String(g("code")||"").trim().toUpperCase(),
        name: String(g("name")||"").trim(),
        vendor: String(g("vendor")||"").trim() || null,
        model: String(g("model")||"").trim() || undefined,
        uom: String(g("uom")||"").trim() || "chiếc",
        unit: parseMoneyLike(g("unit")),
        dims: String(g("dims")||"").trim() || undefined,
        finish: String(g("finish")||"").trim() || undefined,
      };
    }).filter(r=>r.code && r.name);
    if(!rows.length){ toast("Không có dòng hợp lệ (cần có Mã vật tư và Tên hạng mục)"); return; }
    try{
      const CHUNK = 200; // để dành chỗ cho ghi lịch sử trong cùng batch (giới hạn Firestore 500 ghi/batch)
      let created=0, updated=0;
      for(let i=0;i<rows.length;i+=CHUNK){
        const batch = db.batch();
        rows.slice(i,i+CHUNK).forEach(rec=>{
          const id = slug(rec.code);
          const existing = catalog.find(c=>c.code===rec.code);
          if(existing){ batch.set(CATALOG_COL.doc(id).collection("history").doc(), {...existing, imagePos:undefined, _archivedAt: firebase.firestore.FieldValue.serverTimestamp()}); updated++; }
          else created++;
          batch.set(CATALOG_COL.doc(id), {
            ...rec,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null
          }, {merge:true});
        });
        await batch.commit();
      }
      closeDialog(); openMaterialLibrary();
      toast(`Đã thêm ${created} mã mới, cập nhật ${updated} mã đã có (đã lưu lịch sử) — giờ chỉ cần bổ sung ảnh`);
    }catch(err){ toast("Không nhập được — "+err.message); }
  };
  fr.readAsArrayBuffer(file);
}

const XCOLS = [
  ["Mã","code"],["Mã vật tư","matCode"],["Tên hạng mục","name"],["Phòng","room"],["Nhóm","category"],["Nhà cung cấp","vendor"],
  ["Mã/Model","model"],["ĐVT","uom"],["Số lượng","qty"],["Đơn giá","unit"],
  ["Thành tiền","_total"],["Lead (tuần)","lead"],["Trạng thái","status"],["PO","po"],
  ["Kích thước","dims"],["Ghi chú","note"],
];
const STATUS_FROM_VN = Object.fromEntries(Object.entries(STATUS_LABEL).map(([k,v])=>[v.toLowerCase(),k]));
// Parse số tiền từ Excel/CSV: chấp nhận "1.200.000", "1200000", "1.200.000,50", "1200000,5"...
function parseMoneyLike(v){
  if(v==null || String(v).trim()==="") return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  let s = String(v).trim().replace(/[^\d,.\-]/g,"");
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",",".");   // 1.200.000,50
  else if((s.match(/\./g)||[]).length>1) s = s.replace(/\./g,"");                     // 1.200.000
  else if(s.includes(",")) s = s.replace(",",".");                                    // 1200000,5
  const n = Number(s); return isFinite(n) ? n : null;
}
function itemsToRows(){
  return items.map(it=>{
    const o = {};
    XCOLS.forEach(([h,f])=>{
      if(f==="_total") o[h] = lineTotal(it)==null?"":lineTotal(it);
      else if(f==="status") o[h] = STATUS_LABEL[it.status];
      else o[h] = it[f]==null ? "" : it[f];
    });
    return o;
  });
}

function exportXlsx(templateOnly){
  if(typeof XLSX==="undefined"){ toast("Thư viện Excel chưa tải xong, thử lại"); return; }
  const data = templateOnly
    ? [Object.fromEntries(XCOLS.map(([h])=>[h,""])), {"Mã":"TT-999","Tên hạng mục":"Ví dụ – vòi lavabo","Phòng":"WC Tầng 1","Nhà cung cấp":"TOTO","ĐVT":"chiếc","Số lượng":1,"Đơn giá":1500000,"Trạng thái":"Đã chốt"}]
    : itemsToRows();
  const ws = XLSX.utils.json_to_sheet(data, {header:XCOLS.map(([h])=>h)});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "FF&E");
  try{
    XLSX.writeFile(wb, templateOnly?"FFE_mau.xlsx":"FFE_HaDo_TOTO.xlsx");
    toast(templateOnly?"Đã tải file mẫu":"Đã xuất .xlsx");
  }catch(e){
    toast("Trình duyệt chặn tải file ở đây — dùng “Chép CSV” rồi dán vào Excel");
  }
}
function exportCsv(){
  const rows = itemsToRows();
  const head = XCOLS.map(([h])=>h);
  const lines = [head.join(",")].concat(rows.map(r=>head.map(h=>{
    let c = String(r[h]??""); return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
  }).join(",")));
  const txt = lines.join("\n");
  (navigator.clipboard?.writeText(txt) || Promise.reject()).then(
    ()=>toast("Đã chép bảng kê (CSV) — dán vào Excel/Sheets"),
    ()=>toast("Không chép được clipboard")
  );
}
function importFile(file){
  if(typeof XLSX==="undefined"){ toast("Thư viện Excel chưa tải xong"); return; }
  const fr = new FileReader();
  fr.onload = ()=>{
    let json;
    try{
      const wb = XLSX.read(fr.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      json = XLSX.utils.sheet_to_json(ws, {defval:""});
    }catch(e){ toast("Không đọc được file"); return; }
    if(!json.length){ toast("File rỗng"); return; }
    // map headers
    const keys = Object.keys(json[0]);
    const alias = {code:["mã","ma","code"],matCode:["mã vật tư","mã cố định"],name:["tên hạng mục","tên","ten","name","hạng mục","item"],
      room:["phòng","phong","room"],category:["nhóm","nhom","category","phân loại"],
      vendor:["nhà cung cấp","ncc","vendor","supplier"],
      model:["mã/model","model","vendor ref","ký mã hiệu"],uom:["đvt","đơn vị tính","đơn vị","uom","unit of measure"],
      qty:["số lượng","sl","qty","quantity"],unit:["đơn giá","don gia","unit price","giá","đơn giá (vnđ)","đơn giá (₫)"],
      lead:["lead","lead (tuần)","lead time","thời gian"],status:["trạng thái","status"],po:["po","đơn hàng"],
      dims:["kích thước","dims","size","kt"],note:["ghi chú","note","mô tả","description"]};
    const colFor = {};
    // "code" (mã nội bộ) chỉ khớp đúng tên cột — không dùng includes(), tránh "mã" nuốt luôn cột "Mã vật tư"/"Mã/Model".
    keys.forEach(k=>{ const kl=String(k).toLowerCase().trim();
      for(const [f,al] of Object.entries(alias)){
        const hit = f==="code" ? al.some(a=>kl===a) : al.some(a=>kl===a||kl.includes(a));
        if(hit){ if(!colFor[f]) colFor[f]=k; }
      }
    });
    if(!colFor.name){ toast("Không tìm thấy cột “Tên hạng mục”"); return; }
    const parsed = json.map(r=>{
      const g = f => colFor[f]!=null ? r[colFor[f]] : "";
      const st = String(g("status")||"").toLowerCase().trim();
      const numv = parseMoneyLike;
      const catRaw = String(g("category")||"").trim();
      const base = {
        code:String(g("code")||"").trim(),
        matCode:String(g("matCode")||"").trim().toUpperCase() || undefined,
        name:String(g("name")||"").trim(),
        room:String(g("room")||"").trim() || "(chưa phân phòng)",
        category:CATEGORIES.includes(catRaw) ? catRaw : "",
        vendor:String(g("vendor")||"").trim() || null,
        model:String(g("model")||"").trim() || undefined,
        uom:String(g("uom")||"").trim() || "chiếc",
        qty:Math.max(1, numv(g("qty"))||1),
        unit:numv(g("unit")),
        lead:numv(g("lead")),
        status:STATUS_FROM_VN[st] || (STATUSES.includes(g("status"))?g("status"):"Specified"),
        po:String(g("po")||"").trim() || undefined,
        dims:String(g("dims")||"").trim() || undefined,
        note:String(g("note")||"").trim() || undefined,
      };
      if(!base.category) base.category = guessCategory(base);
      return base;
    }).filter(x=>x.name);
    if(!parsed.length){ toast("Không có dòng hợp lệ"); return; }
    ui.dialog={type:"importConfirm"};

        <p style="margin-top:10px">Chọn cách nhập:</p>
      </div>
      <footer>
        <button class="btn btn-sm" data-close>Huỷ</button>
        <button class="btn btn-primary btn-sm" id="imp_run">Nhập dữ liệu</button>
      </footer>
    `);
    // Không còn "Thay thế toàn bộ" (dễ ghi đè mất dữ liệu cũ). Dòng nào có "Mã" trùng hạng mục đã có thì
    // CẬP NHẬT tại chỗ (giữ nguyên ảnh/tệp/PO... không có trong file Excel); dòng mới thì thêm vào.
    $("#imp_run").onclick = ()=>{
      newRooms.forEach(r=> rooms.push({name:r, budget:0}));
      let added=0, updated=0;
      parsed.forEach(p=>{
        const existing = p.code ? items.find(i=>i.code===p.code) : null;
        addVendor(p.vendor);
        if(existing){
          Object.assign(existing, p, {code:existing.code, ord:existing.ord});
          updated++;
        } else {
          if(!p.code || items.some(i=>i.code===p.code)) p.code = nextCode();
          p.ord = nextOrd();
          items.push(p);
          added++;
        }
      });
      closeDialog(); save();
      toast(`Đã thêm ${added} hạng mục mới, cập nhật ${updated} hạng mục đã có`);
      render();
    };
  };
  fr.readAsArrayBuffer(file);
}

// ── inline edit ───────────────────────────────────────────────
function beginInline(cell){
  if(cell.querySelector("input,select")) return;
  const ed = cell.dataset.ed;
  const roomMode = ed.startsWith("room.");
  const field = roomMode ? ed.slice(5) : ed;
  const it = roomMode ? null : items.find(i=>i.code===cell.dataset.code);
  if(!roomMode && !it) return;
  let el;
  if(field==="status"){
    el = document.createElement("select");
    el.innerHTML = STATUSES.map(s=>`<option value="${s}" ${it.status===s?"selected":""}>${STATUS_LABEL[s]}</option>`).join("");
  } else if(field==="category"){
    el = document.createElement("select");
    el.innerHTML = CATEGORIES.map(c=>`<option ${((it.category||"Khác")===c)?"selected":""}>${c}</option>`).join("");
  } else if(["qty","unit","lead","budget"].includes(field)){
    el = document.createElement("input"); el.type="number"; el.min="0";
    el.value = roomMode ? roomBudget(cell.dataset.room) : (it[field]??"");
  } else {
    el = document.createElement("input"); el.type="text";
    if(field==="vendor") el.setAttribute("list","vendorlist");
    if(field==="matCode") el.setAttribute("list","matlist");
    el.value = roomMode ? cell.dataset.room : (it[field]??"");
  }
  el.className = "ed-input";
  cell.textContent = ""; cell.appendChild(el);
  el.focus(); if(el.select) el.select();
  let done = false;
  const finish = commitFn => { if(done) return; done = true; commitFn(); };
  el.addEventListener("keydown", ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); }
    else if(ev.key==="Escape"){ ev.preventDefault(); finish(()=>render()); }
  });
  el.addEventListener("blur", ()=> finish(()=>{
    if(roomMode) commitRoom(cell.dataset.room, field, el.value);
    else commitItem(cell.dataset.code, field, el.value);
  }));
}
function commitItem(code, field, raw){
  const it = items.find(i=>i.code===code); if(!it){ render(); return; }
  const v = String(raw).trim();
  if(field==="qty") it.qty = Math.max(1, +v||1);
  else if(field==="unit"){ it.unit = v==="" ? null : Math.max(0, Number(v.replace(/[^\d.-]/g,""))||0); it.priceOverridden = true; }
  else if(field==="lead") it.lead = v==="" ? null : Math.max(0, +v||0);
  else if(field==="status") it.status = STATUSES.includes(raw) ? raw : it.status;
  else if(field==="vendor"){ it.vendor = v || null; addVendor(it.vendor); }
  else if(field==="name") it.name = v || it.name;
  else if(field==="category") it.category = CATEGORIES.includes(raw) ? raw : it.category;
  else if(field==="po"){ it.po = v || undefined; if(it.po && it.stage==null){ it.stage=2; if(it.status!=="Ordered") it.status="Ordered"; } }
  else if(field==="matCode"){
    const mc = v.toUpperCase();
    it.matCode = mc || undefined;
    if(mc){
      const m = findMaterial(mc);
      if(m){
        it.name = m.name || it.name;
        if(m.vendor){ it.vendor = m.vendor; addVendor(it.vendor); }
        it.model = m.model || it.model;
        it.uom = m.uom || it.uom;
        if(m.unit!=null && !it.priceOverridden) it.unit = m.unit;
        it.dims = m.dims || it.dims;
        it.finish = m.finish || it.finish;
      } else toast(`Không tìm thấy mã "${mc}" trong thư viện — vẫn lưu mã, thêm mã này vào Thư viện vật tư sau`);
    }
  }
  save(); render();
}
function commitRoom(name, field, raw){
  const r = rooms.find(x=>x.name===name); if(!r){ render(); return; }
  if(field==="budget"){ r.budget = Math.max(0, Number(String(raw).replace(/[^\d.-]/g,""))||0); }
  else if(field==="name"){
    const nn = String(raw).trim();
    if(nn && nn!==name){
      if(rooms.some(x=>x.name===nn)){ toast("Tên phòng đã tồn tại"); render(); return; }
      items.forEach(i=>{ if(i.room===name) i.room=nn; });
      if(ui.room===name) ui.room=nn;
      r.name = nn;
    }
  }
  save(); render();
}

// ── images ────────────────────────────────────────────────────
function resizeImageBlob(file, max=900, q=0.72){
  return new Promise((res,rej)=>{
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = ()=>{
      const img = new Image(); img.onerror = rej;
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        if(Math.max(w,h) > max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(b=> b ? res(b) : rej(new Error("Không nén được ảnh")), "image/jpeg", q);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function slug(s){ return String(s||"").replace(/[^a-zA-Z0-9_.-]+/g,"_").slice(0,80) || "x"; }
async function uploadToStorage(path, blob, contentType){
  const ref = fbStorage.ref().child(path);
  await ref.put(blob, contentType ? {contentType} : undefined);
  return await ref.getDownloadURL();
}
async function addImages(code, fileList){
  const it = items.find(i=>i.code===code); if(!it) return;
  const files = [...(fileList||[])].filter(f=>f && f.type && f.type.startsWith("image/"));
  if(!files.length) return;
  it.images = it.images || [];
  let added = 0;
  for(const f of files){
    if(it.images.length >= 6){ toast("Tối đa 6 ảnh mỗi hạng mục"); break; }
    try{
      const blob = await resizeImageBlob(f);
      const path = `ffe/${currentProjectId}/items/${slug(code)}/${Date.now()}_${added}.jpg`;
      it.images.push(await uploadToStorage(path, blob, "image/jpeg"));
      added++; render();
    }catch(e){ toast("Không tải được ảnh lên: "+e.message); }
  }
  if(added){ save(); toast(added+" ảnh đã thêm vào "+code); }
  render();
}
function pickImages(code){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange = ()=>{ addImages(code, inp.files).finally(()=> inp.remove()); };
  inp.click();
}
function pasteImage(e){
  if(!ui.detail || ui.dialog || RO()) return;

// ── tệp đính kèm & liên kết: tải thẳng lên Firebase Storage, Firestore chỉ giữ đường dẫn (URL) ──
function fsize(b){ b=+b||0; return b<1024?b+" B" : b<1048576?(b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB"; }
async function addFiles(code, fileList){
  const it = items.find(i=>i.code===code); if(!it) return;
  const files = [...(fileList||[])].filter(f=>f && f.size!=null);
  if(!files.length) return;
  it.files = it.files || [];
  let added = 0;
  for(const f of files){
    if(it.files.length >= 8){ toast("Tối đa 8 tệp mỗi hạng mục"); break; }
    if(f.size > 15*1048576){ toast(`"${f.name}" quá lớn (> 15 MB) — bỏ qua`); continue; }
    try{
      const path = `ffe/${currentProjectId}/items/${slug(code)}/files/${Date.now()}_${slug(f.name)}`;
      const url = await uploadToStorage(path, f, f.type || undefined);
      it.files.push({name:f.name, type:f.type||"", size:f.size, url});
      added++; render();
    }catch(e){ toast("Không tải được "+f.name+": "+e.message); }
  }
  if(added){ save(); toast(added+" tệp đã đính kèm"); }
  render();
}

  inp.type="file"; inp.multiple=true; inp.style.display="none";

// Ô tìm kiếm gõ-là-lọc-ngay (softRerender) — mỗi lần render() thay hẳn innerHTML nên input cũ bị huỷ và
// input mới được tạo lại, một cờ gắn trên phần tử input (kiểu el._keep=true) sẽ KHÔNG theo sang phần tử
// mới đó — focus bị rớt lặng lẽ, gõ tiếp thì không có ô nào đang nhận ký tự. Dùng biến ngoài (không gắn
// trên node) để nhớ ô nào ĐANG cần giữ focus, gọi lại hàm này mỗi lần dựng lại ô input đó sau render.
let focusedInputId = null;
function wireSearchInput(id, onInput){
  const el = $("#"+id);
  if(!el) return;
  el.oninput = e=>{ onInput(e.target.value); focusedInputId = id; softRerender(); };
  // Khi render() thay hẳn innerHTML, trình duyệt tự bắn "blur" cho input cũ vì nó bị gỡ khỏi DOM —
  // KHÔNG được coi đó là người dùng rời khỏi ô: lúc đó relatedTarget luôn rỗng (focus rơi về body, không
  // "sang" phần tử cụ thể nào). Chỉ khi relatedTarget có giá trị (bấm hẳn sang 1 phần tử khác) mới thật
  // sự rời ô, lúc đó mới xoá cờ giữ focus.
  el.onblur = e=>{ if(e.relatedTarget) focusedInputId=null; };
  if(focusedInputId===id){ el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length); }
}
