      else if(a==="materials") openMaterialLibrary();
      else if(a==="excel") openExcel();
      else if(a==="autocat"){ if(confirm("Tự động phân nhóm lại toàn bộ hạng mục dựa trên mô tả? Nhóm đã tự chỉnh sẽ bị ghi đè.")) autoClassifyAll(); else render(); }
      else if(a==="client") setMode("client");
      else if(a==="admin") setMode("admin");
      else if(a==="csv"){ exportCsv(); render(); }
      else if(a==="signout"){ signOutApp(); }
      else render();
    });
  }

  if(ui.tab==="schedule" && ui.detail){ wireDetail(); return; }
  if(ui.tab!=="schedule") return;

  const railHero = $("#railHero");
  if(railHero){
    railHero.onmouseenter = ()=> showImageZoom(railHero, railHero.dataset.full, railHero.dataset.pos);
    railHero.onmouseleave = hideImageZoom;
  }

  wireSearchInput("q", v=>{ ui.q = v; });
  $("#fRoom") && ($("#fRoom").onchange = e=>{ ui.room=e.target.value; render(); });
  $("#fStatus") && ($("#fStatus").onchange = e=>{ ui.status=e.target.value; render(); });
  $("#fVendor") && ($("#fVendor").onchange = e=>{ ui.vendor=e.target.value; render(); });
  $("#fCat") && ($("#fCat").onchange = e=>{ ui.cat=e.target.value; render(); });
  $("#fMatCode") && ($("#fMatCode").onchange = e=>{ ui.matCodeFilter=e.target.value; render(); });
  $("#clearLead") && ($("#clearLead").onclick = ()=>{ ui.leadOnly=false; render(); });
  $("#addLead") && ($("#addLead").onclick = ()=>{ ui.leadOnly=true; render(); });
  $("#clearAll") && ($("#clearAll").onclick = ()=>{ ui.q="";ui.room="";ui.status="";ui.vendor="";ui.cat="";ui.matCodeFilter="";ui.leadOnly=false; render(); });
  document.querySelectorAll("[data-view]").forEach(b=> b.onclick = ()=>{ ui.view=b.dataset.view; render(); });
  $("#addItem") && ($("#addItem").onclick = ()=> openAdd());
  $("#addRoom") && ($("#addRoom").onclick = openRooms);

  document.querySelectorAll("[data-sort]").forEach(b=> b.onclick = ()=>{
    const k=b.dataset.sort;
    if(ui.sortKey!==k){ ui.sortKey=k; ui.sortDir=1; }
    else if(ui.sortDir===1){ ui.sortDir=-1; }
    else { ui.sortKey="ord"; ui.sortDir=1; }   // lần bấm thứ 3: về thứ tự thủ công
    render();
  });
  document.querySelectorAll("[data-addto]").forEach(b=> b.onclick = e=>{ e.stopPropagation(); openAdd(b.dataset.addto); });
  document.querySelectorAll("[data-delroom]").forEach(b=> b.onclick = e=>{ e.stopPropagation(); deleteRoom(b.dataset.delroom); });

  const rowClick = e=>{
    if(e.target.closest(".ed")) return;
    const pick = e.target.closest("[data-pick]");
    if(pick){ e.stopPropagation(); togglePick(pick.dataset.pick); return; }
    const del = e.target.closest("[data-del]");
    if(del){ e.stopPropagation(); if(confirm("Xoá hạng mục "+del.dataset.del+"?")) deleteItems([del.dataset.del]); return; }
    const open = e.target.closest("[data-open]");
    if(open){ selectItem(open.dataset.open); return; }
    const row = e.target.closest("[data-code]");
    if(row) selectItem(row.dataset.code);
  };
  document.querySelectorAll(".trow,.cardrow,.btile").forEach(r=>{
    r.onclick = rowClick;
    r.ondblclick = ()=>{ if(r.dataset.code) openDetail(r.dataset.code); };
    r.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); rowClick(e); } };
  });
  document.querySelectorAll("[data-pick]").forEach(c=> c.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); togglePick(c.dataset.pick); } });

  $("#openDetail") && ($("#openDetail").onclick = ()=> openDetail(ui.selected));
  $("#editSpec") && ($("#editSpec").onclick = ()=> openEdit(ui.selected));
  $("#addPo") && ($("#addPo").onclick = ()=>{
    const it = items.find(i=>i.code===ui.selected);
    if(it.po){ ui.tab="orders"; render(); return; }
    ui.picks.add(it.code); render(); toast("Đã đưa vào lựa chọn — bấm “Tạo PO”");
  });

  $("#makePo") && ($("#makePo").onclick = createPoFromPicks);
  $("#clearPicks") && ($("#clearPicks").onclick = ()=>{ ui.picks.clear(); render(); });
  $("#bulkDelete") && ($("#bulkDelete").onclick = ()=>{
    if(confirm(`Xoá ${ui.picks.size} hạng mục đang chọn?`)) deleteItems([...ui.picks]);
  });
  $("#markSpec") && ($("#markSpec").onclick = ()=>{
    items.forEach(i=>{ if(ui.picks.has(i.code) && i.status==="Unspecified") i.status="Specified"; });
    ui.picks.clear(); save(); render(); toast("Đã đánh dấu đã chốt");
  });
}

function wireDetail(){
  $("[data-back]") && ($("[data-back]").onclick = ()=>{ ui.detail=null; render(); });
  document.querySelectorAll("[data-go]").forEach(b=> b.onclick = ()=>{ if(b.dataset.go) openDetail(b.dataset.go); });
  $("[data-edit]") && ($("[data-edit]").onclick = ()=> openEdit(ui.detail));
  $("[data-dup]") && ($("[data-dup]").onclick = ()=> openDuplicate(ui.detail));
  $("[data-viewpo]") && ($("[data-viewpo]").onclick = ()=>{ ui.detail=null; ui.tab="orders"; render(); });
  $("[data-quickpo]") && ($("[data-quickpo]").onclick = ()=> quickPo(ui.detail));
  $("[data-deldetail]") && ($("[data-deldetail]").onclick = ()=>{ if(confirm("Xoá hạng mục "+ui.detail+"?")) deleteItems([ui.detail]); });

  document.querySelectorAll("[data-pick-img]").forEach(el=> el.onclick = ()=> pickImages(ui.detail));
  document.querySelectorAll("[data-thumb]").forEach(el=> el.onclick = e=>{
    if(e.target.closest("[data-rmimg]")) return;
    const i = +el.dataset.thumb, it = items.find(x=>x.code===ui.detail);
    if(it && i>0){ it.images.unshift(it.images.splice(i,1)[0]); save(); render(); }
  });
  document.querySelectorAll("[data-rmimg]").forEach(el=> el.onclick = e=>{
    e.stopPropagation();
    const i = +el.dataset.rmimg, it = items.find(x=>x.code===ui.detail);
    if(it && it.images){ it.images.splice(i,1); if(!it.images.length) delete it.images; save(); render(); toast("Đã xoá ảnh"); }
  });
  $("[data-togglepos]") && ($("[data-togglepos]").onclick = e=>{ e.stopPropagation(); ui.posPicker = !ui.posPicker; render(); });
  document.querySelectorAll("[data-setpos]").forEach(el=> el.onclick = e=>{
    e.stopPropagation();
    const it = items.find(x=>x.code===ui.detail), img = it && it.images && it.images[0];
    if(it && img){ it.imagePos = it.imagePos||{}; it.imagePos[img] = el.dataset.setpos; save(); }
    ui.posPicker = false; render();
  });

  $("[data-pick-file]") && ($("[data-pick-file]").onclick = ()=> pickFiles(ui.detail));
  $("[data-add-link]") && ($("[data-add-link]").onclick = ()=> openLinkDialog(ui.detail));
  document.querySelectorAll("[data-file]").forEach(el=> el.onclick = e=>{
    if(e.target.closest("[data-rmfile]")) return;
    openFile(ui.detail, +el.dataset.file);
  });
  document.querySelectorAll("[data-rmfile]").forEach(el=> el.onclick = e=>{ e.stopPropagation(); removeFile(ui.detail, +el.dataset.rmfile); });
  document.querySelectorAll("[data-rmlink]").forEach(el=> el.onclick = e=>{ e.stopPropagation(); removeLink(ui.detail, +el.dataset.rmlink); });

  const dz = $(".dleft");
  if(dz && !RO()){
    dz.ondragover = e=>{ e.preventDefault(); dz.classList.add("drop"); };
    dz.ondragleave = ()=> dz.classList.remove("drop");
    dz.ondrop = e=>{
      e.preventDefault(); dz.classList.remove("drop");
      const all = [...(e.dataTransfer.files||[])];
      const imgs = all.filter(f=>f.type && f.type.startsWith("image/"));
      const rest = all.filter(f=>!(f.type && f.type.startsWith("image/")));
      if(imgs.length) addImages(ui.detail, imgs);
      if(rest.length) addFiles(ui.detail, rest);
    };
  }
}
</script>
